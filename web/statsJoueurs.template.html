/* -- fiche adversaire : classement, résultats de poule, composition type, effectif, confrontations avec le GAB */
const lienAdv = (r, contenu) => r.adversaire_equipe_id && IC.adversaires?.[r.adversaire_equipe_id]
  ? `<a href="#ic/adv/${r.adversaire_equipe_id}" title="Fiche de l'adversaire">${contenu}</a>` : contenu;
function icAdversaire(el, id) {
  const adv = IC.adversaires?.[id];
  if (!adv) { el.innerHTML = `<div class="card empty">Adversaire introuvable.</div>`; return; }
  const e = IC.equipes.find(x => x.rencontres.some(r => r.adversaire_equipe_id === id));
  const ligne = e?.classement.find(c => c.equipe_id === id) || {};
  const nos = (e?.rencontres || []).filter(r => r.adversaire_equipe_id === id);
  const leurs = (adv.rencontres || []).filter(r => r.score && r.score[0] + r.score[1] > 0).map(r => {
    const dom = (r.domicile || "").includes(adv.code), [a, b] = r.score;
    const pour = dom ? a : b, contre = dom ? b : a;
    return { ...r, autre: dom ? r.exterieur : r.domicile, pour, contre, res: pour > contre ? "V" : pour < contre ? "D" : "N" };
  });
  const joueurs = (adv.joueurs || []).map(p => ({ ...p, cotes: p.classements.map(c => c.cote), classements: p.classements.map(c => c.classement) }));
  const parLic = new Map(joueurs.map(p => [p.licence, p]));
  el.innerHTML = `<div class="chips subnav">${e ? `<a class="chip" href="#ic/${e.numero}">← Équipe ${e.numero}</a>` : ""}</div>
    <div class="card hero"><div class="who"><h2>${esc(adv.nom)}</h2>
      <div class="small muted" style="margin-top:6px">${e ? `${esc(e.division_titre)} · adversaire de l'équipe ${e.numero} · ` : ""}<a href="https://icbad.ffbad.org/equipe/${esc(id)}" target="_blank" rel="noopener">voir sur icbad</a></div></div>
      <div class="stat"><div class="v num">${ordinal(ligne.rang)}</div><div class="l">sur ${e?.nb_equipes ?? "?"} · ${ligne.pts ?? "–"} pts</div></div>
      <div class="stat"><div class="v num">${ligne.g ?? "–"}-${ligne.n ?? "–"}-${ligne.p ?? "–"}</div><div class="l">victoires – nuls – défaites</div></div>
      <div class="stat"><div class="v num">${signed(ligne.diff_matchs)}</div><div class="l">matchs +/-</div></div></div>
    <section><h2>Face au GAB</h2><div class="card scroll"><table class="t"><thead><tr><th>Journée</th><th>Date</th><th></th><th class="r">Score GAB</th><th></th></tr></thead><tbody>
      ${nos.map(r => `<tr><td>${esc(r.journee)}</td><td class="num">${r.date ? fDate(r.date) : "–"}</td><td><span class="tag">${r.domicile ? "GAB reçoit" : "à l'extérieur"}</span></td>
        <td class="r num">${r.jouee ? `<span class="res ${resRencontre(r) === "V" ? "v" : resRencontre(r) === "D" ? "d" : ""}">${resRencontre(r)}</span> ${r.score_club}-${r.score_adv}` : `<span class="muted">à venir</span>`}</td>
        <td>${e && e.numero <= (IC.equipes_planificateur || 6) && r.date ? `<a class="eq" href="#plan/${samediDe(r.date)}/${r.id}">${r.jouee ? "feuille" : "composer"}</a>` : ""}</td></tr>`).join("")}</tbody></table></div></section>
    <section><h2>Leurs résultats de poule</h2><div class="card scroll">${leurs.length ? `<table class="t"><thead><tr><th>Journée</th><th>Date</th><th>Contre</th><th class="r">Score</th></tr></thead><tbody>
      ${leurs.map(r => `<tr><td>${esc(r.journee)}</td><td class="num">${r.date ? fDate(r.date) : "–"}</td><td>${esc(r.autre)}</td>
        <td class="r num"><span class="res ${r.res === "V" ? "v" : r.res === "D" ? "d" : ""}" style="${r.res === "N" ? "background:var(--muted)" : ""}">${r.res}</span> ${r.pour}-${r.contre}</td></tr>`).join("")}</tbody></table>` : `<div class="empty">Aucune rencontre jouée.</div>`}</div></section>
    <section><h2>Composition type</h2><p class="hint">Joueurs habituellement alignés (icbad), avec leur cote dans la discipline.</p><div class="card scroll"><table class="t"><tbody>
      ${(adv.composition_type || []).map(c => { const t = slotType(c.code), ps = c.joueurs.map(x => parLic.get(x.licence) || x);
        return `<tr><td><b>${slotLabel(c.code)}</b></td><td>${ps.map(x => `${esc(x.nom)}${badgeMute(x.mute)} <span class="muted small num">${fmt(coteDe(x, t))}</span>`).join(" / ")}</td>
          <td class="r num">${fmt(moyenne(ps.map(x => coteDe(x, t))))}</td></tr>`; }).join("")}</tbody></table></div></section>
    <section><h2>Effectif</h2><div class="card scroll" id="advEffectif"></div></section>`;
  sortableTable($("#advEffectif"), "advEff", [
    { k: "nom", label: "Joueur", val: r => r.nom, html: r => `${esc(r.nom)}${badgeMute(r.mute)}${r.capitaine ? ' <span class="tag" title="Capitaine">C</span>' : ""}` },
    { k: "sexe", label: "", val: r => r.sexe || "", sm: true },
    { k: "clt", label: "Clt S/D/M", val: r => Math.max(...r.cotes.map(c => c || 0)), html: clsBadges },
    { k: "renc", label: "Rencontres", val: r => r.rencontres, num: true },
    { k: "m", label: "Matchs", val: r => r.matchs, num: true, sm: true },
    { k: "pct", label: "% vict. IC", val: r => r.pct, html: r => r.matchs ? pct(r.pct) : "–", num: true },
  ], joueurs, { defaut: { cle: "renc", sens: -1 }, rowClass: r => r.rencontres ? "" : "few" });
}

/* -- vue globale */
function icGlobal(el) {
  const tous = IC.equipes.flatMap(icMatchs);
  const slots = slotsDe(tous);
  const rencontres = IC.equipes.flatMap(e => icRencontresJouees(e).map(r => ({ ...r, equipe: e })));
  const vnd = rs => ({ V: rs.filter(r => resRencontre(r) === "V").length, N: rs.filter(r => resRencontre(r) === "N").length, D: rs.filter(r => resRencontre(r) === "D").length });
  const g = vnd(rencontres);
  // joueurs : matchs, victoires, points de cote, équipes
  const parJoueur = new Map();
  for (const m of tous) for (const p of m.club) {
    if (!p.licence) continue;
    const x = parJoueur.get(p.licence) || { licence: p.licence, nom: p.nom, matchs: 0, v: 0, equipes: new Set(), rencontres: new Set() };
    x.matchs++; x.v += m.victoire ? 1 : 0; x.equipes.add(m.equipe.numero); x.rencontres.add(m.r.id);
    parJoueur.set(p.licence, x);
  }
  const joueurs = [...parJoueur.values()].map(x => ({ ...x, pct: x.v / x.matchs * 100, pts: ptsCote(x.licence) }));
  const top = (cle) => joueurs.filter(x => x[cle] != null).sort((a, b) => b[cle] - a[cle])[0];
  const tMatchs = top("matchs"), tV = top("v"), tPts = top("pts");
  const ligneBilan = (label, b, extra = "") => `<div class="row"><span>${label}</span><b class="num">${b.v}/${b.j} · ${cellVJ(b, { pctSeul: true })}${extra}</b></div>`;
  const dom = rencontres.filter(r => r.domicile), ext = rencontres.filter(r => !r.domicile);
  const vndTxt = x => `<span class="muted small">(${x.V} V – ${x.N} N – ${x.D} D)</span>`;

  el.innerHTML = `
    <div class="grid g4">
      <div class="card stat"><div class="v num">${rencontres.length}</div><div class="l">rencontres jouées · ${g.V} V – ${g.N} N – ${g.D} D</div></div>
      <div class="card stat"><div class="v num">${pct(vj(tous).pct)}</div><div class="l">de matchs gagnés (${vj(tous).v}/${tous.length})</div></div>
      <div class="card stat"><div class="v num">${IC.equipes.length}</div><div class="l">équipes engagées</div></div>
      <div class="card stat"><div class="v num">${joueurs.length}</div><div class="l">joueurs ont joué en interclubs · ${joueurs.filter(x => x.matchs >= 10).length} avec au moins 10 matchs</div></div>
    </div>
    <section><h2>Bilan par équipe</h2>
      <p class="hint">Victoires / matchs joués sur chaque match de la rencontre. Fond vert / rouge : plus / moins de 50 % de victoires. Cliquer une ligne pour la page de l'équipe.</p>
      <div class="card scroll" id="icEquipes"></div></section>
    <section><h2>Répartition</h2>
      <div class="grid g3">
        <div class="card tcard"><h3>Domicile / extérieur</h3>
          ${ligneBilan("Domicile", vj(dom.flatMap(r => r.matchs.filter(m => m.victoire != null))), " " + vndTxt(vnd(dom)))}
          ${ligneBilan("Extérieur", vj(ext.flatMap(r => r.matchs.filter(m => m.victoire != null))), " " + vndTxt(vnd(ext)))}
          <div class="warn">Matchs gagnés ; entre parenthèses, les rencontres.</div></div>
        <div class="card tcard"><h3>Simples / doubles / mixtes</h3>
          ${T.map(f => ligneBilan(f === "Simple" ? "Simples" : f === "Double" ? "Doubles" : "Mixtes", vj(tous.filter(m => famille(slotType(m.code)) === f)))).join("")}</div>
        <div class="card tcard"><h3>Hommes / femmes</h3>
          ${ligneBilan("Hommes", vj(tous.filter(m => sexesDuMatch(m).includes("H"))))}
          ${ligneBilan("Femmes", vj(tous.filter(m => sexesDuMatch(m).includes("F"))))}
          <div class="warn">Un mixte compte pour les deux.</div></div>
      </div></section>
    <section><h2>Joueurs</h2>
      <div class="grid g3">
        <div class="card fact"><span class="k">Le plus de matchs joués</span>${tMatchs ? `<span class="t">${lienJoueurIC(tMatchs.licence, tMatchs.nom)}</span><span class="s num">${tMatchs.matchs} matchs</span>` : "–"}</div>
        <div class="card fact"><span class="k">Le plus de matchs gagnés</span>${tV ? `<span class="t">${lienJoueurIC(tV.licence, tV.nom)}</span><span class="s num">${tV.v} victoires sur ${tV.matchs}</span>` : "–"}</div>
        <div class="card fact"><span class="k">Le plus de points de cote gagnés</span>${tPts ? `<span class="t">${lienJoueurIC(tPts.licence, tPts.nom)}</span><span class="s num ${deltaCls(tPts.pts)}">${signed(tPts.pts)} pts</span>` : `<span class="s muted">Pas de données de cote.</span>`}</div>
      </div>
      <p class="hint" style="margin-top:12px">Points de cote gagnés ou perdus en interclubs (résultats myffbad) : connus pour ${joueurs.filter(x => x.pts != null).length} joueurs sur ${joueurs.length}${icPrives.size ? `, ${joueurs.filter(x => x.pts == null && icPrives.has(x.licence)).length} profil(s) privé(s)` : ""}.</p>
      <div class="chips" id="icFiltreJoueurs" style="margin:6px 0 10px"></div>
      <div class="card scroll" id="icJoueurs"></div></section>
    <p class="hint">Calendriers des rencontres à ajouter à son agenda : ${IC.equipes.map(e => `<a href="calendrier-equipe-${e.numero}.ics">équipe ${e.numero}</a>`).join(" · ")} · <a href="calendrier-interclubs.ics">toutes les équipes</a>
      (dans Google Agenda : « Autres agendas » → « À partir de l'URL », avec l'adresse du lien, pour une mise à jour automatique).</p>
    <p class="hint">Source : <a href="${esc(IC.url)}" target="_blank" rel="noopener">icbad.ffbad.org</a> (feuilles de rencontre) ; points de cote : résultats joueurs myffbad.</p>`;

  sortableTable($("#icEquipes"), "icEquipes", [
    { k: "n", label: "Équipe", val: r => r.numero, html: r => `<span class="eq">Équipe ${r.numero}</span>`, pied: () => "Total" },
    { k: "div", label: "Division", val: r => r.division, title: "", html: r => `<span title="${esc(r.division_titre)}">${esc(r.division)}</span>` },
    { k: "rang", label: "Clt", val: r => r.rang, html: r => `${ordinal(r.rang)} <span class="muted small">/ ${r.nb_equipes}</span>`, num: true },
    { k: "vnd", label: "V-N-D", val: r => vnd(icRencontresJouees(r)).V, html: r => { const x = vnd(icRencontresJouees(r)); return `${x.V}-${x.N}-${x.D}`; }, num: true,
      pied: () => `${g.V}-${g.N}-${g.D}` },
    ...slots.map(s => ({ k: "s" + s.cle, label: s.label, val: r => vj(icMatchs(r).filter(m => slotCle(m.code) === s.cle)).pct,
      html: r => cellVJ(vj(icMatchs(r).filter(m => slotCle(m.code) === s.cle))), num: true,
      pied: () => cellVJ(vj(tous.filter(m => slotCle(m.code) === s.cle))) })),
    { k: "tot", label: "Total", val: r => vj(icMatchs(r)).pct, html: r => `<b>${cellVJ(vj(icMatchs(r)))}</b>`, num: true, pied: () => cellVJ(vj(tous)) },
  ], IC.equipes, { defaut: { cle: "n", sens: 1 }, lien: r => "#ic/" + r.numero, pied: true });

  const drawJoueurs = () => {
    const tousJ = !!state.icTousJoueurs, n3 = joueurs.filter(x => x.matchs >= 3).length;
    $("#icFiltreJoueurs").innerHTML = `<button class="chip" data-t="0" aria-pressed="${!tousJ}">Au moins 3 matchs (${n3})</button>
      <button class="chip" data-t="1" aria-pressed="${tousJ}">Tous (${joueurs.length})</button>`;
  sortableTable($("#icJoueurs"), "icJoueurs", [
    { k: "nom", label: "Joueur", val: r => r.nom, html: r => lienJoueurIC(r.licence, r.nom) },
    { k: "eq", label: "Rencontres par équipe", val: r => Math.min(...r.equipes), title: "⛔ : équipes où le joueur ne peut plus jouer (ICR art. 12, CD38 art. 8)",
      html: r => Object.entries(historiqueIC.get(r.licence) || {}).sort((a, b) => a[0] - b[0]).map(([n, k]) => `<a href="#ic/${n}" style="text-decoration:none">${chipRencontres(+n, k)}</a>`).join(" ") + " " + chipBlocage(compteurJoue(r.licence)) },
    { k: "renc", label: "Rencontres", val: r => r.rencontres.size, num: true, sm: true },
    { k: "m", label: "Matchs", val: r => r.matchs, num: true },
    { k: "v", label: "Victoires", val: r => r.v, num: true, sm: true },
    { k: "pct", label: "% vict.", val: r => r.pct, html: r => pct(r.pct), num: true },
    { k: "pts", label: "Pts cote", val: r => r.pts, html: r => cellPts(r.pts, r.licence), num: true },
  ], tousJ ? joueurs : joueurs.filter(x => x.matchs >= 3), { defaut: { cle: "m", sens: -1 }, rowClass: r => r.matchs < 3 ? "few" : "" });
  };
  $("#icFiltreJoueurs").onclick = ev => { const b = ev.target.closest("[data-t]"); if (!b) return; state.icTousJoueurs = b.dataset.t === "1"; drawJoueurs(); };
  drawJoueurs();
}

/* -- page d'une équipe */
function icEquipe(el, e) {
  const jouees = icRencontresJouees(e), avenir = e.rencontres.filter(r => !r.jouee);
  const ms = icMatchs(e), slots = slotsDe(ms);
  const vnd = { V: jouees.filter(r => resRencontre(r) === "V").length, N: jouees.filter(r => resRencontre(r) === "N").length, D: jouees.filter(r => resRencontre(r) === "D").length };
  const ligneClub = e.classement.find(c => c.club && c.code === e.code) || {};
  const aDeuxieme = ms.some(m => slotNum(m.code) >= 2);
  const tuile = (titre, b) => `<div class="card stat"><div class="v num">${b.j ? pct(b.pct) : "–"}</div><div class="l">${titre} · ${b.v}/${b.j}</div>${meter(b.pct, "var(--club)")}</div>`;
  // joueurs : bilan dans CETTE équipe d'après les feuilles de match
  const stats = new Map(e.joueurs.map(j => [j.licence, { ...j, m: 0, v: 0, slots: {} , renc: new Set() }]));
  for (const m of ms) for (const p of m.club) {
    if (!stats.has(p.licence)) stats.set(p.licence, { licence: p.licence, nom: p.nom, sexe: icSexe.get(p.licence), classements: [], m: 0, v: 0, slots: {}, renc: new Set() });
    const x = stats.get(p.licence);
    x.m++; x.v += m.victoire ? 1 : 0; x.renc.add(m.r.id);
    const lab = (slots.find(s => s.cle === slotCle(m.code)) || {}).label || m.code;
    x.slots[lab] = (x.slots[lab] || 0) + 1;
  }
  const joueurs = [...stats.values()].map(x => ({ ...x, pct: x.m ? x.v / x.m * 100 : null, pts: ptsCote(x.licence, e.numero) }));

  el.innerHTML = `
    <div class="card hero">
      <div class="who"><h2>Équipe ${e.numero} <span class="muted" style="font-weight:500">· ${esc(e.division)}</span></h2>
        <div class="small muted" style="margin-top:6px">${esc(e.division_titre)} · ${e.joueurs.length} joueurs inscrits ·
          <a href="https://icbad.ffbad.org/equipe/${esc(e.equipe_id)}" target="_blank" rel="noopener">voir sur icbad</a>
          · <a href="calendrier-equipe-${e.numero}.ics" title="Ajouter les rencontres de l'équipe à son agenda (fichier .ics, ou abonnement par l'adresse du lien)">📅 calendrier</a></div></div>
      <div class="stat"><div class="v num">${ordinal(e.rang)}</div><div class="l">sur ${e.nb_equipes} · ${ligneClub.pts ?? "–"} pts</div></div>
      <div class="stat"><div class="v num">${jouees.length}<span class="muted" style="font-size:16px"> / ${e.rencontres.length}</span></div><div class="l">rencontres jouées</div></div>
      <div class="stat"><div class="v num">${vnd.V}-${vnd.N}-${vnd.D}</div><div class="l">victoires – nuls – défaites</div></div>
      <div class="stat"><div class="v num">${pct(vj(ms).pct)}</div><div class="l">de matchs gagnés (${vj(ms).v}/${ms.length})</div></div>
    </div>
    <section><h2>Rencontres</h2>
      <p class="hint">Joueurs alignés sur chaque match ; fond vert = match gagné, rouge = perdu (survoler pour le score).${e.numero <= (IC.equipes_planificateur || 6) ? " Cliquer l'adversaire pour la feuille de match dans le planificateur." : ""}</p>
      <div class="card scroll" id="icRenc"></div></section>
    ${avenir.length ? `<section><h2>À venir</h2><div class="card scroll"><table class="t"><thead><tr><th>Journée</th><th>Date</th><th></th><th>Adversaire</th><th class="hide-sm">Lieu</th></tr></thead><tbody>
      ${avenir.map(r => `<tr><td>${esc(r.journee)}</td><td class="num" style="white-space:nowrap">${r.date ? fDate(r.date) : "–"}${r.heure ? ` · ${esc(r.heure)}` : ""}</td>
        <td><span class="tag">${r.domicile ? "Domicile" : "Extérieur"}</span></td><td>${lienPlan(e, r, esc(r.adversaire))}${e.numero <= (IC.equipes_planificateur || 6) ? ` <a class="eq" href="#plan/${samediDe(r.date)}/${r.id}">composer</a>` : ""} ${lienAdv(r, '<span class="eq">fiche</span>')}</td><td class="hide-sm muted">${esc(r.lieu)}</td></tr>`).join("")}</tbody></table></div></section>` : ""}
    <section><h2>Bilan par match</h2>
      <div class="grid g4" style="margin-bottom:14px">
        ${T.map(f => tuile(f === "Simple" ? "Simples" : f === "Double" ? "Doubles" : "Mixtes", vj(ms.filter(m => famille(slotType(m.code)) === f)))).join("")}
      </div>
      ${aDeuxieme ? `<div class="grid g2" style="margin-bottom:14px">${[1, 2].map(n => tuile(
        `Matchs n°${n} (${slots.filter(s => s.label !== s.cle.slice(0, 2) && slotNum(s.cle) === n).map(s => s.label).join(" + ")})`,
        vj(ms.filter(m => slotNum(m.code) === n && slots.find(s => s.cle === slotCle(m.code))?.label !== slotType(m.code))))).join("")}</div>` : ""}
      <div class="card scroll"><table class="t"><thead><tr><th></th>${slots.map(s => `<th class="r">${s.label}</th>`).join("")}<th class="r">Total</th></tr></thead><tbody>
        <tr><td>Victoires</td>${slots.map(s => `<td class="r num">${cellVJ(vj(ms.filter(m => slotCle(m.code) === s.cle)))}</td>`).join("")}<td class="r num"><b>${cellVJ(vj(ms))}</b></td></tr>
        <tr><td>%</td>${slots.map(s => `<td class="r num">${pct(vj(ms.filter(m => slotCle(m.code) === s.cle)).pct)}</td>`).join("")}<td class="r num"><b>${pct(vj(ms).pct)}</b></td></tr>
      </tbody></table></div></section>
    <section><h2>Bilan par joueur</h2><p class="hint">D'après les feuilles de rencontre de cette équipe. Pts cote : points gagnés ou perdus avec cette équipe (résultats myffbad).</p>
      <div class="card scroll" id="icJoueursEq"></div></section>
    <section><h2>Classement de la poule</h2><div class="card scroll" id="icPoule"></div></section>`;

  // rencontres jouées : une colonne par match
  $("#icRenc").innerHTML = jouees.length ? `<table class="t ic-renc"><thead><tr><th>J.</th><th>Date</th><th>Adversaire</th><th class="r">Score</th>${slots.map(s => `<th>${s.label}</th>`).join("")}</tr></thead><tbody>
    ${jouees.map(r => {
      const res = resRencontre(r);
      return `<tr><td class="muted">${esc(r.journee)}</td><td class="num" style="white-space:nowrap">${r.date ? fDate(r.date) : "–"}<div class="small muted">${r.domicile ? "Domicile" : "Extérieur"}</div></td>
        <td>${lienPlan(e, r, esc(r.adversaire))} ${lienAdv(r, '<span class="eq" title="Fiche adversaire">fiche</span>')}</td>
        <td class="r num" style="white-space:nowrap"><span class="res ${res === "V" ? "v" : res === "D" ? "d" : ""}" style="${res === "N" ? "background:var(--muted)" : ""}">${res}</span> ${r.score_club}-${r.score_adv}</td>
        ${slots.map(s => { const m = r.matchs.find(x => slotCle(x.code) === s.cle);
          if (!m) return `<td class="muted">–</td>`;
          const score = m.sets.map(st => st.join("-")).join(" / ");
          return `<td class="slot ${m.victoire == null ? "" : m.victoire ? "win" : "loss"}" title="${esc(m.club.map(p => p.nom).join(" / "))} ${m.victoire ? "bat" : "perd contre"} ${esc(m.adverse.map(p => p.nom).join(" / "))} · ${esc(score)}">
            ${m.club.map(p => `<div>${lienJoueurIC(p.licence, p.nom, true)}</div>`).join("")}
            <div class="small muted">${m.victoire == null ? "non joué" : m.victoire ? "✓ " : "✗ "}${esc(score)}</div></td>`; }).join("")}</tr>`;
    }).join("")}</tbody></table>` : `<div class="empty">Aucune rencontre jouée pour l'instant.</div>`;

  const clsCell = j => (j.classements || []).map((c, i) => `<b class="rk" style="background:${rankColor(c.classement)}" title="${T[i]} · ${c.cote ?? "?"} pts">${esc(c.classement)}</b>`).join(" ");
  sortableTable($("#icJoueursEq"), "icJoueursEq", [
    { k: "nom", label: "Joueur", val: r => r.nom, html: r => `${lienJoueurIC(r.licence, r.nom)}${r.capitaine ? ' <span class="tag" title="Capitaine">C</span>' : ""}` },
    { k: "sexe", label: "", val: r => r.sexe || "", sm: true },
    { k: "clt", label: "Clt S/D/M", val: r => (r.classements?.[0] || {}).cote ?? 0, html: clsCell, sm: true },
    { k: "renc", label: "Rencontres", val: r => r.renc.size, num: true },
    { k: "m", label: "Matchs", val: r => r.m, num: true },

    { k: "pct", label: "% vict.", val: r => r.pct, html: r => pct(r.pct), num: true },
    { k: "slots", label: "Matchs joués", val: r => Object.keys(r.slots).join(), sm: true,
      html: r => Object.entries(r.slots).map(([k, n]) => `${k}${n > 1 ? ` ×${n}` : ""}`).join(" · ") || "–" },
    { k: "pts", label: "Pts cote", val: r => r.pts, html: r => r.m ? cellPts(r.pts, r.licence) : "–", num: true },
  ], joueurs, { defaut: { cle: "m", sens: -1 }, rowClass: r => r.m === 0 ? "few" : "" });

  sortableTable($("#icPoule"), "icPoule" + e.numero, [
    { k: "rang", label: "#", val: r => r.rang, num: true },
    { k: "nom", label: "Équipe", val: r => r.nom, html: r => r.club ? `<b>${esc(r.nom)}</b>` : esc(r.nom) },
    { k: "j", label: "J", val: r => r.j, num: true },
    { k: "g", label: "G", val: r => r.g, num: true },
    { k: "n", label: "N", val: r => r.n, num: true, sm: true },
    { k: "p", label: "P", val: r => r.p, num: true },
    { k: "pts", label: "Pts", val: r => r.pts, html: r => `<b>${r.pts ?? "–"}</b>`, num: true },
    { k: "dm", label: "Matchs +/-", val: r => r.diff_matchs, html: r => signed(r.diff_matchs), num: true, sm: true },
    { k: "ds", label: "Sets +/-", val: r => r.diff_sets, html: r => signed(r.diff_sets), num: true, sm: true },
  ], e.classement, { defaut: { cle: "rang", sens: 1 }, rowClass: r => r.club ? "club" : "" });
}

/* ---------- Planificateur IC (équipes 1 à N, voir icbad.EQUIPES_PLANIFICATEUR)
   Plan sauvegardé dans le navigateur (localStorage) + export / import d'un
   fichier JSON à s'échanger entre capitaines. Règles appliquées (règlement
   ICR AURA 2026-2027) :
   - valeur d'un joueur : ICN pour l'équipe 1 (seule en Interclubs Nationaux),
     ICR (N1 plafonné à 57) pour les autres ; valeur d'équipe = 3 meilleurs
     joueurs + 3 meilleures joueuses (art. 5) ;
   - équipes régionales le même week-end : valeur de l'équipe supérieure >=
     celle de la suivante (art. 5) ;
   - par rencontre : 2 matchs maximum par joueur, jamais deux dans la même
     discipline (art. 13) ; hiérarchie selon la cote (SH1 >= SH2, paires :
     moyenne des deux cotes) (art. 11). */
const EFF = DATA.effectif || [];
const effParLic = new Map(EFF.map(p => [p.licence, p]));
const PLAN_NB = IC?.equipes_planificateur || 6;
const DISC_IDX = { SH: 0, SD: 0, DH: 1, DD: 1, MX: 2 };
const DISC_NOM = { SH: "simple", SD: "simple", DH: "double", DD: "double", MX: "mixte" };
const ROLES = { SH: ["H"], SD: ["F"], DH: ["H", "H"], DD: ["F", "F"], MX: ["H", "F"] };
const FORMAT_DEFAUT = ["SH1", "SH2", "SD1", "SD2", "DH1", "DD1", "DX1", "DX2"];
const VAL_TABLEAU = { N1: 57, N2: 48, N3: 39, R4: 30, R5: 24, R6: 18, D7: 12, D8: 9, D9: 6, P10: 3, P11: 2, P12: 1 };
const pad2 = n => String(n).padStart(2, "0");
const isoDate = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const plusJours = (iso, n) => { const d = d2(iso); d.setDate(d.getDate() + n); return isoDate(d); };
const samediDe = iso => { const d = d2(iso); d.setDate(d.getDate() - ((d.getDay() + 1) % 7)); return isoDate(d); };
const AUJ = (() => { const [j, m, a] = DATA.genere_le.split(" ")[0].split("/"); return `${a}-${m}-${j}`; })();
const JOURS = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
const fJour = iso => { const d = d2(iso); return `${JOURS[d.getDay()]} ${d.getDate()} ${MOIS_LONG[d.getMonth()]}`; };

/* joueur du club (effectif myffbad, à défaut liste d'équipe icbad) */
function joueurPlan(licence) {
  if (effParLic.has(licence)) return effParLic.get(licence);
  const x = typeof icJoueurs !== "undefined" ? icJoueurs.get(licence) : null;
  if (!x) return null;
  const clts = x.classements.map(c => c.classement);
  const best = clts.filter(c => VAL_TABLEAU[c]).sort((a, b) => VAL_TABLEAU[b] - VAL_TABLEAU[a])[0];
  return { licence, nom: x.nom, sexe: x.sexe, classements: clts, cotes: x.classements.map(c => c.cote),
    meilleur_tableau: best, icn: VAL_TABLEAU[best] || 0, icr: VAL_TABLEAU[best] || 0 };
}
const valeurPour = (p, numero) => p ? (numero === 1 ? p.icn : p.icr) : 0;
const echelle = numero => numero === 1 ? "ICN" : "ICR";
/* valeur d'équipe : 3 meilleurs hommes + 3 meilleures femmes (art. 5) */
function valeurEquipe(joueurs, numero) {
  const top = s => joueurs.filter(p => p.sexe === s).map(p => valeurPour(p, numero)).sort((a, b) => b - a).slice(0, 3);
  return [...top("H"), ...top("F")].reduce((a, b) => a + b, 0);
}

/* week-ends d'interclubs des équipes du planificateur (samedi + dimanche) */
function planWeekends() {
  if (!IC) return [];
  const map = new Map();
  for (const e of IC.equipes.filter(x => x.numero <= PLAN_NB)) for (const r of e.rencontres) {
    if (!r.date) continue;
    const s = samediDe(r.date);
    if (!map.has(s)) map.set(s, []);
    map.get(s).push({ e, r });
  }
  return [...map.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([samedi, items], i) => {
    items.sort((a, b) => a.e.numero - b.e.numero || (a.r.date + (a.r.heure || "")).localeCompare(b.r.date + (b.r.heure || "")));
    return { n: i + 1, samedi, dimanche: plusJours(samedi, 1), items,
      equipes: [...new Set(items.map(x => x.e.numero))].sort((a, b) => a - b),
      passe: items.every(x => x.r.jouee) || plusJours(samedi, 1) < AUJ };
  });
}

/* ---- sauvegarde (navigateur) */
const PLAN_CLE = "planIC:" + DATA.saison;
const planVide = () => ({ v: 1, saison: DATA.saison, affectations: {}, compos: {}, adverses: {} });
function planCharger() {
  try { const x = JSON.parse(localStorage.getItem(PLAN_CLE)); if (x && x.v === 1) return { ...planVide(), ...x }; } catch (e) {}
  return planVide();
}
let PLAN = planCharger();
/* Le réel remplace le prévu : d'une semaine à l'autre, des rencontres passent
   de "à composer" à "jouée" (feuille icbad). Leurs compositions prévues et les
   affectations des week-ends passés ne servent plus à rien et pourraient
   prêter à confusion : on les retire à l'ouverture (le plan exporté avant
   reste un historique si besoin). */
function planNettoyer() {
  if (!IC) return 0;
  let n = 0;
  const jouees = new Set(IC.equipes.flatMap(e => e.rencontres.filter(r => r.jouee).map(r => r.id)));
  for (const cle of ["compos", "adverses"]) for (const rid of Object.keys(PLAN[cle] || {})) if (jouees.has(rid)) { delete PLAN[cle][rid]; n++; }
  const passes = new Set(planWeekends().filter(w => w.passe).map(w => w.samedi));
  for (const sam of Object.keys(PLAN.affectations || {})) if (passes.has(sam)) { delete PLAN.affectations[sam]; n++; }
  if (n) planSauver();
  return n;
}
let planStockageOk = true;
function planSauver() {
  PLAN.maj = new Date().toISOString();
  try { localStorage.setItem(PLAN_CLE, JSON.stringify(PLAN)); planStockageOk = true; } catch (e) { planStockageOk = false; }
}
function planExporter() {
  const blob = new Blob([JSON.stringify(PLAN, null, 1)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `plan-interclubs-${DATA.saison}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function planImporter(fichier, apres) {
  const lecteur = new FileReader();
  lecteur.onload = () => {
    try {
      const x = JSON.parse(lecteur.result);
      if (!x || x.v !== 1 || typeof x.affectations !== "object") throw new Error("format inattendu");
      if (!confirm("Remplacer le plan enregistré dans ce navigateur par celui du fichier ?")) return;
      PLAN = { ...planVide(), ...x }; planSauver(); apres();
    } catch (e) { alert("Fichier de plan illisible : " + e.message); }
  };
  lecteur.readAsText(fichier);
}
const affectationsDe = samedi => PLAN.affectations[samedi] || (PLAN.affectations[samedi] = {});
const joueursAffectes = (samedi, numero) => Object.entries(PLAN.affectations[samedi] || {})
  .filter(([, n]) => n === numero).map(([lic]) => joueurPlan(lic)).filter(Boolean);

/* valeurs figées par week-end (historique_ic.py) : classements, cotes et
   valeurs ICN/ICR relevés à l'export qui a suivi le week-end, pour que la
   valeur d'une équipe passée ne varie plus avec les classements du jour */
const HISTO = DATA.valeurs_historiques || {};
function joueurAuWeekend(lic, samedi) {
  const fige = HISTO[samedi]?.joueurs?.[lic];
  if (!fige) return null;
  const base = joueurPlan(lic) || { licence: lic, nom: fige.nom, sexe: icSexe.get(lic) };
  return { ...base, classements: fige.classements, cotes: fige.cotes, meilleur_tableau: fige.meilleur_tableau, icn: fige.icn, icr: fige.icr, fige: HISTO[samedi].date };
}
/* participants réels d'un week-end passé : joueurs ayant joué >= 1 match, par équipe, avec leurs valeurs figées si disponibles */
function participantsReels(w, numero) {
  const lics = new Set();
  for (const { e, r } of w.items) if (e.numero === numero) for (const m of r.matchs) for (const p of m.club) if (p.licence) lics.add(p.licence);
  return [...lics].map(l => joueurAuWeekend(l, w.samedi) || joueurPlan(l) || { licence: l, nom: (icJoueurs.get(l) || {}).nom || l, sexe: icSexe.get(l), classements: [], cotes: [], icn: 0, icr: 0 });
}
/* équipes dans lesquelles un joueur a déjà joué cette saison (nb de rencontres) - aide à la saisie */
const historiqueIC = new Map();
if (IC) for (const e of IC.equipes) for (const r of e.rencontres) {
  const vus = new Set(r.matchs.flatMap(m => m.club.map(p => p.licence)));
  for (const l of vus) { if (!l) continue; const h = historiqueIC.get(l) || {}; h[e.numero] = (h[e.numero] || 0) + 1; historiqueIC.set(l, h); }
}
/* Mouvements entre équipes (joueurs "brûlés"), selon la division de l'équipe
   dans laquelle on veut faire descendre le joueur :
   - équipe RÉGIONALE (PN, R1, R2, R3) - règlement ICR AURA 2026-2027, art. 12 :
     bloqué dès 3 rencontres nationales ou 4 régionales jouées avec des
     équipes du club classées plus haut ; dès 4 au total s'il a joué dans les
     deux ; dès 3 au total pour une équipe de R3. Le chiffre de l'article est
     le seuil atteint (malgré "pas plus de") : l'ancienne version l'illustrait
     par "limite de trois rencontres au total (2 en nationaux, 1 en régionaux)". Une rencontre = un affrontement (2 par dimanche en
     régional, 1 par samedi en N2), comptée dès qu'il y a joué un match ;
   - équipe DÉPARTEMENTALE (PR, D1 à D4) - règlement CD38 2026-2027, art. 8 :
     interdit dès 2 journées jouées dans des équipes classées plus haut (une
     journée = un dimanche, avec 1 ou 2 rencontres) ;
   - l'équipe 1 (N2) est la plus haute : jamais interdite.
   Compteurs : feuilles icbad (déjà joué) + week-ends à venir du planificateur. */
const niveauDivision = d => ["N1", "N2", "N3", "TOP12"].includes(d) ? "national"
  : ["PN", "R1", "R2", "R3"].includes(d) ? "regional" : "departemental";
const DIV_EQUIPE = new Map((IC?.equipes || []).map(e => [e.numero, e.division]));
const NUMEROS_EQUIPES = [...DIV_EQUIPE.keys()].sort((a, b) => a - b);
/* journées (dates distinctes) jouées par équipe, en plus des rencontres (historiqueIC) */
const historiqueJours = new Map();
if (IC) for (const e of IC.equipes) for (const r of e.rencontres) {
  if (!r.date) continue;
  for (const l of new Set(r.matchs.flatMap(m => m.club.map(p => p.licence)))) {
    if (!l) continue;
    const h = historiqueJours.get(l) || {};
    (h[e.numero] = h[e.numero] || new Set()).add(r.date);
    historiqueJours.set(l, h);
  }
}
/* compteur "déjà joué" d'un joueur : {r: {équipe: rencontres}, j: {équipe: journées}} */
const compteurJoue = lic => ({
  r: { ...(historiqueIC.get(lic) || {}) },
  j: Object.fromEntries(Object.entries(historiqueJours.get(lic) || {}).map(([n, d]) => [n, d.size])),
});
const chipRencontres = (n, k, prevues = 0) =>
  `<span class="eq" title="${k} rencontre(s) avec l'équipe ${n}${prevues ? ` dont ${prevues} prévue(s) au planificateur` : ""}">Éq.${n} ×${k}${prevues ? `<span class="muted"> (+${prevues})</span>` : ""}</span>`;
const fmtHistorique = l => Object.entries(historiqueIC.get(l) || {}).sort((a, b) => a[0] - b[0])
  .map(([n, k]) => chipRencontres(+n, k)).join(" ");
/* rencontres / journées encore à jouer de l'équipe n sur le week-end w : une
   rencontre déjà jouée est dans l'historique icbad (feuille de match), il ne
   faut pas la compter une seconde fois dans les projections */
const rencontresDuWeekend = (w, n) => w.items.filter(x => x.e.numero === n && !x.r.jouee).length;
const joursDuWeekend = (w, n) => new Set(w.items.filter(x => x.e.numero === n && !x.r.jouee).map(x => x.r.date)).size;
/* compteur AVANT le week-end w : déjà joué + week-ends à venir antérieurs planifiés */
function compteurAvant(lic, w, wes) {
  const c = compteurJoue(lic), prevues = {};
  for (const x of wes) {
    if (x.passe || x.samedi >= w.samedi) continue;
    const m = (PLAN.affectations[x.samedi] || {})[lic];
    if (!m) continue;
    const k = rencontresDuWeekend(x, m);
    c.r[m] = (c.r[m] || 0) + k; c.j[m] = (c.j[m] || 0) + joursDuWeekend(x, m); prevues[m] = (prevues[m] || 0) + k;
  }
  return { ...c, prevues };
}
const avecWeekend = (c, w, n) => ({
  r: { ...c.r, [n]: (c.r[n] || 0) + rencontresDuWeekend(w, n) },
  j: { ...c.j, [n]: (c.j[n] || 0) + joursDuWeekend(w, n) },
});
/* motif pour lequel le joueur ne peut pas jouer en équipe m (null = autorisé) */
function motifInterdit(c, m) {
  const sup = NUMEROS_EQUIPES.filter(n => n < m), div = DIV_EQUIPE.get(m), niv = niveauDivision(div);
  if (!sup.length || niv === "national") return null;
  const somme = (ns, cle) => ns.reduce((a, n) => a + (c[cle][n] || 0), 0);
  if (niv === "regional") {
    const icn = somme(sup.filter(n => niveauDivision(DIV_EQUIPE.get(n)) === "national"), "r");
    const icr = somme(sup.filter(n => niveauDivision(DIV_EQUIPE.get(n)) === "regional"), "r");
    const tot = icn + icr;
    // seuils = nombre de rencontres à partir duquel le joueur est brûlé
    // (lecture confirmée par l'ancienne version de l'art. 12 : "limite de
    // trois rencontres au total (2 en nationaux, 1 en régionaux...)")
    if (div === "R3") return tot >= 3 ? `${tot} rencontres en équipes supérieures (ICR art. 12 : bloqué dès 3 pour une équipe de R3)` : null;
    if (icn && icr) return tot >= 4 ? `${tot} rencontres nationales et régionales en équipes supérieures (ICR art. 12 : bloqué dès 4 au total)` : null;
    if (icr >= 4) return `${icr} rencontres régionales en équipes supérieures (ICR art. 12 : bloqué dès 4)`;
    if (icn >= 3) return `${icn} rencontres nationales en équipe supérieure (ICR art. 12 : bloqué dès 3)`;
    return null;
  }
  const jours = somme(sup, "j");
  return jours >= 2 ? `${jours} journées en équipes supérieures (CD38 art. 8 : bloqué dès 2)` : null;
}
const premiereInterdite = c => NUMEROS_EQUIPES.find(m => motifInterdit(c, m));
/* [3, 6, 7, 8] -> "3, 6 à 8" */
function plages(ns) {
  const out = [];
  for (let i = 0; i < ns.length; i++) {
    let k = i; while (k + 1 < ns.length && ns[k + 1] === ns[k] + 1) k++;
    out.push(k > i + 1 ? `${ns[i]} à ${ns[k]}` : k === i + 1 ? `${ns[i]}, ${ns[k]}` : `${ns[i]}`); i = k;
  }
  return out.join(", ");
}
/* étiquette "bloqué à partir de l'équipe X" pour un compteur */
function chipBlocage(c) {
  const m = premiereInterdite(c);
  if (!m) return "";
  const ns = NUMEROS_EQUIPES.filter(x => x >= m && motifInterdit(c, x));
  return `<span class="eq brule" title="Ne peut plus jouer en équipe${ns.length > 1 ? "s" : ""} ${plages(ns)} : ${esc(motifInterdit(c, m))}">⛔ Éq.${plages(ns)}</span>`;
}
/* statut d'un joueur s'il joue en équipe n ce week-end :
   - bloque : interdit en équipe n (motif) ;
   - devientBrule : jouer ici le bloquerait ensuite pour les équipes `nouvelles` */
function statutBrulage(lic, w, wes, n) {
  const c = compteurAvant(lic, w, wes), motif = motifInterdit(c, n), apres = avecWeekend(c, w, n);
  const nouvelles = NUMEROS_EQUIPES.filter(m => m > n && !motifInterdit(c, m) && motifInterdit(apres, m));
  return { c, prevues: c.prevues, motif, bloque: !!motif, nouvelles, devientBrule: !motif && nouvelles.length > 0 };
}

/* joueurs "d'interclubs" : inscrits sur une liste d'équipe icbad ou ayant joué */
const licencesIC = new Set([...(typeof icJoueurs !== "undefined" ? icJoueurs.keys() : []), ...historiqueIC.keys()]);
/* minimum de joueurs / joueuses pour un format (2 matchs max, pas 2 dans la même discipline) */
function effectifMinimum(codes) {
  const besoin = { H: { total: 0, disc: {} }, F: { total: 0, disc: {} } };
  for (const c of codes) for (const s of ROLES[slotType(c)]) {
    besoin[s].total++; const d = DISC_NOM[slotType(c)]; besoin[s].disc[d] = (besoin[s].disc[d] || 0) + 1;
  }
  const min = s => Math.max(Math.ceil(besoin[s].total / 2), ...Object.values(besoin[s].disc), 0);
  return { H: min("H"), F: min("F") };
}
/* format (liste des matchs) d'une équipe : feuille d'une rencontre jouée, à défaut composition type adverse */
function formatEquipe(e) {
  const jouee = icRencontresJouees(e).find(r => r.matchs.length);
  if (jouee) return jouee.matchs.map(m => m.code);
  for (const r of e.rencontres) {
    const adv = IC.adversaires?.[r.adversaire_equipe_id];
    if (adv?.composition_type?.length) return adv.composition_type.map(c => c.code);
  }
  return FORMAT_DEFAUT;
}
const clsBadges = p => (p.classements || []).map((c, i) => `<b class="rk" style="background:${rankColor(c)}" title="${T[i]} · ${fmt(p.cotes?.[i])} pts">${esc(c || "NC")}</b>`).join(" ");
/* Joueurs mutés (badge "M" d'icbad, listes d'équipe et feuilles de match) :
   au plus MAX_MUTES alignés par rencontre - règlement ICR AURA art. 13 et
   CD38 art. 11-4 (même règle). */
const MAX_MUTES = 2;
const REGLE_MUTES = "ICR AURA art. 13, CD38 art. 11-4";
const MUTES = new Set();
if (IC) {
  for (const e of IC.equipes) {
    for (const p of e.joueurs) if (p.mute) MUTES.add(p.licence);
    for (const r of e.rencontres) for (const m of r.matchs) for (const p of m.club) if (p.mute && p.licence) MUTES.add(p.licence);
  }
}
const estMute = lic => MUTES.has(lic);
const badgeMute = (mute = true) => mute ? ` <abbr class="mute" title="Muté : ${MAX_MUTES} au maximum alignés par rencontre (${REGLE_MUTES})">M</abbr>` : "";
const statut = (ok, texte) => `<div class="chk ${ok ? "ok" : "ko"}"><span aria-hidden="true">${ok ? "✓" : "⚠"}</span> ${texte}</div>`;
const attention = texte => `<div class="chk warn"><span aria-hidden="true">⚠</span> ${texte}</div>`;

function renderPlan(sous, rid) {
  if (!IC || !IC.equipes.length) { $("#main").innerHTML = `<div class="card empty">Données interclubs indisponibles pour cet export.</div>`; return; }
  $("#main").innerHTML = `<div id="planRoot"></div>`;
  const el = $("#planRoot"), wes = planWeekends();
  const w = wes.find(x => x.samedi === sous);
  if (w && rid) return planRencontre(el, w, wes, rid);
  if (w) return planWeekend(el, w, wes);
  planSaison(el, wes);
}

/* ---- saison : liste des week-ends */
function planSaison(el, wes) {
  const equipes = IC.equipes.filter(e => e.numero <= PLAN_NB);
  const prochain = wes.find(w => !w.passe);
  el.innerHTML = `
    <div class="card"><h2 style="margin:0 0 4px;font-size:16px">Planificateur interclubs · équipes 1 à ${PLAN_NB}</h2>
      <p class="hint" style="margin:0 0 10px">Le plan est enregistré dans ce navigateur uniquement${planStockageOk ? "" : " (<b>stockage indisponible ici : rien ne sera conservé</b>)"}. Pour le partager entre capitaines, l'exporter en fichier puis l'importer de l'autre côté.${PLAN.maj ? ` Dernière modification : ${new Date(PLAN.maj).toLocaleString("fr-FR")}.` : ""}</p>
      <div class="chips"><button class="chip" id="planExport">⬇ Exporter le plan</button>
        <label class="chip" style="cursor:pointer">⬆ Importer un plan<input type="file" id="planImport" accept="application/json,.json" hidden></label>
        <button class="chip" id="planReset">Effacer le plan</button></div></div>
    <section><h2>${wes.length} week-ends d'interclubs</h2>
      <p class="hint">Cliquer un week-end pour affecter les joueurs aux équipes. Un joueur ne peut jouer que dans une équipe par week-end.</p>
      <div class="card scroll" id="planWes"></div></section>
    <section><h2>Par équipe</h2><div class="card scroll"><table class="t"><thead><tr><th>Équipe</th><th>Division</th><th>Jour</th><th class="r">Week-ends</th><th class="r">Rencontres jouées</th></tr></thead><tbody>
      ${equipes.map(e => { const jours = [...new Set(e.rencontres.filter(r => r.date).map(r => JOURS[d2(r.date).getDay()]))];
        const nw = wes.filter(w => w.equipes.includes(e.numero)).length;
        return `<tr><td><a class="eq" href="#ic/${e.numero}">Équipe ${e.numero}</a></td><td>${esc(e.division)}</td><td>${jours.join(", ")}</td>
          <td class="r num">${nw}</td><td class="r num">${icRencontresJouees(e).length} / ${e.rencontres.length}</td></tr>`; }).join("")}
    </tbody></table></div></section>`;
  sortableTable($("#planWes"), "planWes", [
    { k: "n", label: "#", val: r => r.n, num: true },
    { k: "date", label: "Week-end", val: r => r.samedi, html: r => `${d2(r.samedi).getDate()}–${fDate(r.dimanche)}` },
    { k: "st", label: "", val: r => r.passe ? 0 : 1, html: r => r.passe ? `<span class="tag">passé</span>` : r === prochain ? `<span class="tag" style="background:var(--accent-wash);color:var(--ink)">prochain</span>` : `<span class="tag">à venir</span>` },
    { k: "eq", label: "Équipes", val: r => r.equipes.length, html: r => r.equipes.map(n => {
        const jours = [...new Set(r.items.filter(x => x.e.numero === n).map(x => JOURS[d2(x.r.date).getDay()].slice(0, 3)))];
        return `<span class="eq" title="${jours.join(", ")}">${n} <span class="muted">${jours.join("/")}</span></span>`; }).join(" ") },
    { k: "plan", label: "Plan", val: r => Object.keys(PLAN.affectations[r.samedi] || {}).length, html: r => {
        if (r.passe) return `<span class="muted">${r.equipes.map(n => participantsReels(r, n).length).reduce((a, b) => a + b, 0)} joueurs ont joué</span>`;
        const nb = r.equipes.map(n => joueursAffectes(r.samedi, n).length);
        return nb.some(x => x) ? r.equipes.map((n, i) => `${n} : ${nb[i]}`).join(" · ") : `<span class="muted">à faire</span>`; } },
  ], wes, { defaut: { cle: "n", sens: 1 }, lien: r => "#plan/" + r.samedi });
  $("#planExport").onclick = planExporter;
  $("#planImport").onchange = ev => ev.target.files[0] && planImporter(ev.target.files[0], () => planSaison(el, wes));
  $("#planReset").onclick = () => { if (confirm("Effacer tout le plan enregistré dans ce navigateur ?")) { PLAN = planVide(); planSauver(); planSaison(el, wes); } };
}

/* ---- week-end : affectation des joueurs */
function navWeekends(w, wes) {
  const prev = wes[w.n - 2], next = wes[w.n];
  return `<div class="chips subnav"><a class="chip" href="#plan">← Tous les week-ends</a>
    ${prev ? `<a class="chip" href="#plan/${prev.samedi}">‹ Week-end ${prev.n}</a>` : ""}
    <span class="chip on">Week-end ${w.n} · ${d2(w.samedi).getDate()}–${fDate(w.dimanche)}</span>
    ${next ? `<a class="chip" href="#plan/${next.samedi}">Week-end ${next.n} ›</a>` : ""}</div>`;
}
/* nombre de colonnes des cartes d'équipes : jusqu'à 4 sur une ligne, au-delà 2 lignes équilibrées (6 -> 3 + 3, 5 -> 3 + 2) */
const colsPlan = nb => nb <= 4 ? Math.max(nb, 1) : Math.ceil(nb / 2);

function rencontresEquipe(w, n) {
  return w.items.filter(x => x.e.numero === n).map(({ r }) =>
    `<a href="#plan/${w.samedi}/${r.id}" class="renc-lien">${r.domicile ? "vs" : "@"} ${esc(r.adversaire)}${r.heure ? ` <span class="muted">${esc(r.heure)}</span>` : ""}${r.jouee ? ` <b class="num">${r.score_club}-${r.score_adv}</b>` : ""}</a>`).join("");
}
function controlesValeurs(w, valeurs) {
  // équipes régionales du week-end (toutes sauf la 1, en ICN) : valeur décroissante (art. 5)
  const reg = w.equipes.filter(n => n !== 1);
  const out = [];
  for (let i = 0; i + 1 < reg.length; i++) {
    const a = reg[i], b = reg[i + 1];
    if (!valeurs[a] && !valeurs[b]) continue;
    out.push(statut(valeurs[a] >= valeurs[b], `Valeur équipe ${a} (${valeurs[a]}) ${valeurs[a] >= valeurs[b] ? "≥" : "<"} équipe ${b} (${valeurs[b]})`));
  }
  return out.join("");
}

function planWeekend(el, w, wes) {
  const jour = n => [...new Set(w.items.filter(x => x.e.numero === n).map(x => fJour(x.r.date)))].join(", ");
  const entete = navWeekends(w, wes) + `<div class="chips" style="margin:-6px 0 12px">
      ${!w.passe && w.n > 1 ? `<button class="chip" id="planCopier">⧉ Copier les effectifs du week-end ${w.n - 1}</button>` : ""}
      <button class="chip" id="planExcel">⬇ Export Excel (format INTERCLUBS)</button>
      <span id="planMsg" class="small muted" style="align-self:center"></span></div>`;
  const brancherActions = apres => {
    const msg = t => { const m = el.querySelector("#planMsg"); if (m) m.textContent = t; };
    el.querySelector("#planExcel").onclick = () => { msg("Génération du fichier…");
      exporterWeekendExcel(w).then(() => msg("Fichier Excel téléchargé.")).catch(err => msg("Export impossible : " + err.message)); };
    const cp = el.querySelector("#planCopier");
    if (cp) cp.onclick = () => { const r = copierWeekendPrecedent(w, wes); if (r) { apres(); msg(r); } };
  };
  if (w.passe) {
    const valeurs = {};
    const cartes = w.equipes.map(n => {
      const e = IC.equipes.find(x => x.numero === n), ps = participantsReels(w, n);
      valeurs[n] = valeurEquipe(ps, n);
      ps.sort((a, b) => (a.sexe || "").localeCompare(b.sexe || "") * -1 || valeurPour(b, n) - valeurPour(a, n));
      return `<div class="card plan-eq"><h3><a class="eq" href="#ic/${n}">Équipe ${n}</a> <span class="muted small">${esc(e.division)} · ${jour(n)}</span></h3>
        <div class="renc">${rencontresEquipe(w, n)}</div>
        ${ps.map(p => `<div class="pj"><span>${lienJoueurIC(p.licence, p.nom)}${badgeMute(estMute(p.licence))}</span><span class="muted small">${p.sexe || ""}</span><b class="num" title="Valeur ${echelle(n)}">${valeurPour(p, n)}</b></div>`).join("") || `<div class="muted">Aucune feuille de match.</div>`}
        <div class="pied">Valeur ${echelle(n)} (3 H + 3 F) : <b>${valeurs[n]}</b></div></div>`;
    }).join("");
    const fige = HISTO[w.samedi]?.date;
    el.innerHTML = entete + `<p class="hint">Week-end passé : joueurs ayant joué au moins un match, d'après les feuilles de rencontre icbad. ${fige
      ? `Valeurs figées le ${fDate(fige)} (export qui a suivi le week-end) : elles ne bougent plus avec les classements.`
      : "Valeurs calculées avec les classements actuels : elles seront figées au prochain export."}</p>
      <div class="grid plan-grid" style="--cols:${colsPlan(w.equipes.length)}">${cartes}</div><div style="margin-top:12px">${controlesValeurs(w, valeurs)}</div>`;
    brancherActions(() => {});
    return;
  }
  const aff = affectationsDe(w.samedi);
  state.planFiltre = state.planFiltre || { q: "", sexe: "tous", ic: true };
  el.innerHTML = entete + `
    <p class="hint">Glisser un joueur vers une équipe, ou choisir l'équipe dans sa ligne. Valeur affichée : ICN pour l'équipe 1, ICR (N1 = 57) pour les autres. Enregistré automatiquement dans ce navigateur.</p>
    <div class="grid plan-grid" id="planEquipes" style="--cols:${colsPlan(w.equipes.length)}"></div>
    <div id="planControles" style="margin:12px 0"></div>
    <section><h2>Joueurs</h2>
      <div class="chips" style="margin-bottom:10px">
        <input id="planQ" type="search" placeholder="Rechercher…" value="${esc(state.planFiltre.q)}" style="padding:5px 10px;border:1px solid var(--grid);border-radius:999px;background:var(--surface)">
        ${[["tous", "Tous"], ["H", "Hommes"], ["F", "Femmes"]].map(([k, l]) => `<button class="chip" data-sx="${k}" aria-pressed="${state.planFiltre.sexe === k}">${l}</button>`).join("")}
        <button class="chip" data-ic="1" aria-pressed="${state.planFiltre.ic}">Joueurs d'interclubs seulement</button>
        <select id="planElig" class="chip" title="Masquer les joueurs que le règlement interdit dans cette équipe (ICR art. 12, CD38 art. 8)">
          <option value="">Éligibles : toutes équipes</option>
          ${w.equipes.map(n => `<option value="${n}" ${+state.planFiltre.elig === n ? "selected" : ""}>Éligibles en équipe ${n}</option>`).join("")}</select>
      </div>
      <div class="card scroll drop" data-equipe="0" id="planPool"></div></section>`;

  const affecter = (lic, n) => { if (n) aff[lic] = n; else delete aff[lic]; planSauver(); dessiner(); };
  const dessiner = () => {
    const valeurs = {};
    $("#planEquipes").innerHTML = w.equipes.map(n => {
      const e = IC.equipes.find(x => x.numero === n), ps = joueursAffectes(w.samedi, n);
      valeurs[n] = valeurEquipe(ps, n);
      const min = effectifMinimum(formatEquipe(e)), nH = ps.filter(p => p.sexe === "H").length, nF = ps.filter(p => p.sexe === "F").length;
      ps.sort((a, b) => (b.sexe || "").localeCompare(a.sexe || "") || valeurPour(b, n) - valeurPour(a, n));
      return `<div class="card plan-eq drop" data-equipe="${n}"><h3><a class="eq" href="#ic/${n}">Équipe ${n}</a> <span class="muted small">${esc(e.division)} · ${jour(n)}</span></h3>
        <div class="renc">${rencontresEquipe(w, n)}</div>
        ${ps.map(p => { const b = statutBrulage(p.licence, w, wes, n);
          const bandeau = b.bloque
            ? `<div class="bandeau">⛔ Interdit en équipe ${n} : ${esc(b.motif)}</div>`
            : b.devientBrule
              ? `<div class="bandeau jaune">⚠ Après ce week-end, ne pourra plus jouer en équipe${b.nouvelles.length > 1 ? "s" : ""} ${plages(b.nouvelles)}</div>` : "";
          return `<div class="pj ${b.bloque ? "alerte" : b.devientBrule ? "alerte-jaune" : ""}" draggable="true" data-lic="${p.licence}"><span>${esc(p.nom)}${badgeJeune(p.licence, p.nom)}${badgeMute(estMute(p.licence))}</span><span class="muted small">${p.sexe} · ${esc(p.meilleur_tableau || "")}</span>
          <b class="num" title="Valeur ${echelle(n)}">${valeurPour(p, n)}</b><button class="x" data-retirer="${p.licence}" title="Retirer" aria-label="Retirer ${esc(p.nom)}">×</button>${bandeau}</div>`; }).join("") || `<div class="muted small vide">Déposer des joueurs ici</div>`}
        <div class="pied"><span class="${nH >= min.H ? "" : "delta-down"}">${nH} H / ${min.H} min.</span> · <span class="${nF >= min.F ? "" : "delta-down"}">${nF} F / ${min.F} min.</span>
          · valeur ${echelle(n)} <b>${valeurs[n]}</b>${(() => { const nm = ps.filter(p => estMute(p.licence)).length;
            return nm ? ` · <span class="${nm > MAX_MUTES ? "mute-trop" : ""}" title="${MAX_MUTES} mutés au maximum alignés par rencontre (${REGLE_MUTES})">${nm} muté${nm > 1 ? "s" : ""}${nm > MAX_MUTES ? ` : ${MAX_MUTES} max. par rencontre` : ""}</span>` : ""; })()}</div></div>`;
    }).join("");
    const interdits = [], bloquants = [];
    for (const [lic, n] of Object.entries(aff)) {
      if (!w.equipes.includes(n)) continue;
      const b = statutBrulage(lic, w, wes, n), nom = (joueurPlan(lic) || {}).nom || lic;
      if (b.bloque) interdits.push(`${esc(nom)} en équipe ${n} (${esc(b.motif)})`);
      else if (b.devientBrule) bloquants.push(`${esc(nom)} (équipe ${n} → plus en équipe ${plages(b.nouvelles)})`);
    }
    $("#planControles").innerHTML = controlesValeurs(w, valeurs)
      + statut(!interdits.length, interdits.length ? `Joueurs interdits dans leur équipe (déjà brûlés) : ${interdits.join(" ; ")}` : "Aucun joueur brûlé dans une équipe supérieure (ICR art. 12, CD38 art. 8)")
      + (bloquants.length ? attention(`Ne pourront plus redescendre après ce week-end : ${bloquants.join(" ; ")}`) : "");
    const f = state.planFiltre, q = normNom(f.q);
    const pool = (f.ic ? EFF.filter(p => licencesIC.has(p.licence)) : EFF)
      .concat([...licencesIC].filter(l => !effParLic.has(l)).map(joueurPlan).filter(Boolean))
      .filter(p => (f.sexe === "tous" || p.sexe === f.sexe) && (!q || normNom(p.nom).includes(q))
        && (!f.elig || !w.equipes.includes(+f.elig) || !statutBrulage(p.licence, w, wes, +f.elig).bloque));
    sortableTable($("#planPool"), "planPool", [
      { k: "nom", label: "Joueur", val: r => r.nom, html: r => `<span draggable="true" data-lic="${r.licence}" class="poignee" title="Glisser vers une équipe">⠿</span> ${lienJoueurIC(r.licence, r.nom)}${badgeMute(estMute(r.licence))}` },
      { k: "sexe", label: "", val: r => r.sexe, sm: true },
      { k: "clt", label: "Clt S/D/M", val: r => Math.max(...(r.cotes || [0])), html: clsBadges, sm: true },
      { k: "icn", label: "ICN", val: r => r.icn, num: true, title: "Valeur en Interclubs Nationaux (équipe 1)" },
      { k: "icr", label: "ICR", val: r => r.icr, num: true, title: "Valeur en Interclubs Régionaux (N1 = 57)" },
      { k: "hist", label: "Rencontres par équipe", title: "Rencontres jouées (+ prévues au planificateur avant ce week-end). ⛔ : équipes où le joueur ne peut plus jouer (ICR art. 12, CD38 art. 8).",
        val: r => Object.values(compteurAvant(r.licence, w, wes).r).reduce((a, b) => a + b, 0), html: r => {
          const c = compteurAvant(r.licence, w, wes);
          return (Object.entries(c.r).sort((a, b) => a[0] - b[0]).map(([n, k]) => chipRencontres(+n, k, c.prevues[n] || 0)).join(" ") + " " + chipBlocage(c)).trim() || "–"; } },
      { k: "eq", label: "Équipe ce week-end", val: r => aff[r.licence] || 99, html: r => {
          const b = aff[r.licence] ? statutBrulage(r.licence, w, wes, aff[r.licence]) : null;
          return `<select data-affecter="${r.licence}" aria-label="Équipe de ${esc(r.nom)}" class="${b && (b.bloque || b.devientBrule) ? "sel-alerte" : ""}"><option value="">—</option>${w.equipes.map(n => {
            const s2 = statutBrulage(r.licence, w, wes, n);
            return `<option value="${n}" ${aff[r.licence] === n ? "selected" : ""}>Équipe ${n}${s2.bloque ? " ⛔ interdit" : s2.devientBrule ? " ⚠ bloquant" : ""}</option>`; }).join("")}</select>`; } },
    ], pool, { defaut: { cle: "icr", sens: -1 } });
  };
  dessiner();

  // interactions : sélecteur, retrait, glisser-déposer, filtres
  el.addEventListener("change", ev => { const s = ev.target.closest("select[data-affecter]"); if (s) affecter(s.dataset.affecter, +s.value || 0); });
  el.addEventListener("click", ev => {
    const x = ev.target.closest("[data-retirer]"); if (x) return affecter(x.dataset.retirer, 0);
    const sx = ev.target.closest("[data-sx]"); if (sx) { state.planFiltre.sexe = sx.dataset.sx; el.querySelectorAll("[data-sx]").forEach(b => b.setAttribute("aria-pressed", b === sx)); dessiner(); }
    const ic = ev.target.closest("[data-ic]"); if (ic) { state.planFiltre.ic = !state.planFiltre.ic; ic.setAttribute("aria-pressed", state.planFiltre.ic); dessiner(); }
  });
  $("#planQ").addEventListener("input", ev => { state.planFiltre.q = ev.target.value; dessiner(); });
  $("#planElig").addEventListener("change", ev => { state.planFiltre.elig = ev.target.value; dessiner(); });
  brancherActions(dessiner);
  el.addEventListener("dragstart", ev => { const d = ev.target.closest("[data-lic]"); if (d) { ev.dataTransfer.setData("text/plain", d.dataset.lic); ev.dataTransfer.effectAllowed = "move"; } });
  el.addEventListener("dragover", ev => { const z = ev.target.closest(".drop"); if (z) { ev.preventDefault(); z.classList.add("survol"); } });
  el.addEventListener("dragleave", ev => { const z = ev.target.closest(".drop"); if (z && !z.contains(ev.relatedTarget)) z.classList.remove("survol"); });
  el.addEventListener("drop", ev => {
    const z = ev.target.closest(".drop"); if (!z) return;
    ev.preventDefault(); z.classList.remove("survol");
    const lic = ev.dataTransfer.getData("text/plain"); if (lic) affecter(lic, +z.dataset.equipe || 0);
  });
}

/* ---- export Excel d'un week-end, au format du classeur "INTERCLUBS"
   (onglet de journée : blocs "Proposition d'équipe" hommes / femmes, avec
   classements, points et valeur de l'équipe ; onglet Compositions : match
   par match, par équipe). ExcelJS chargé à la demande (page hébergée). */
let _excelJS = null;
function chargerExcelJS() {
  if (window.ExcelJS) return Promise.resolve(window.ExcelJS);
  return _excelJS || (_excelJS = new Promise((ok, ko) => {
    const sc = document.createElement("script");
    sc.src = "https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js";
    sc.onload = () => ok(window.ExcelJS);
    sc.onerror = () => { _excelJS = null; ko(new Error("chargement de la librairie Excel impossible (connexion ?)")); };
    document.head.appendChild(sc);
  }));
}
/* "Simon COGNET" -> nom "COGNET", prénom "Simon" */
function decouperNom(nom) {
  const mots = String(nom || "").trim().split(/\s+/);
  const estNom = m => m.length > 1 && m === m.toUpperCase() && /[A-Z]/.test(m);
  const nomF = mots.filter(estNom), prenom = mots.filter(m => !estNom(m));
  return { nom: (nomF.length ? nomF : mots.slice(-1)).join(" "), prenom: prenom.join(" ") };
}
const capitaliser = x => x.toLowerCase().replace(/(^|[\s-])\S/g, c => c.toUpperCase());
const nomFeuille = nom => { const d = decouperNom(nom); return `${capitaliser(d.nom)} ${d.prenom}`.trim(); };      // "Cognet Simon"
const nomCompoSimple = nom => { const d = decouperNom(nom); return `${d.nom} ${d.prenom}`.toUpperCase().trim(); };  // "COGNET SIMON"
const COULEUR_DIVISION = { N1: "FFFCE5CD", N2: "FFFCE5CD", N3: "FFFFF2CC", PN: "FFFFF2CC", R1: "FFD9EAD3", R2: "FFC9DAF8", R3: "FFEAD1DC", PR: "FFD9D2E9" };

/* joueurs d'une équipe pour le week-end : réels si passé, sinon le plan */
const joueursWeekend = (w, n) => w.passe ? participantsReels(w, n) : joueursAffectes(w.samedi, n);
/* composition d'une rencontre : feuille réelle si jouée, sinon le plan -> {code: [noms]} */
function compositionRencontre(e, r) {
  if (r.jouee) return Object.fromEntries(r.matchs.map(m => [m.code, m.club.map(p => p.nom)]));
  const compo = PLAN.compos[r.id] || {};
  return Object.fromEntries(formatEquipe(e).map(c => [c, (compo[c] || []).filter(Boolean).map(l => (joueurPlan(l) || {}).nom || l)]));
}

async function exporterWeekendExcel(w) {
  const ExcelJS = await chargerExcelJS();
  const wb = new ExcelJS.Workbook();
  wb.creator = "Stats joueurs GAB38";
  const gras = { bold: true }, bord = { style: "thin", color: { argb: "FFBFBFBF" } };
  const cadre = { top: bord, left: bord, bottom: bord, right: bord };
  const remplir = (cell, argb) => { cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb } }; };
  const centre = { horizontal: "center", vertical: "middle", wrapText: true };

  // --- onglet de la journée : proposition d'équipe + valeur
  const ws = wb.addWorksheet(`J${w.n}`);
  ws.columns = [{ width: 26 }, { width: 26 }, { width: 16 }, { width: 18 }, { width: 13 }, { width: 13 }, { width: 9 }, { width: 9 }];
  ws.mergeCells("A1:D1"); ws.mergeCells("E1:H1");
  ws.getCell("A1").value = `PROPOSITION D'ÉQUIPE · week-end ${w.n} (${d2(w.samedi).getDate()}-${fDate(w.dimanche)})`;
  ws.getCell("E1").value = "VALEUR DE L'ÉQUIPE";
  for (const [c, f] of [["A1", "FFC9DAF8"], ["E1", "FFFFF2CC"]]) { const x = ws.getCell(c); x.font = gras; x.alignment = centre; remplir(x, f); }
  let ligne = 2;
  for (const n of w.equipes) {
    const e = IC.equipes.find(x => x.numero === n);
    const ps = joueursWeekend(w, n).slice().sort((a, b) => valeurPour(b, n) - valeurPour(a, n));
    const H = ps.filter(p => p.sexe === "H"), F = ps.filter(p => p.sexe === "F");
    const adv = w.items.filter(x => x.e.numero === n).map(x => x.r.adversaire).join(" · ");
    ws.mergeCells(ligne, 1, ligne, 2); ws.mergeCells(ligne, 5, ligne, 6); ws.mergeCells(ligne, 7, ligne, 8);
    const ent = [[1, `${e.division} - Équipe ${n}`], [3, "ABSENT(S)"], [4, "REMPLAÇANT(S)"], [5, "CLASSEMENTS"], [7, `POINTS ${echelle(n)}`]];
    for (const [col, v] of ent) { const x = ws.getCell(ligne, col); x.value = v; x.font = gras; x.alignment = centre; remplir(x, COULEUR_DIVISION[e.division] || "FFEFEFEF"); }
    ws.getCell(ligne, 1).note = adv ? `Contre : ${adv}` : undefined;
    const nb = Math.max(H.length, F.length, 4);
    for (let i = 0; i < nb; i++) {
      const r = ligne + 1 + i, h = H[i], f = F[i];
      ws.getCell(r, 1).value = h ? nomFeuille(h.nom) + (estMute(h.licence) ? " (M)" : "") : null;
      ws.getCell(r, 2).value = f ? nomFeuille(f.nom) + (estMute(f.licence) ? " (M)" : "") : null;
      ws.getCell(r, 5).value = h ? (h.classements || []).join("/") : null;
      ws.getCell(r, 6).value = f ? (f.classements || []).join("/") : null;
      ws.getCell(r, 7).value = h ? valeurPour(h, n) : null;
      ws.getCell(r, 8).value = f ? valeurPour(f, n) : null;
      for (let c = 1; c <= 8; c++) ws.getCell(r, c).border = cadre;
    }
    const tot = ligne + 1 + nb;
    ws.mergeCells(tot, 5, tot, 6); ws.mergeCells(tot, 7, tot, 8);
    ws.getCell(tot, 5).value = "Valeur (3 H + 3 F)"; ws.getCell(tot, 5).font = { italic: true, size: 9 };
    ws.getCell(tot, 7).value = valeurEquipe(ps, n); ws.getCell(tot, 7).font = gras; ws.getCell(tot, 7).alignment = centre;
    ligne = tot + 2;
  }
  ws.getCell(ligne, 1).value = "Valeurs : ICN pour l'équipe 1, ICR (N1 = 57) pour les autres ; valeur d'équipe = 3 meilleurs joueurs + 3 meilleures joueuses (règlement ICR AURA art. 5). (M) = muté.";
  ws.getCell(ligne, 1).font = { italic: true, size: 9, color: { argb: "FF666666" } };

  // --- onglet Compositions : une paire de colonnes par rencontre
  const wc = wb.addWorksheet("Compositions");
  let col = 1;
  for (const { e, r } of w.items) {
    const compo = compositionRencontre(e, r), codes = r.jouee ? r.matchs.map(m => m.code) : formatEquipe(e);
    const couleur = COULEUR_DIVISION[e.division] || "FFEFEFEF";
    wc.getColumn(col).width = 7; wc.getColumn(col + 1).width = 34;
    wc.mergeCells(1, col, 1, col + 1); wc.mergeCells(2, col, 2, col + 1);
    const t1 = wc.getCell(1, col); t1.value = `Équipe ${e.numero} · ${e.division}`; t1.font = gras; t1.alignment = centre; remplir(t1, couleur);
    const t2 = wc.getCell(2, col); t2.value = `${r.domicile ? "vs" : "@"} ${r.adversaire} · ${r.date ? fDate(r.date) : ""} ${r.heure || ""}${r.jouee ? ` · ${r.score_club}-${r.score_adv}` : ""}`;
    t2.font = { size: 9 }; t2.alignment = centre;
    // libellés du classeur : "SH 1", "DM 2"... numéro omis quand le match est unique dans son type ("DH", "DD")
    const multiples = new Set(codes.filter(c => slotNum(c) > 1).map(slotType));
    codes.forEach((code, i) => {
      const a = wc.getCell(3 + i, col), b = wc.getCell(3 + i, col + 1), noms = compo[code] || [];
      const t = slotType(code);
      a.value = `${t === "MX" ? "DM" : t}${multiples.has(t) ? ` ${slotNum(code)}` : ""}`; a.font = gras; remplir(a, couleur);
      b.value = noms.length > 1 ? noms.map(x => decouperNom(x).nom.toUpperCase()).join(" - ") : noms.length ? nomCompoSimple(noms[0]) : null;
      remplir(b, couleur); a.border = cadre; b.border = cadre;
    });
    col += 3;
  }
  const buf = await wb.xlsx.writeBuffer();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
  a.download = `Interclubs ${DATA.saison} - week-end ${w.n} (${w.samedi}).xlsx`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* copie des effectifs du week-end précédent vers w (équipes communes aux deux) */
function copierWeekendPrecedent(w, wes) {
  const src = wes[w.n - 2];
  if (!src) return "Pas de week-end précédent.";
  const aff = affectationsDe(w.samedi), communes = w.equipes.filter(n => src.equipes.includes(n));
  if (!communes.length) return `Aucune équipe ne joue les deux week-ends (${src.n} et ${w.n}).`;
  if (Object.keys(aff).length && !confirm(`Remplacer les affectations de ce week-end par les effectifs du week-end ${src.n} (équipes ${communes.join(", ")}) ?`)) return null;
  for (const lic of Object.keys(aff)) delete aff[lic];
  let nb = 0;
  for (const n of communes) for (const p of joueursWeekend(src, n)) if (!aff[p.licence]) { aff[p.licence] = n; nb++; }
  planSauver();
  const absentes = w.equipes.filter(n => !communes.includes(n));
  return `${nb} joueur(s) copié(s) depuis le week-end ${src.n}${src.passe ? " (joueurs ayant réellement joué)" : " (plan)"}${absentes.length ? ` ; équipe(s) ${absentes.join(", ")} absente(s) du week-end ${src.n} : à compléter` : ""}.`;
}

/* ---- rencontre : match par match */
const coteDe = (p, type) => p ? (p.cotes?.[DISC_IDX[type]] ?? null) : null;
const moyenne = xs => { const v = xs.filter(x => x != null); return v.length === xs.length && v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };

      ${r.jouee ? `<div class="stat"><div class="v num">${r.score_club} – ${r.score_adv}</div><div class="l">${resRencontre(r) === "V" ? "victoire" : resRencontre(r) === "D" ? "défaite" : "nul"}</div></div>` : ""}</div>`;

    };
    el.innerHTML = tete + `<section><h2>Feuille de match</h2><p class="hint">Cote de chaque joueur au moment du match (icbad). Colonne Cote : celle du joueur en simple, la moyenne des deux en double.</p>
      <div class="card scroll"><table class="t"><thead><tr><th>Match</th><th>GAB</th><th class="r">Cote</th><th>${esc(r.adversaire)}</th><th class="r">Cote</th><th>Résultat</th></tr></thead>
      <tbody>${r.matchs.map(ligne).join("")}</tbody></table></div></section>`;
    return;
  }

  // rencontre à venir : composition GAB (joueurs du week-end) vs composition type adverse
  const codes = formatEquipe(e);
  // cotes de J-10 (CPPH du jeudi précédant la semaine) quand elles sont connues
  const J10 = DATA.cotes_j10?.[w.samedi];
  const nos = joueursAffectes(w.samedi, n).map(p => J10?.cotes?.[p.licence] ? { ...p, cotes: J10.cotes[p.licence] } : p);
  const advJoueurs = new Map((adv?.joueurs || []).map(p => [p.licence, { ...p, cotes: p.classements.map(c => c.cote), classements: p.classements.map(c => c.classement) }]));
  const compo = PLAN.compos[rid] || (PLAN.compos[rid] = {});
  const compoAdv = PLAN.adverses[rid] || (PLAN.adverses[rid] = {});
  for (const c of adv?.composition_type || []) if (!compoAdv[c.code]) compoAdv[c.code] = c.joueurs.map(j => j.licence);

  const optionsPour = (liste, sexe, choisi, type) => `<option value="">—</option>` + liste.filter(p => p.sexe === sexe)

  el.innerHTML = tete + `
    ${nos.length ? "" : `<div class="card" style="margin-top:14px">${statut(false, `Aucun joueur affecté à l'équipe ${n} ce week-end : <a href="#plan/${w.samedi}">les choisir d'abord</a>.`)}</div>`}
    <section><h2>Composition</h2>
      <p class="hint">(M) = joueur muté, ${MAX_MUTES} au maximum alignés par rencontre. GAB : parmi les ${nos.length} joueurs affectés à l'équipe ${n} ce week-end. Adversaire : composition type icbad par défaut, modifiable. Cote de la discipline (simple, double ou mixte) ; pour un double, moyenne des deux. ${J10
      ? `Cotes GAB de J-10 (export du ${fDate(J10.export.slice(0, 10))}), celles qui fixent la hiérarchie.`
      : "Cotes GAB du dernier export : celles de J-10 ne sont pas encore publiées pour ce week-end."}</p>
      <div class="chips" style="margin-bottom:10px"><button class="chip" id="planProposer" title="Placement automatique respectant les règles, à ajuster ensuite">✦ Proposer une composition</button><span id="planProposerMsg" class="small muted" style="align-self:center"></span></div>
      <div class="card scroll" id="planCompo"></div><div id="planChecks" style="margin-top:12px"></div></section>`;

  const dessiner = () => {

      return `<tr><td><b>${slotLabel(code)}</b></td>
        <td>${roles.map((s, i) => `<select data-slot="${code}" data-i="${i}" data-cote="gab">${optionsPour(nos, s, (compo[code] || [])[i], t)}</select>`).join("<br>")}</td>

        <td class="r num">${fmt(ca)}</td>
        <td class="r num">${ecart == null ? "–" : `<span class="${deltaCls(ecart)}">${signed(ecart)}</span>`}</td></tr>`;
    });
    $("#planCompo").innerHTML = `<table class="t plan-compo"><thead><tr><th>Match</th><th>GAB</th><th class="r">Cote</th><th>${esc(r.adversaire)}</th><th class="r">Cote</th><th class="r">Écart</th></tr></thead><tbody>${lignes.join("")}</tbody></table>`;
    const nbMutesAdv = new Set(Object.values(compoAdv).flat().filter(l => l && advJoueurs.get(l)?.mute)).size;
    $("#planChecks").innerHTML = controlesCompo(codes, compo, nos)
      + `<div class="chk muted">Adversaire : ${nbMutesAdv} muté${nbMutesAdv > 1 ? "s" : ""} dans la composition affichée.</div>`;
  };
  dessiner();
  $("#planProposer").onclick = () => {
    if (!nos.length) { $("#planProposerMsg").textContent = "Affecter d'abord des joueurs à l'équipe ce week-end."; return; }
    const adverse = Object.fromEntries(codes.map(c => [c, (compoAdv[c] || []).map(l => advJoueurs.get(l)).filter(Boolean)]));
    const res = proposerComposition(codes, nos, adverse);
    if (!res) { $("#planProposerMsg").textContent = "Aucune composition valide avec les joueurs affectés (pas assez d'hommes ou de femmes ?)."; return; }
    for (const c of codes) compo[c] = res.compo[c];
    planSauver(); dessiner();
    $("#planProposerMsg").textContent = `≈ ${fmt(res.attendus, 1)} matchs gagnés attendus sur ${codes.length} (estimation indicative d'après les écarts de cote).`;
  };
  el.addEventListener("change", ev => {
    const s = ev.target.closest("select[data-slot]"); if (!s) return;
    const cible = s.dataset.cote === "gab" ? compo : compoAdv;
    const arr = cible[s.dataset.slot] || (cible[s.dataset.slot] = []);
    arr[+s.dataset.i] = s.value || null;
    planSauver(); dessiner();
  });
}

/* Composition automatique : respecte les règles (sexe, 2 matchs max par joueur,
   jamais deux dans la même discipline, hiérarchie des cotes dans chaque type,
   mutés) et maximise le nombre attendu de matchs gagnés, estimé par une
   probabilité logistique sur l'écart de cote (échelle 400, indicative).
   Recherche : glouton puis améliorations locales aléatoires, quelques départs. */
function proposerComposition(codes, nos, adverse) {
  const types = codes.map(c => slotType(c));
  const coteAdv = codes.map(c => moyenne((adverse[c] || []).map(p => coteDe(p, slotType(c)))));
  const proba = (cg, ca) => cg == null ? 0 : ca == null ? 0.5 + (cg - 2000) / 20000 : 1 / (1 + Math.pow(10, (ca - cg) / 400));
  const parSexe = { H: nos.filter(p => p.sexe === "H"), F: nos.filter(p => p.sexe === "F") };
  const evaluer = sol => {
    const matchs = {}, disc = {}, mutes = new Set();
    for (let i = 0; i < codes.length; i++) for (const p of sol[i]) {
      if (!p) return null;
      matchs[p.licence] = (matchs[p.licence] || 0) + 1;
      const d = DISC_NOM[types[i]]; const k = p.licence + d; disc[k] = (disc[k] || 0) + 1;
      if (matchs[p.licence] > 2 || disc[k] > 1) return null;
      if (estMute(p.licence)) mutes.add(p.licence);
      if (sol[i].length === 2 && sol[i][0].licence === sol[i][1].licence) return null;
    }
    if (mutes.size > MAX_MUTES) return null;
    return codes.reduce((a, c, i) => a + proba(moyenne(sol[i].map(p => coteDe(p, types[i]))), coteAdv[i]), 0);
  };
  // hiérarchie : dans chaque type à plusieurs matchs, les meilleurs (cote moyenne) sur le n°1
  const ordonner = sol => {
    const parType = {};
    codes.forEach((c, i) => (parType[types[i]] = parType[types[i]] || []).push(i));
    for (const [t, idx] of Object.entries(parType)) {
      if (idx.length < 2) continue;
      idx.sort((a, b) => slotNum(codes[a]) - slotNum(codes[b]));
      const entrees = idx.map(i => sol[i]).sort((x, y) => (moyenne(y.map(p => coteDe(p, t))) || 0) - (moyenne(x.map(p => coteDe(p, t))) || 0));
      idx.forEach((i, k) => { sol[i] = entrees[k]; });
    }
    return sol;
  };
  const aleatoire = l => l[Math.floor(Math.random() * l.length)];
  let meilleur = null, meilleurScore = -1;
  for (let depart = 0; depart < 6; depart++) {
    // glouton (départ 0) ou aléatoire (suivants)
    let sol = null;
    for (let essai = 0; essai < 200 && !sol; essai++) {
      const cand = codes.map((c, i) => ROLES[types[i]].map(sx => {
        const l = parSexe[sx]; if (!l.length) return null;
        return depart === 0 && essai === 0 ? [...l].sort((a, b) => (coteDe(b, types[i]) || 0) - (coteDe(a, types[i]) || 0))[0] : aleatoire(l);
      }));
      if (evaluer(ordonner(cand)) != null) sol = cand;
    }
    if (!sol) continue;
    let score = evaluer(sol);
    for (let it = 0; it < 3000; it++) {
      const i = Math.floor(Math.random() * codes.length), r = Math.floor(Math.random() * sol[i].length);
      const l = parSexe[ROLES[types[i]][r]];
      const essai = sol.map(x => [...x]); essai[i][r] = aleatoire(l);
      const sc = evaluer(ordonner(essai));
      if (sc != null && sc >= score) { sol = essai; score = sc; }
    }
    if (score > meilleurScore) { meilleur = sol; meilleurScore = score; }
  }
  if (!meilleur) return null;
  return { compo: Object.fromEntries(codes.map((c, i) => [c, meilleur[i].map(p => p.licence)])), attendus: meilleurScore };
}

/* contrôles d'une composition GAB : 2 matchs max, pas 2 dans la même discipline, hiérarchie des cotes */
function controlesCompo(codes, compo, nos) {
  const parLic = new Map(nos.map(p => [p.licence, p]));
  const out = [], matchs = {}, disc = {};
  let vides = 0;
  for (const code of codes) {
    const t = slotType(code), lics = (compo[code] || []).slice(0, ROLES[t].length);
    if (lics.filter(Boolean).length < ROLES[t].length) vides++;
    if (lics[0] && lics[0] === lics[1]) out.push(statut(false, `${slotLabel(code)} : le même joueur deux fois dans la paire`));
    for (const l of new Set(lics.filter(Boolean))) {
      (matchs[l] = matchs[l] || []).push(slotLabel(code));
      const d = DISC_NOM[t]; (disc[l] = disc[l] || {})[d] = (disc[l][d] || 0) + 1;
    }
  }
  const nom = l => parLic.get(l)?.nom || l;
  const trop = Object.entries(matchs).filter(([, ms]) => ms.length > 2);
  out.push(statut(!trop.length, trop.length ? `Plus de 2 matchs : ${trop.map(([l, ms]) => `${esc(nom(l))} (${ms.join(", ")})`).join(" ; ")}` : "Aucun joueur sur plus de 2 matchs"));
  const doublon = Object.entries(disc).flatMap(([l, ds]) => Object.entries(ds).filter(([, k]) => k > 1).map(([d]) => `${esc(nom(l))} (2 ${d}s)`));
  out.push(statut(!doublon.length, doublon.length ? `Deux matchs dans la même discipline : ${doublon.join(" ; ")}` : "Pas deux matchs dans la même discipline"));
  // hiérarchie : pour chaque type présent en plusieurs exemplaires, cote(n°1) >= cote(n°2) >= ...
  const parType = {};
  for (const code of codes) (parType[slotType(code)] = parType[slotType(code)] || []).push(code);
  for (const [t, cs] of Object.entries(parType)) {
    if (cs.length < 2) continue;
    cs.sort((a, b) => slotNum(a) - slotNum(b));
    const cotes = cs.map(c => moyenne(ROLES[t].map((_, i) => coteDe(parLic.get((compo[c] || [])[i]), t))));
    for (let i = 0; i + 1 < cs.length; i++) {
      if (cotes[i] == null || cotes[i + 1] == null) continue;
      const ok = cotes[i] >= cotes[i + 1];
      out.push(statut(ok, `Hiérarchie ${slotLabel(cs[i])} (${fmt(cotes[i])}) ${ok ? "≥" : "<"} ${slotLabel(cs[i + 1])} (${fmt(cotes[i + 1])})`));
    }
  }
  const mutes = Object.keys(matchs).filter(estMute);
  out.push(statut(mutes.length <= MAX_MUTES, `${mutes.length} muté${mutes.length > 1 ? "s" : ""} aligné${mutes.length > 1 ? "s" : ""}${mutes.length ? ` (${mutes.map(l => esc(nom(l))).join(", ")})` : ""} : ${MAX_MUTES} au maximum par rencontre (${REGLE_MUTES})`));
  if (vides) out.push(statut(false, `${vides} match(s) incomplet(s)`));
  return out.join("");
}

/* ---------- jeunes : catégorie d'âge FFBaD (colonne "Cat." de la recherche myffbad) */
const CAT_JEUNES = { Minibad: "U9", Poussin: "U11", Benjamin: "U13", Minime: "U15", Cadet: "U17", Junior: "U19" };
const _catLic = new Map(), _catNom = new Map();
for (const p of DATA.effectif || []) if (p.categorie) { _catLic.set(p.licence, p.categorie); _catNom.set(normNom(p.nom), p.categorie); }
const categorieDe = (licence, nom) => _catLic.get(licence) || (nom ? _catNom.get(normNom(nom)) : null) || null;
const uDe = cat => cat ? CAT_JEUNES[String(cat).split(" ")[0]] || null : null;
const estJeune = (licence, nom) => !!uDe(categorieDe(licence, nom));
const AVEC_CATEGORIES = _catLic.size > 0;
function badgeJeune(licence, nom) {
  const c = categorieDe(licence, nom), u = uDe(c);
  return u ? ` <abbr class="jeune" title="Jeune : ${esc(c)} (${u})">${u}</abbr>` : "";
}
/* filtre Tous / Hommes / Femmes / Jeunes (chips) */
const FILTRES_PUBLIC = [["tous", "Tous"], ["H", "Hommes"], ["F", "Femmes"], ["J", "Jeunes"]];
const filtrePublic = (k, licence, nom, sexe) => k === "tous" || (k === "J" ? estJeune(licence, nom) : sexe === k);
function chipsPublic(el, cle, apres) {
  const choix = AVEC_CATEGORIES ? FILTRES_PUBLIC : FILTRES_PUBLIC.slice(0, 3);
  el.innerHTML = choix.map(([k, l]) => `<button class="chip" data-p="${k}" aria-pressed="${state[cle] === k}">${l}</button>`).join("");
  el.onclick = e => { const b = e.target.closest("[data-p]"); if (!b) return; state[cle] = b.dataset.p; chipsPublic(el, cle, apres); apres(); };
}
const semainesDepuis = iso => Math.floor((d2(AUJ) - d2(iso)) / 864e5 / 7);

/* ---------- Club > Suivi : progression de la saison, proches du classement supérieur, inactivité */
const ORDRE_CLT = ["P12", "P11", "P10", "D9", "D8", "D7", "R6", "R5", "R4", "N3", "N2", "N1"];
const rangClt = c => ORDRE_CLT.indexOf(c);
const badgeClt = c => `<b class="rk" style="background:${rankColor(c)}">${esc(c || "NC")}</b>`;
/* seuil estimé d'un classement : cote la plus basse d'un joueur du club qui
   l'a déjà, dans le même tableau et le même sexe. Les seuils officiels ne
   sont pas récupérés : c'est un majorant (le vrai seuil est au plus là). */
let _seuils = null;
function seuilsEstimes() {
  if (_seuils) return _seuils;
  _seuils = {};
  for (const p of EFF) for (let i = 0; i < 3; i++) {
    const c = p.classements?.[i], v = p.cotes?.[i];
    if (rangClt(c) < 0 || !v) continue;
    const k = i + p.sexe;
    _seuils[k] = _seuils[k] || {};
    if (_seuils[k][c] == null || v < _seuils[k][c]) _seuils[k][c] = v;
  }
  return _seuils;
}
/* dernier match connu d'un joueur : fiche complète (tournois + IC myffbad), sinon feuilles icbad */
function dernierMatch(licence, nom) {
  const f = ficheDe(licence, nom);
  const dates = [];
  if (f) for (const m of f.matchs) if (m.date && !m.forfait) dates.push(m.date);
  for (const x of matchsICDe(licence, nom)) if (x.r.date) dates.push(x.r.date);
  return dates.sort().pop() || null;
}
