/* ---------- Club > Paires : associations de deux joueurs du club en double et en mixte */
function clubPaires(el) {
  const club = new Map();
  for (const p of EFF) club.set(normNom(p.nom), { licence: p.licence, nom: p.nom });
  for (const j of DATA.joueurs) club.set(normNom(j.nom), { licence: j.licence, nom: j.nom });
  const cleMatch = m => [m.date, m.evenement, m.tableau, [...m.adversaires].sort().join("|"), m.score].join("#");
  // matchs uniques d'une paire du club (vu depuis les deux fiches quand les deux en ont une)
  const vus = new Set(), paires = new Map();
  for (const j of DATA.joueurs) for (const m of j.matchs) {
    if (m.tableau === "Simple" || !m.partenaire || m.forfait) continue;
    const part = club.get(normNom(m.partenaire));
    if (!part) continue;
    const cle = cleMatch(m);
    if (vus.has(cle)) continue;
    vus.add(cle);
    const duo = [{ licence: j.licence, nom: j.nom }, part].sort((a, b) => a.nom.localeCompare(b.nom, "fr"));
    const k = duo.map(x => x.nom).join(" / ") + "#" + m.tableau;
    const x = paires.get(k) || { duo, tableau: m.tableau, n: 0, v: 0, ic: 0, cotes: [], dernier: "" };
    x.n++; x.v += m.victoire ? 1 : 0; x.ic += m.interclub ? 1 : 0;
    if (m.cote_adverse != null) x.cotes.push(m.cote_adverse);
    if (m.date > x.dernier) x.dernier = m.date;
    paires.set(k, x);
  }
  // % de chacun dans le même tableau avec d'autres partenaires
  const separe = (x) => {
    let n = 0, v = 0;
    for (const p of x.duo) {
      const f = ficheDe(p.licence, p.nom); if (!f) continue;
      const autre = normNom(x.duo.find(y => y !== p).nom);
      for (const m of f.matchs) if (m.tableau === x.tableau && !m.forfait && m.partenaire && normNom(m.partenaire) !== autre) { n++; v += m.victoire ? 1 : 0; }
    }
    return n ? { n, pct: v / n * 100 } : null;
  };
  const rows = [...paires.values()].map(x => ({ ...x, pct: x.v / x.n * 100, sep: separe(x),
    adv: x.cotes.length ? x.cotes.reduce((a, b) => a + b, 0) / x.cotes.length : null }));
  for (const r of rows) r.delta = r.sep ? r.pct - r.sep.pct : null;

  el.innerHTML = `<p class="hint">Paires de deux joueurs du club, tournois et interclubs (résultats myffbad des joueurs avec une fiche complète), chaque match compté une fois.
      « Δ séparés » : % de victoires ensemble moins le % de chacun des deux avec d'autres partenaires dans le même tableau.</p>
    <div class="grid g3" id="pairesTop" style="margin-bottom:14px"></div>
    <div class="chips" id="pairesTableau" style="margin-bottom:6px"></div>
    <div class="chips" id="pairesMin" style="margin-bottom:10px"></div>
    <div class="card scroll" id="pairesTable"></div>`;
  const nomPaire = r => r.duo.map(p => lienJoueurIC(p.licence, p.nom)).join(" / ");
  const lisse = r => (r.v + 2.5) / (r.n + 5) * 100;  // même lissage que l'indice performance
  const top = (t, titre) => {
    const xs = rows.filter(r => r.tableau === t && r.n >= 3).sort((a, b) => lisse(b) - lisse(a));
    const x = xs[0];
    return `<div class="card fact"><span class="k">${titre}</span>${x ? `<span class="t">${nomPaire(x)}</span><span class="s num">${x.v}/${x.n} · ${pct(x.pct)}</span>` : `<span class="s muted">Aucune paire avec 3 matchs.</span>`}</div>`;
  };
  const plusJouee = rows.slice().sort((a, b) => b.n - a.n)[0];
  $("#pairesTop").innerHTML = top("Double", "Meilleure paire de double") + top("Mixte", "Meilleure paire de mixte")
    + `<div class="card fact"><span class="k">Paire la plus jouée</span>${plusJouee ? `<span class="t">${nomPaire(plusJouee)}</span><span class="s num">${plusJouee.n} matchs en ${plusJouee.tableau.toLowerCase()}</span>` : "–"}</div>`;
  const draw = () => {
    $("#pairesTableau").innerHTML = ["Tous", "Double", "Mixte"].map(t => `<button class="chip" data-t="${t}" aria-pressed="${state.pairesTableau === t}">${t === "Tous" ? "" : `<span class="sw" style="background:${TC[t]}"></span>`}${t}</button>`).join("");
    $("#pairesMin").innerHTML = [[3, "Au moins 3 matchs"], [1, "Toutes"]].map(([n, l]) => `<button class="chip" data-n="${n}" aria-pressed="${state.pairesMin === n}">${l}</button>`).join("");
    sortableTable($("#pairesTable"), "paires", [
      { k: "nom", label: "Paire", val: r => r.duo[0].nom, html: nomPaire },
      { k: "t", label: "Tableau", val: r => r.tableau, html: r => `<span class="tagsw"><i style="background:${TC[r.tableau]}"></i>${r.tableau}</span>`, sm: true },
      { k: "n", label: "Matchs", val: r => r.n, num: true },
      { k: "v", label: "Victoires", val: r => r.v, num: true, sm: true },
      { k: "pct", label: "% vict.", val: r => lisse(r), html: r => cellVJ({ v: r.v, j: r.n, pct: r.pct }), num: true, title: "Tri sur le % lissé (comme si 5 matchs à 50 % s'ajoutaient)" },
      { k: "delta", label: "Δ séparés", val: r => r.delta, html: r => r.delta == null ? "–" : `<span class="${deltaCls(r.delta)}" title="${pct(r.sep.pct)} sur ${r.sep.n} matchs avec d'autres partenaires">${signed(r.delta)} pts</span>`, num: true },
      { k: "adv", label: "Cote adv. moy.", val: r => r.adv, num: true, sm: true },
      { k: "ic", label: "dont IC", val: r => r.ic, num: true, sm: true },
      { k: "dernier", label: "Dernier", val: r => r.dernier, html: r => fDate(r.dernier), num: true, sm: true },
    ], rows.filter(r => (state.pairesTableau === "Tous" || r.tableau === state.pairesTableau) && r.n >= state.pairesMin),
    { defaut: { cle: "n", sens: -1 }, rowClass: r => r.n < 3 ? "few" : "" });
  };
  $("#pairesTableau").onclick = e => { const b = e.target.closest("[data-t]"); if (!b) return; state.pairesTableau = b.dataset.t; draw(); };
  $("#pairesMin").onclick = e => { const b = e.target.closest("[data-n]"); if (!b) return; state.pairesMin = +b.dataset.n; draw(); };
  draw();
}

/* ---------- Interclubs > Pilotage : enjeux de poule, profondeur d'effectif,
   charge des joueurs, contribution par poste, bilan par adversaire */
/* équipe principale d'un joueur : celle où il a joué le plus de rencontres
   (à égalité, la plus haute) ; sinon sa liste d'équipe icbad */
function equipePrincipale(licence) {
  const h = historiqueIC.get(licence);
  if (h) return +Object.entries(h).sort((a, b) => b[1] - a[1] || a[0] - b[0])[0][0];
  const x = icJoueurs.get(licence);
  return x?.equipes?.length ? Math.min(...x.equipes) : null;
}
/* bloqué en équipe n après UNE rencontre de plus dans une équipe supérieure où il joue déjà */
function bientotBloque(c, n) {
  if (motifInterdit(c, n)) return null;
  for (const h of NUMEROS_EQUIPES.filter(m => m < n && c.r[m])) {
    const c2 = { r: { ...c.r, [h]: c.r[h] + 1 }, j: { ...c.j, [h]: (c.j[h] || 0) + 1 } };
    if (motifInterdit(c2, n)) return h;
  }
  return null;
}

function icPilotage(el) {
  const equipes = IC.equipes;
  el.innerHTML = `
    <section style="margin-top:0"><h2>Enjeux de poule</h2>
      <p class="hint">Projection : chaque équipe garde son rythme actuel (points par rencontre) jusqu'à la fin de la poule. Rencontres clés (3 prochaines) : adversaires classés juste au-dessus ou juste en dessous, à moins d'une rencontre de points.</p>
      <div class="card scroll" id="pilotEnjeux"></div></section>
    <section><h2>Profondeur d'effectif</h2>
      <p class="hint">Joueurs rattachés à chaque équipe (celle où ils ont joué le plus de rencontres, sinon leur liste icbad), encore autorisés à y jouer.
        Minimum : joueurs et joueuses nécessaires pour aligner tous les matchs (2 matchs maximum chacun, pas deux dans la même discipline).
        ⛔ : ne peut plus jouer dans l'équipe ; ⚠ : bloqué après une rencontre de plus en équipe supérieure.</p>
      <div class="grid g3" id="pilotProfondeur"></div></section>
    <section><h2>Charge et disponibilité</h2>
      <p class="hint">Présence : week-ends joués sur les week-ends déjà joués par l'équipe principale du joueur.</p>

    <section><h2>Contribution par poste</h2>
      <p class="hint">Victoires / matchs joués à chaque poste. Rencontres serrées : écart final de 2 matchs ou moins (5-3, 4-4…).</p>
      <div class="chips" id="pilotContribMin" style="margin-bottom:10px"></div>
      <div class="card scroll" id="pilotContrib"></div></section>
    <section><h2>Bilan par adversaire</h2>
      <div class="grid g2"><div class="card scroll" id="pilotClubs"></div><div class="card scroll" id="pilotDeps"></div></div></section>`;

  // 1. enjeux de poule
  const enjeux = equipes.map(e => {
    const total = e.rencontres.length;
    const proj = e.classement.map(c => ({ ...c, rythme: c.j ? c.pts / c.j : 0, final: c.pts + (c.j ? c.pts / c.j : 0) * Math.max(0, total - c.j) }))
      .sort((a, b) => b.final - a.final);
    proj.forEach((c, i) => c.rangProj = i + 1);
    const moi = proj.find(c => c.club && c.code === e.code) || {};
    const parRang = [...e.classement].sort((a, b) => a.rang - b.rang);
    const i = parRang.findIndex(c => c.club && c.code === e.code);
    const dessus = parRang[i - 1], dessous = parRang[i + 1];
    const demi = formatEquipe(e).length / 2;
    const cles = e.rencontres.filter(r => !r.jouee).map(r => {
      const adv = e.classement.find(c => c.equipe_id === r.adversaire_equipe_id || c.code === r.adversaire_code);
      return { r, adv, cle: adv && Math.abs(adv.rang - e.rang) <= 1 && Math.abs(adv.pts - (moi.pts ?? 0)) <= 2 * demi };
    }).filter(x => x.cle).slice(0, 3);
    return { e, moi, dessus, dessous, cles, restantes: e.rencontres.filter(r => !r.jouee).length };

    ${enjeux.map(({ e, moi, dessus, dessous, cles, restantes }) => `<tr class="click" data-href="#ic/${e.numero}">
      <td><span class="eq">Équipe ${e.numero}</span> <span class="muted small">${esc(e.division)}</span></td>
      <td class="r num">${ordinal(e.rang)} <span class="muted small">/ ${e.nb_equipes}</span></td>
      <td class="r num"><b>${moi.pts ?? "–"}</b> <span class="muted small">${moi.j ?? 0} J.</span></td>
      <td class="r num hide-sm">${fmt(moi.rythme, 1)} <span class="muted small">/ renc.</span></td>
      <td class="r num">${restantes ? `${ordinal(moi.rangProj)} <span class="muted small">(${fmt(moi.final)} pts)</span>` : `<span class="muted">terminé</span>`}</td>
      <td class="r num hide-sm">${dessus ? `<span class="delta-down">${signed(moi.pts - dessus.pts)}</span> <span class="muted small" title="${esc(dessus.nom)}">${esc(dessus.code || "")}</span>` : `<span class="muted">en tête</span>`}</td>
      <td class="r num hide-sm">${dessous ? `<span class="delta-up">${signed(moi.pts - dessous.pts)}</span> <span class="muted small" title="${esc(dessous.nom)}">${esc(dessous.code || "")}</span>` : `<span class="muted">dernier</span>`}</td>
      <td>${cles.length ? cles.map(({ r, adv }) => `<div>${r.date ? fDate(r.date) : "–"} · ${lienPlan(e, r, esc(r.adversaire_code || r.adversaire))} <span class="muted small">${ordinal(adv.rang)}, ${adv.pts} pts</span></div>`).join("")
        : `<span class="muted">${restantes ? "aucune" : "–"}</span>`}</td></tr>`).join("")}</tbody></table>`;
  $("#pilotEnjeux").onclick = ev => { const tr = ev.target.closest("tr[data-href]"); if (tr && !ev.target.closest("a")) location.hash = tr.dataset.href; };

  // 2. profondeur d'effectif
  const rattaches = new Map(equipes.map(e => [e.numero, []]));
  for (const l of licencesIC) {
    const n = equipePrincipale(l);
    if (rattaches.has(n)) rattaches.get(n).push(joueurPlan(l) || { licence: l, nom: icJoueurs.get(l)?.nom || l, sexe: icSexe.get(l) });
  }
  $("#pilotProfondeur").innerHTML = equipes.filter(e => e.numero <= PLAN_NB).map(e => {
    const min = effectifMinimum(formatEquipe(e));
    const ps = rattaches.get(e.numero).map(p => { const c = compteurJoue(p.licence); return { p, bloque: !!motifInterdit(c, e.numero), bientot: bientotBloque(c, e.numero) }; });
    const ligne = s => {
      const xs = ps.filter(x => x.p.sexe === s).sort((a, b) => valeurPour(b.p, e.numero) - valeurPour(a.p, e.numero));
      const dispo = xs.filter(x => !x.bloque).length, m = min[s];
      const etat = dispo < m ? ["ko", `${dispo} disponible${dispo > 1 ? "s" : ""} pour ${m} nécessaires`]
        : dispo === m ? ["warn", `${dispo} disponible${dispo > 1 ? "s" : ""}, aucun remplaçant`]
        : ["ok", `${dispo} disponibles, ${dispo - m} remplaçant${dispo - m > 1 ? "s" : ""}`];
      return `<div class="prof ${etat[0]}"><b>${s === "H" ? "Hommes" : "Femmes"}</b> <span class="small">${etat[1]} (min. ${m})</span></div>
        <div class="small" style="margin:2px 0 8px">${xs.map(x => `<span class="${x.bloque ? "muted" : ""}" title="${x.bloque ? "Ne peut plus jouer dans cette équipe" : x.bientot ? `Bloqué après une rencontre de plus en équipe ${x.bientot}` : ""}">${lienJoueurIC(x.p.licence, x.p.nom, true)}${x.bloque ? " ⛔" : x.bientot ? " ⚠" : ""}</span>`).join(", ") || `<span class="muted">aucun</span>`}</div>`;
    };
    return `<div class="card tcard"><h3><a class="eq" href="#ic/${e.numero}">Équipe ${e.numero}</a> <span class="muted">${esc(e.division)}</span></h3>${ligne("H")}${ligne("F")}</div>`;
  }).join("");

  // 3. charge et disponibilité
  const wesEquipe = new Map(equipes.map(e => [e.numero, new Set(icRencontresJouees(e).filter(r => r.date).map(r => samediDe(r.date)))]));
  const charge = [...historiqueIC.keys()].map(l => {
    const ms = [], wes = new Set(), renc = new Set();
    let dernier = "";
    for (const e of equipes) for (const r of icRencontresJouees(e)) {
      const mien = r.matchs.filter(m => m.club.some(p => p.licence === l));
      if (!mien.length) continue;
      renc.add(r.id); ms.push(...mien); if (r.date) { wes.add(samediDe(r.date)); if (r.date > dernier) dernier = r.date; }
    }
    const n = equipePrincipale(l), ref = wesEquipe.get(n)?.size || 0;
    const p = joueurPlan(l) || {};
    return { licence: l, nom: p.nom || icJoueurs.get(l)?.nom || l, sexe: p.sexe || icSexe.get(l), principale: n, wes: wes.size, ref,
      presence: ref ? Math.min(100, wes.size / ref * 100) : null, renc: renc.size, matchs: ms.filter(m => m.victoire != null).length, dernier };
  });
  sortableTable($("#pilotCharge"), "pilotCharge", [
    { k: "nom", label: "Joueur", val: r => r.nom, html: r => lienJoueurIC(r.licence, r.nom) + badgeMute(estMute(r.licence)) },
    { k: "sexe", label: "", val: r => r.sexe || "", sm: true },
    { k: "eq", label: "Équipes", val: r => r.principale, html: r => fmtHistorique(r.licence) },
    { k: "wes", label: "Week-ends", val: r => r.wes, num: true },
    { k: "presence", label: "Présence", val: r => r.presence, html: r => r.presence == null ? "–" : `${pct(r.presence)} <span class="muted small">(${r.wes}/${r.ref})</span>`, num: true,
      title: "Week-ends joués / week-ends joués par son équipe principale" },
    { k: "renc", label: "Rencontres", val: r => r.renc, num: true, sm: true },
    { k: "m", label: "Matchs", val: r => r.matchs, num: true },
    { k: "dernier", label: "Dernière", val: r => r.dernier, html: r => r.dernier ? fDate(r.dernier) : "–", num: true, sm: true },
  ], charge, { defaut: { cle: "wes", sens: -1 } });

  const drawJamais = () => {
    const seuils = { R6: 18, D7: 12, D9: 6 };
    $("#pilotJamaisFiltre").innerHTML = [["R6", "R6 et mieux"], ["D7", "D7 et mieux"], ["D9", "D9 et mieux"]].map(([k, l]) =>
      `<button class="chip" data-k="${k}" aria-pressed="${state.pilotJamais === k}">${l}</button>`).join("");
    sortableTable($("#pilotJamais"), "pilotJamais", [
      { k: "nom", label: "Joueur", val: r => r.nom, html: r => lienJoueurIC(r.licence, r.nom) + badgeMute(estMute(r.licence)) },
      { k: "sexe", label: "", val: r => r.sexe, sm: true },
      { k: "clt", label: "Clt S/D/M", val: r => r.icr, html: clsBadges },
      { k: "icr", label: "ICR", val: r => r.icr, num: true },
      { k: "liste", label: "Liste icbad", val: r => icJoueurs.get(r.licence)?.equipes?.[0] ?? 99,
        html: r => icJoueurs.has(r.licence) ? icJoueurs.get(r.licence).equipes.map(n => `<a class="eq" href="#ic/${n}">Éq.${n}</a>`).join(" ") : `<span class="muted">non inscrit</span>`, sm: true },
      { k: "der", label: "Dernier match", val: r => dernierMatch(r.licence, r.nom) || "", html: r => { const d = dernierMatch(r.licence, r.nom); return d ? fDate(d) : `<span class="muted">inconnu</span>`; }, num: true, sm: true,
        title: "Connu seulement pour les joueurs avec une fiche complète" },
    ], EFF.filter(p => !historiqueIC.has(p.licence) && (p.icr || 0) >= seuils[state.pilotJamais]), { defaut: { cle: "icr", sens: -1 } });
  };
  $("#pilotJamaisFiltre").onclick = ev => { const b = ev.target.closest("[data-k]"); if (!b) return; state.pilotJamais = b.dataset.k; drawJamais(); };
  drawJamais();

  // 4. contribution par poste
  const tous = equipes.flatMap(icMatchs), slots = slotsDe(tous);
  const serree = r => Math.abs(r.score_club - r.score_adv) <= 2;
  const contrib = new Map();
  for (const m of tous) for (const p of m.club) {
    if (!p.licence) continue;
    const x = contrib.get(p.licence) || { licence: p.licence, nom: p.nom, ms: [] };
    x.ms.push(m); contrib.set(p.licence, x);
  }
  const lignesContrib = [...contrib.values()].map(x => ({ ...x, b: vj(x.ms), s: vj(x.ms.filter(m => serree(m.r))) }));
  const drawContrib = () => {
    $("#pilotContribMin").innerHTML = [[3, "Au moins 3 matchs"], [1, "Tous"]].map(([n, l]) => `<button class="chip" data-n="${n}" aria-pressed="${state.contribMin === n}">${l}</button>`).join("");
    sortableTable($("#pilotContrib"), "pilotContrib", [
      { k: "nom", label: "Joueur", val: r => r.nom, html: r => lienJoueurIC(r.licence, r.nom) },
      { k: "m", label: "Matchs", val: r => r.b.j, num: true },
      { k: "pct", label: "% vict.", val: r => r.b.pct, html: r => cellVJ(r.b, { pctSeul: true }), num: true },
      { k: "serr", label: "Renc. serrées", val: r => r.s.j ? r.s.pct : null, html: r => cellVJ(r.s), num: true, title: "Matchs gagnés / joués dans les rencontres finies à 2 matchs d'écart ou moins" },
      ...slots.map(s => ({ k: "p" + s.cle, label: s.label, val: r => { const b = vj(r.ms.filter(m => slotCle(m.code) === s.cle)); return b.j ? b.pct + b.j / 1000 : null; },
        html: r => cellVJ(vj(r.ms.filter(m => slotCle(m.code) === s.cle))), num: true, sm: true })),
    ], lignesContrib.filter(r => r.b.j >= state.contribMin), { defaut: { cle: "m", sens: -1 } });
  };
  $("#pilotContribMin").onclick = ev => { const b = ev.target.closest("[data-n]"); if (!b) return; state.contribMin = +b.dataset.n; drawContrib(); };
  drawContrib();

  // 5. bilan par club adverse et par département
  const parClub = new Map(), parDep = new Map();
  for (const e of equipes) for (const r of icRencontresJouees(e)) {
    const code = r.adversaire_code || "", club = code.replace(/-\d+$/, ""), dep = code.split("-")[0] || "?";
    const nom = String(r.adversaire || code).replace(/\s*\([^)]*\)\s*$/, "");
    for (const [map, k, lib] of [[parClub, club, nom], [parDep, dep, dep]]) {
      const x = map.get(k) || { k, lib, rs: [], equipes: new Set() };
      x.rs.push(r); x.equipes.add(e.numero); map.set(k, x);
    }
  }
  const colsAdv = (titre, html) => [
    { k: "lib", label: titre, val: r => r.lib, html },
    { k: "n", label: "Renc.", val: r => r.rs.length, num: true },
    { k: "vnd", label: "V-N-D", val: r => r.rs.filter(x => resRencontre(x) === "V").length / r.rs.length,
      html: r => ["V", "N", "D"].map(c => r.rs.filter(x => resRencontre(x) === c).length).join("-"), num: true },
    { k: "m", label: "Matchs", val: r => { const v = r.rs.reduce((a, x) => a + x.score_club, 0), j = r.rs.reduce((a, x) => a + x.score_club + x.score_adv, 0); return j ? v / j : null; },
      html: r => { const v = r.rs.reduce((a, x) => a + x.score_club, 0), j = r.rs.reduce((a, x) => a + x.score_club + x.score_adv, 0); return cellVJ({ v, j, pct: j ? v / j * 100 : null }); }, num: true },
  ];
  sortableTable($("#pilotClubs"), "pilotClubs", colsAdv("Club adverse", r => `${esc(r.lib)} <span class="muted small">${esc(r.k)} · éq. ${[...r.equipes].sort((a, b) => a - b).join(", ")}</span>`),
    [...parClub.values()], { defaut: { cle: "n", sens: -1 } });
  sortableTable($("#pilotDeps"), "pilotDeps", colsAdv("Département", r => `<b>${esc(r.lib)}</b> <span class="muted small">${new Set(r.rs.map(x => (x.adversaire_code || "").replace(/-\d+$/, ""))).size} club(s)</span>`),
    [...parDep.values()], { defaut: { cle: "n", sens: -1 } });
}

/* ---------- démarrage */
try { planNettoyer(); } catch (e) { console.warn("nettoyage du plan impossible", e); }
$("#meta").textContent = `Saison ${DATA.saison} · données du ${DATA.genere_le}`;
if (DATA.excel_url) $("#excel").href = DATA.excel_url; else $("#excel").remove();
let resizeT, lastW = window.innerWidth;
window.addEventListener("resize", () => {
  if (window.innerWidth === lastW) return;  // mobile : la barre d'adresse qui se replie déclenche resize
  lastW = window.innerWidth;
  clearTimeout(resizeT); resizeT = setTimeout(route, 150);
});
route();
</script>
</body>
</html>
