<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Stats joueurs GAB38</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --surface-2: #f3f2ee;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --ring: rgba(11,11,11,0.10);
  --s: #2a78d6;   /* Simple  - slot 1 */
  --d: #eb6834;   /* Double  - slot 2 */
  --m: #1baf7a;   /* Mixte   - slot 3 */
  --club: #52514e;
  --good: #0ca30c;
  --good-text: #006300;
  --bad: #d03b3b;
  --bad-text: #b02a2a;
  --rank-n: #c0392b; --rank-r: #2e6db4; --rank-d: #2f8a3e; --rank-p: #8a8a8a;
  --accent-wash: rgba(42,120,214,0.08);
  /* compétitions : week-end / soirée / interclub (validées ensemble, clair + sombre) */
  --we: #6250d6; --so: #e87ba4; --ic: #eda100;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232322;
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
    --s: #3987e5; --d: #d95926; --m: #199e70; --club: #c3c2b7;
    --good-text: #0ca30c; --bad-text: #e66767;
    --accent-wash: rgba(57,135,229,0.14);
  --we: #9085e9; --so: #d55181; --ic: #c98500;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232322;
  --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
  --s: #3987e5; --d: #d95926; --m: #199e70; --club: #c3c2b7;
  --good-text: #0ca30c; --bad-text: #e66767;
  --accent-wash: rgba(57,135,229,0.14);
  --we: #9085e9; --so: #d55181; --ic: #c98500;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
}
a { color: inherit; }
button, input, select { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- layout */
header.top {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--grid);
}
header.top h1 { font-size: 16px; margin: 0; font-weight: 650; }
header.top .meta { color: var(--muted); font-size: 12px; }
nav.tabs { display: flex; gap: 4px; margin-left: auto; }
nav.tabs a {
  text-decoration: none; padding: 6px 12px; border-radius: 6px; color: var(--ink-2);
}
nav.tabs a.on { background: var(--accent-wash); color: var(--ink); font-weight: 600; }
.dl { text-decoration: none; border: 1px solid var(--grid); border-radius: 6px; padding: 5px 10px; font-size: 13px; color: var(--ink-2); }
.dl:hover { background: var(--surface-2); }
#theme { border: 1px solid var(--grid); background: none; border-radius: 6px; padding: 5px 8px; cursor: pointer; }

.wrap { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: calc(100vh - 52px); }
.wrap.noside { grid-template-columns: minmax(0, 1fr); }
.wrap.noside main { margin: 0 auto; }
aside.list {
  border-right: 1px solid var(--grid); background: var(--surface);
  position: sticky; top: 52px; height: calc(100vh - 52px); overflow: auto; padding: 12px;
}
aside.list input {
  width: 100%; padding: 7px 10px; border: 1px solid var(--grid); border-radius: 6px; background: var(--page);
}
aside.list .filters { display: flex; gap: 4px; margin: 8px 0; }
aside.list ul { list-style: none; margin: 0; padding: 0; }
aside.list li a {
  display: flex; justify-content: space-between; gap: 8px; align-items: center;
  padding: 6px 8px; border-radius: 6px; text-decoration: none;
}
aside.list li a:hover { background: var(--surface-2); }
aside.list li a.on { background: var(--accent-wash); font-weight: 600; }
aside.list li .sub { color: var(--muted); font-size: 12px; }
#mobilePick { display: none; }
main { padding: 20px 24px 60px; max-width: 1180px; width: 100%; }
@media (max-width: 900px) {
  .wrap { display: block; }
  aside.list { display: none; }
  #mobilePick { display: block; width: 100%; padding: 8px; margin-bottom: 14px;
    border: 1px solid var(--grid); border-radius: 6px; background: var(--surface); }
  main { padding: 14px 16px 40px; }
  nav.tabs { margin-left: 0; }
}

/* ---------- blocks */
.card { background: var(--surface); border: 1px solid var(--grid); border-radius: 10px; padding: 16px; }
.grid { display: grid; gap: 14px; }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 900px) { .g3, .g2 { grid-template-columns: 1fr; } .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
section { margin-top: 26px; }
section > h2 { font-size: 15px; margin: 0 0 4px; font-weight: 650; }
section > p.hint { margin: 0 0 12px; color: var(--muted); font-size: 12.5px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }

.hero { display: flex; flex-wrap: wrap; gap: 18px 28px; align-items: flex-end; }
.hero h2 { font-size: 26px; margin: 0; letter-spacing: -0.01em; }
.hero .who { flex: 1 1 260px; }
.badges { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.rank {
  display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px 2px 6px; border-radius: 999px;
  background: var(--surface-2); font-size: 12px; color: var(--ink-2);
}
.rank b { color: #fff; border-radius: 4px; padding: 0 5px; font-size: 11.5px; }
.stat .v { font-size: 26px; font-weight: 650; line-height: 1.1; }
.stat .l { color: var(--muted); font-size: 12px; }
.delta-up { color: var(--good-text); }
.delta-down { color: var(--bad-text); }

.tcard h3 { margin: 0; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.tcard .sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.tcard .row { display: flex; justify-content: space-between; gap: 8px; padding: 5px 0; border-top: 1px solid var(--grid); }
.tcard .row:first-of-type { border-top: 0; }
.tcard .row > span:first-child { color: var(--ink-2); }
.vs { padding: 1px 6px; border-radius: 4px; }
.tcard.off { opacity: .55; }
.tcard .big { display: flex; align-items: baseline; gap: 10px; margin: 10px 0 6px; }
.tcard .big .v { font-size: 30px; font-weight: 650; }
.meter { position: relative; height: 8px; background: var(--surface-2); border-radius: 4px; margin: 4px 0 12px; }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; }
.meter .mid { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--axis); }
.warn { font-size: 12px; color: var(--muted); margin-top: 6px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--grid); background: var(--surface); border-radius: 999px; padding: 4px 10px;
  cursor: pointer; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px;
}
a.chip { text-decoration: none; color: var(--ink-2); }
.chip.on, .chip[aria-pressed="true"] { background: var(--accent-wash); border-color: transparent; font-weight: 600; }
.chip .sw { width: 8px; height: 8px; border-radius: 2px; }

.fact { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-content: start; }
.fact .k { font-size: 12px; color: var(--muted); grid-column: 1 / -1; }
.fact .t { font-weight: 600; }
.fact .s { color: var(--ink-2); font-size: 12.5px; grid-column: 1 / -1; }
.fact .x { grid-column: 1 / -1; font-size: 12px; color: var(--muted); margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--grid); }
.fact.off { opacity: .55; }
/* 3 colonnes S / D / M, 2 lignes (victoire en haut, défaite en bas) ; les
   éléments arrivent groupés par tableau, d'où le remplissage en colonnes -
   sur mobile, une seule colonne : chaque tableau reste groupé */
.grid.facts { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: auto auto; grid-auto-flow: column; }
@media (max-width: 900px) { .grid.facts { grid-template-columns: 1fr; grid-template-rows: none; grid-auto-flow: row; } }

table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; font-weight: 600; color: var(--ink-2); font-size: 12px; padding: 6px 8px;
  border-bottom: 1px solid var(--axis); white-space: nowrap; }
table.t th.sortable { cursor: pointer; user-select: none; }
table.t th.sortable:hover { color: var(--ink); }
table.t td { padding: 6px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
table.t td.r, table.t th.r { text-align: right; }
table.t tr.few td { color: var(--muted); }
table.t tr.club td { background: var(--accent-wash); }
/* ligne de totaux, séparée du corps du tableau */
abbr.jeune { text-decoration: none; display: inline-block; font-size: 10px; font-weight: 700; line-height: 1; padding: 2px 4px; border-radius: 3px;
  background: var(--we); color: #fff; vertical-align: 1px; cursor: help; }
.prof { padding: 3px 6px; border-radius: 4px; margin-top: 6px; }
.prof.ok { background: rgba(12,163,12,.10); }
.prof.warn { background: rgba(250,178,25,.16); }
.prof.ko { background: rgba(208,59,59,.12); }
table.t tfoot td { border-top: 2px solid var(--axis); border-bottom: 0; font-weight: 600; }
/* planificateur */
/* colonnes fixées par le nombre d'équipes du week-end (voir colsPlan) : 6 -> 2 lignes de 3 */
.plan-grid { grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); }
@media (max-width: 1000px) { .plan-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px) { .plan-grid { grid-template-columns: 1fr; } }
.plan-eq h3 { margin: 0 0 6px; font-size: 14px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.plan-eq .renc { display: flex; flex-direction: column; gap: 2px; margin-bottom: 8px; font-size: 12.5px; }
.plan-eq .renc-lien { text-decoration: none; color: var(--ink-2); }
.plan-eq .renc-lien:hover { color: var(--ink); text-decoration: underline; }
.plan-eq .pj { display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px; align-items: center; padding: 4px 0; border-top: 1px solid var(--grid); font-size: 13px; }
.plan-eq .pj[draggable="true"] { cursor: grab; }
.plan-eq .pied { margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--axis); font-size: 12px; color: var(--ink-2); }
.plan-eq .vide { padding: 14px 0; text-align: center; border: 1px dashed var(--axis); border-radius: 6px; }
.plan-eq .x { border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 16px; line-height: 1; padding: 0 2px; }
.plan-eq .x:hover { color: var(--bad-text); }
.eq.brule { border-color: var(--bad); background: rgba(208,59,59,.12); color: var(--bad-text); font-weight: 600; }
.plan-eq .pj.alerte { background: rgba(208,59,59,.08); border-radius: 4px; }
.plan-eq .pj.alerte-jaune { background: rgba(250,178,25,.12); border-radius: 4px; }
.plan-eq .pj .bandeau.jaune { background: #fab219; color: #0b0b0b; }
.chk.warn { color: #8a5a00; font-weight: 600; }
:root[data-theme="dark"] .chk.warn { color: #fab219; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chk.warn { color: #fab219; } }
.plan-eq .pj .bandeau { grid-column: 1 / -1; background: var(--bad); color: #fff; font-size: 11.5px; font-weight: 600; padding: 2px 6px; border-radius: 3px; }
select.sel-alerte { border-color: var(--bad) !important; color: var(--bad-text); }
abbr.mute { text-decoration: none; display: inline-block; font-size: 10px; font-weight: 700; line-height: 1; padding: 2px 4px; border-radius: 3px;
  background: #ec835a; color: #0b0b0b; vertical-align: 1px; cursor: help; }
.mute-trop { color: var(--bad-text); font-weight: 700; }
.evol { font-size: 12px; margin-top: 4px; font-weight: 600; }
.set-marque { background: rgba(250,178,25,.35); border-radius: 3px; padding: 0 3px; }
.carte-tournoi h3 { margin: 0 0 8px; font-size: 14px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.carte-tournoi .mt { display: grid; grid-template-columns: auto auto 1fr auto auto; gap: 6px; align-items: center; font-size: 12.5px; padding: 4px 0; border-top: 1px solid var(--grid); }
.carte-tournoi .mt .sc { white-space: nowrap; color: var(--ink-2); }
.pic { display: grid; grid-template-columns: 14px 1fr auto; gap: 8px; align-items: center; padding: 3px 0; font-size: 13px; }
.pic-genre { font-size: 11.5px; color: var(--muted); margin-top: 6px; text-transform: uppercase; letter-spacing: .04em; }
details.riv { border-top: 1px solid var(--grid); padding: 6px 0; }
details.riv:first-child { border-top: 0; }
details.riv summary { cursor: pointer; display: grid; grid-template-columns: 1fr auto 1fr auto; gap: 10px; align-items: center; font-size: 13px; }
details.riv .riv-b { text-align: left; } details.riv .riv-a { text-align: right; }
details.riv .gagne { font-weight: 650; }
@media (max-width: 640px) { details.riv summary { grid-template-columns: 1fr auto 1fr; } details.riv summary > .small { grid-column: 1 / -1; } }
.drop.survol { outline: 2px dashed var(--s); outline-offset: 2px; }
.poignee { cursor: grab; color: var(--muted); user-select: none; }
.chk { font-size: 13px; padding: 3px 0; }
.chk.ok { color: var(--good-text); }
.chk.ko { color: var(--bad-text); font-weight: 600; }
.plan-compo select, #planPool select { max-width: 230px; padding: 3px 4px; border: 1px solid var(--grid); border-radius: 5px; background: var(--surface); margin: 1px 0; }
table.ic-renc td.slot { min-width: 104px; font-size: 12.5px; line-height: 1.35; }
table.ic-renc td.slot.win { background: rgba(12,163,12,.13); }
table.ic-renc td.slot.loss { background: rgba(208,59,59,.12); }
table.ic-renc th { white-space: nowrap; }
table.t tr.total td { font-weight: 650; border-top: 1px solid var(--axis); }
table.t tr.sep td { border-top: 1px solid var(--axis); }
.subnav { margin-bottom: 18px; }
.rk { color: #fff; border-radius: 4px; padding: 0 5px; font-size: 11.5px; }
table.t tr.click { cursor: pointer; }
table.t tr.click:hover td { background: var(--surface-2); }
.scroll { overflow-x: auto; }
@media (max-width: 600px) { .hide-sm { display: none; } table.t td, table.t th { padding: 6px 5px; } }
.res { display: inline-block; min-width: 18px; text-align: center; border-radius: 4px; font-weight: 700; font-size: 11.5px; padding: 1px 4px; color: #fff; }
.res.v { background: var(--good); }
.res.d { background: var(--bad); }
a.eq { text-decoration: none; }
a.eq:hover { background: var(--surface-2); }
.eq { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 4px; border: 1px solid var(--ic); color: var(--ink-2); white-space: nowrap; }
.tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 4px; background: var(--surface-2); color: var(--ink-2); }
.tagsw { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-2); }
.tagsw i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }

/* ---------- charts */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; }
.chart .lbl { fill: var(--ink-2); font-size: 11.5px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin-bottom: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 3px; border-radius: 2px; display: inline-block; }
.legend i.box { height: 10px; width: 10px; border-radius: 3px; }
.tip {
  position: absolute; pointer-events: none; z-index: 5; min-width: 140px;
  background: var(--surface); border: 1px solid var(--grid); box-shadow: 0 4px 16px rgba(0,0,0,.12);
  border-radius: 8px; padding: 8px 10px; font-size: 12px; display: none; white-space: nowrap;
}
.tip .h { color: var(--muted); margin-bottom: 4px; }
.tip .r { display: flex; justify-content: space-between; gap: 14px; }
.tip .r i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 6px; }
.empty { color: var(--muted); padding: 18px 0; }
details.howto summary { cursor: pointer; color: var(--ink-2); font-size: 12.5px; }
details.howto p { margin: 6px 0; color: var(--ink-2); font-size: 12.5px; }
</style>
</head>
<body>
<header class="top">
  <h1>Stats joueurs GAB38</h1>
  <span class="meta" id="meta"></span>
  <nav class="tabs">
    <a href="#club" id="tabClub">Club</a>
    <a href="#ic" id="tabIC">Interclubs</a>
    <a href="#plan" id="tabPlan">Planificateur</a>
    <a href="#joueur" id="tabJoueur">Joueurs</a>
  </nav>
  <a id="excel" class="dl" href="#" target="_blank" rel="noopener" title="Télécharger la version Excel (dernier export hebdomadaire)">⬇ Excel</a>
  <button id="theme" type="button" title="Thème clair / sombre">◐</button>
</header>
<div class="wrap">
  <aside class="list" id="list">
    <input id="q" type="search" placeholder="Rechercher un joueur…" autocomplete="off">
    <div class="filters chips" id="sexFilter"></div>
    <ul id="players"></ul>
  </aside>
  <main id="main"></main>
</div>

<script>
const DATA = /*__DATA__*/null;
</script>
<script>
"use strict";
const T = ["Simple", "Double", "Mixte"];
const TC = { Simple: "var(--s)", Double: "var(--d)", Mixte: "var(--m)" };
const TL = { Simple: "S", Double: "D", Mixte: "M" };
const PEU_DE_MATCHS = 5;
const MOIS_COURT = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
const MOIS_LONG = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];

const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (v, nd = 0) => v == null ? "–" : Number(v).toLocaleString("fr-FR", { maximumFractionDigits: nd, minimumFractionDigits: nd });
const signed = (v, nd = 0) => v == null ? "–" : (v > 0 ? "+" : v < 0 ? "−" : "") + fmt(Math.abs(v), nd);
const deltaCls = v => v == null || v === 0 ? "" : v > 0 ? "delta-up" : "delta-down";
const pct = v => v == null ? "–" : fmt(v, 0) + " %";
const d2 = iso => { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d); };
const fDate = iso => { const d = d2(iso); return `${d.getDate()} ${MOIS_COURT[d.getMonth()]}`; };
const fMois = ym => { const [y, m] = ym.split("-").map(Number); return `${MOIS_COURT[m - 1]} ${String(y).slice(2)}`; };
const rankColor = c => !c ? "var(--rank-p)" : c[0] === "N" ? "var(--rank-n)" : c[0] === "R" ? "var(--rank-r)" : c[0] === "D" ? "var(--rank-d)" : "var(--rank-p)";
const rankBadge = (t, c) => `<span class="rank">${TL[t]} <b style="background:${rankColor(c)}">${esc(c || "NC")}</b></span>`;

/* ---------- état + navigation */
const byLicence = new Map(DATA.joueurs.map(j => [j.licence, j]));
const state = { sexe: "tous", q: "", matchFiltre: { tableau: "tous", type: "tous" }, courbeMode: "diff" };

function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  const ic = h.startsWith("ic"), plan = h.startsWith("plan");
  const club = !ic && !plan && !h.startsWith("joueur");  // page club par défaut
  $("#tabJoueur").classList.toggle("on", !club && !ic && !plan);
  $("#tabClub").classList.toggle("on", club);
  $("#tabIC").classList.toggle("on", ic);
  $("#tabPlan").classList.toggle("on", plan);
  $(".wrap").classList.toggle("noside", club || ic || plan);
  if (plan) { $("#list").style.display = "none"; const [, a, b] = h.split("/"); renderPlan(a, b); return; }
  if (club) { $("#list").style.display = "none"; const [, sous, ...reste] = h.split("/"); renderClub(sous, reste); return; }
  if (ic) { $("#list").style.display = "none"; renderIC(h.split("/")[1], h.split("/")[2]); return; }
  $("#list").style.display = "";
  let lic = h.split("/")[1];

/* ---------- graphiques (SVG à la main) */
function niceTicks(min, max, n = 4) {
  if (min === max) { min -= 1; max += 1; }
  const step0 = (max - min) / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(x => x * mag).find(x => x >= step0);
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const out = []; for (let v = lo; v <= hi + step / 2; v += step) out.push(+v.toFixed(6));
  return out;
}

/* séries : [{key, label, color, points: [[iso, valeur]...]}] -> courbe en
   escalier (la cote reste à sa valeur jusqu'à la mise à jour suivante),
   avec réticule + infobulle au survol et libellé direct en bout de ligne. */
function lineChart(el, series, { height = 260, yFmt = v => fmt(v), zero = false } = {}) {
  series = series.filter(s => s.points.length);
  if (!series.length) { el.innerHTML = `<div class="empty">Pas de données de cote sur la saison.</div>`; return; }
  const W = Math.max(320, el.clientWidth), H = height, m = { l: 48, r: 92, t: 10, b: 26 };
  const xs = series.flatMap(s => s.points.map(p => d2(p[0]).getTime()));
  const ys = series.flatMap(s => s.points.map(p => p[1]));
  let x0 = Math.min(...xs), x1 = Math.max(...xs, Date.now());
  if (x1 - x0 < 864e5 * 14) x0 = x1 - 864e5 * 14;
  const ticks = niceTicks(Math.min(...ys, zero ? 0 : Infinity), Math.max(...ys, zero ? 0 : -Infinity));
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const X = t => m.l + (t - x0) / (x1 - x0) * (W - m.l - m.r);
  const Y = v => m.t + (1 - (v - y0) / (y1 - y0)) * (H - m.t - m.b);
  let svg = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img">`;
  for (const v of ticks) svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/>
      <text x="${m.l - 8}" y="${Y(v) + 4}" text-anchor="end" class="num">${yFmt(v)}</text>`;
  if (zero && y0 < 0 && y1 > 0) svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--axis)"/>`;
  const dm = new Date(x0); dm.setDate(1); dm.setMonth(dm.getMonth() + 1);
  for (; dm.getTime() <= x1; dm.setMonth(dm.getMonth() + 1))
    svg += `<text x="${X(dm.getTime())}" y="${H - 6}" text-anchor="middle">${MOIS_COURT[dm.getMonth()]}</text>
            <line x1="${X(dm.getTime())}" x2="${X(dm.getTime())}" y1="${H - m.b}" y2="${H - m.b + 4}" stroke="var(--axis)"/>`;
  svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${H - m.b}" y2="${H - m.b}" stroke="var(--axis)"/>`;
  const fins = [];
  for (const s of series) {
    let d = "";
    s.points.forEach((p, i) => {
      const x = X(d2(p[0]).getTime()), y = Y(p[1]);
      d += i ? `H${x}V${y}` : `M${x},${y}`;
    });
    const last = s.points[s.points.length - 1];
    d += `H${X(x1)}`;
    svg += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round"/>`;
    fins.push({ s, y: Y(last[1]), v: last[1] });
  }
  // libellés directs en bout de ligne, écartés s'ils se chevauchent
  fins.sort((a, b) => a.y - b.y);
  for (let i = 1; i < fins.length; i++) if (fins[i].y - fins[i - 1].y < 15) fins[i].y = fins[i - 1].y + 15;
  for (const f of fins) svg += `<circle cx="${X(x1)}" cy="${Y(f.v)}" r="4" fill="${f.s.color}" stroke="var(--surface)" stroke-width="2"/>
      <text x="${X(x1) + 10}" y="${f.y + 4}" class="lbl num">${esc(f.s.label)} ${yFmt(f.v)}</text>`;
  svg += `<line class="xh" y1="${m.t}" y2="${H - m.b}" stroke="var(--axis)" visibility="hidden"/>`;
  svg += `<g class="dots"></g><rect x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${H - m.t - m.b}" fill="transparent"/></svg>`;
  el.innerHTML = svg + `<div class="tip"></div>`;
  const root = el.querySelector("svg"), tip = el.querySelector(".tip"), xh = root.querySelector(".xh"), dots = root.querySelector(".dots");
  const valAt = (s, t) => { let v = null; for (const p of s.points) { if (d2(p[0]).getTime() <= t) v = p[1]; else break; } return v; };
  root.addEventListener("pointermove", ev => {
    const r = root.getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width;
    const t = x0 + Math.min(1, Math.max(0, (px - m.l) / (W - m.l - m.r))) * (x1 - x0);
    xh.setAttribute("x1", X(t)); xh.setAttribute("x2", X(t)); xh.setAttribute("visibility", "visible");
    const dd = new Date(t);
    let rows = "", dd2 = "";
    for (const s of series) {
      const v = valAt(s, t); if (v == null) continue;
      rows += `<div class="r"><span><i style="background:${s.color}"></i>${esc(s.label)}</span><b class="num">${yFmt(v)}</b></div>`;
      dd2 += `<circle cx="${X(t)}" cy="${Y(v)}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
    }
    dots.innerHTML = dd2;
    if (!rows) { tip.style.display = "none"; return; }
    tip.innerHTML = `<div class="h">${dd.getDate()} ${MOIS_LONG[dd.getMonth()]}</div>${rows}`;
    tip.style.display = "block";
    const left = (ev.clientX - el.getBoundingClientRect().left);
    tip.style.left = Math.min(left + 14, el.clientWidth - tip.offsetWidth - 4) + "px";
    tip.style.top = "8px";
  });
  root.addEventListener("pointerleave", () => { tip.style.display = "none"; xh.setAttribute("visibility", "hidden"); dots.innerHTML = ""; });
}

/* barres empilées : cats = ["2026-09", ...], stacks = [{key,label,color,values:[...]}] */
function stackedBars(el, cats, stacks, { height = 240, catFmt = c => c, tipExtra = () => "" } = {}) {
  const W = Math.max(320, el.clientWidth), H = height, m = { l: 40, r: 10, t: 10, b: 26 };
  const totals = cats.map((_, i) => stacks.reduce((a, s) => a + s.values[i], 0));
  const ticks = niceTicks(0, Math.max(1, ...totals));
  const y1 = ticks[ticks.length - 1];
  const bw = (W - m.l - m.r) / cats.length, barW = Math.min(46, bw * 0.6);
  const Y = v => m.t + (1 - v / y1) * (H - m.t - m.b);
  let svg = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img">`;
  for (const v of ticks) svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/>
      <text x="${m.l - 8}" y="${Y(v) + 4}" text-anchor="end" class="num">${fmt(v)}</text>`;
  cats.forEach((c, i) => {
    const cx = m.l + bw * i + bw / 2;
    let acc = 0;
    const visibles = stacks.filter(s => s.values[i] > 0);
    visibles.forEach((s, k) => {
      const v = s.values[i], yTop = Y(acc + v), yBot = Y(acc), h = Math.max(0, yBot - yTop - (k ? 2 : 0));
      const x = cx - barW / 2, top = k === visibles.length - 1;
      const rr = top ? Math.min(4, h) : 0;
      svg += `<path d="M${x},${yTop + h}V${yTop + rr}Q${x},${yTop} ${x + rr},${yTop}H${x + barW - rr}Q${x + barW},${yTop} ${x + barW},${yTop + rr}V${yTop + h}Z" fill="${s.color}"/>`;
      acc += v;
    });
    svg += `<text x="${cx}" y="${H - 6}" text-anchor="middle">${esc(catFmt(c))}</text>
      <rect class="hit" data-i="${i}" x="${cx - bw / 2}" y="${m.t}" width="${bw}" height="${H - m.t - m.b}" fill="transparent"/>`;
  });
  svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${H - m.b}" y2="${H - m.b}" stroke="var(--axis)"/></svg>`;
  el.innerHTML = svg + `<div class="tip"></div>`;
  const tip = el.querySelector(".tip");
  el.querySelectorAll(".hit").forEach(r => {
    r.addEventListener("pointerenter", () => {
      const i = +r.dataset.i;
      tip.innerHTML = `<div class="h">${esc(catFmt(cats[i]))}</div>` + stacks.map(s =>
        `<div class="r"><span><i style="background:${s.color}"></i>${esc(s.label)}</span><b class="num">${fmt(s.values[i])}</b></div>`).join("")
        + `<div class="r"><span>Total</span><b class="num">${fmt(totals[i])}</b></div>` + tipExtra(i);
      tip.style.display = "block";
      const x = +r.getAttribute("x") / W * el.clientWidth;
      tip.style.left = Math.min(x + 8, el.clientWidth - tip.offsetWidth - 4) + "px";
      tip.style.top = "8px";
    });
    r.addEventListener("pointerleave", () => { tip.style.display = "none"; });
  });
}

/* barres horizontales divergentes (Δ cote) : items [{label, value, color, href}] */
function divergingBars(el, items, { valFmt = v => signed(v) } = {}) {
  if (!items.length) { el.innerHTML = `<div class="empty">Pas de données.</div>`; return; }
  const W = Math.max(320, el.clientWidth), rowH = 24, H = items.length * rowH + 8, lw = Math.min(180, W * 0.38);
  const maxAbs = Math.max(1, ...items.map(i => Math.abs(i.value)));
  const hasNeg = items.some(i => i.value < 0);
  const z = hasNeg ? lw + (W - lw - 60) / 2 : lw + 4, span = hasNeg ? (W - lw - 60) / 2 : (W - lw - 60);
  let svg = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img">
    <line x1="${z}" x2="${z}" y1="0" y2="${H}" stroke="var(--axis)"/>`;
  items.forEach((it, i) => {
    const y = i * rowH + 6, w = Math.abs(it.value) / maxAbs * span, x = it.value >= 0 ? z : z - w;
    svg += `<a href="${it.href || "#"}"><text x="${lw - 8}" y="${y + 12}" text-anchor="end" class="lbl">${esc(it.label)}</text>
      <rect x="${x}" y="${y + 2}" width="${Math.max(1, w)}" height="${rowH - 10}" rx="3" fill="${it.color}"/>
      <text x="${it.value >= 0 ? x + w + 6 : x - 6}" y="${y + 12}" text-anchor="${it.value >= 0 ? "start" : "end"}" class="lbl num">${valFmt(it.value)}</text></a>`;
  });
  el.innerHTML = svg + "</svg>";
}

function meter(v, color) {
  if (v == null) return `<div class="meter"><span class="mid"></span></div>`;
  return `<div class="meter" title="${fmt(v)} / 100"><i style="width:${Math.max(2, v)}%;background:${color}"></i><span class="mid"></span></div>`;
}

/* "3e sur 21 en DH" : rang de forme du joueur parmi ceux qui ont joué ce tableau (même genre sauf en mixte) */
function rangForme(j, t) {
  const groupe = DATA.joueurs.filter(x => x.tableaux[t].forme != null && (t === "Mixte" || x.sexe === j.sexe));
  const rang = 1 + groupe.filter(x => x.tableaux[t].forme > j.tableaux[t].forme).length;
  const onglet = t === "Mixte" ? "MX" : TL[t] + (j.sexe === "F" ? "D" : "H");  // SH/SD/DH/DD comme les onglets Excel
  return `${rang}${rang === 1 ? "er" : "e"} sur ${groupe.length} en ${onglet}`;
}

/* moyenne club du tableau t pour le genre du joueur (catégories Stats club, matchs internes exclus) */
function categorieClub(t, sexe) {
  const nom = t === "Mixte" ? "MX" : TL[t] + (sexe === "F" ? "D" : "H");
  return DATA.club.categories.find(c => c.categorie === nom) || null;
}

/* valeur (%) sur fond vert/rouge selon l'écart à la moyenne du club : intensité
   proportionnelle à l'écart, pleine à ±25 points ; pas de couleur sous 3 matchs
   (ou sets) de base - trop peu pour comparer. */
function vsClub(v, ref, n, contenu, libelle) {
  if (v == null) return "–";
  if (ref == null || n < 3) return contenu;
  const d = v - ref, a = Math.min(1, Math.abs(d) / 25) * 0.34;
  const rgb = d >= 0 ? "12,163,12" : "208,59,59";
  return `<span class="vs" style="background:rgba(${rgb},${a.toFixed(3)})" title="${esc(libelle)} : ${pct(v)} · moyenne club ${pct(ref)} (${signed(d, 0)} pts)">${contenu}</span>`;
}

/* bilan d'une liste de matchs : nb, victoires, %, points de cote par match (matchs à cote connue) */
function bilan(ms) {
  const cotes = ms.filter(m => m.points != null);
  return { n: ms.length, v: ms.filter(m => m.victoire).length,
    pct: ms.length ? ms.filter(m => m.victoire).length / ms.length * 100 : null,
    ppm: cotes.length ? cotes.reduce((a, m) => a + m.points, 0) / cotes.length : null };
}

/* matchs d'interclub regroupés par numéro d'équipe du club -> [[equipe, [matchs]]] trié */
function parEquipe(ms) {
  const g = new Map();
  for (const m of ms) if (m.interclub && m.equipe != null) {
    if (!g.has(m.equipe)) g.set(m.equipe, []);
    g.get(m.equipe).push(m);
  }
  return [...g.entries()].sort((a, b) => a[0] - b[0]);
}

const SEUIL_COMPARAISON = 3;  // matchs minimum de chaque côté pour afficher un écart

function sectionIcTournois(j) {
  const ic = j.matchs.filter(m => m.interclub), to = j.matchs.filter(m => !m.interclub);
  if (!ic.length || !to.length) return "";
  const ecart = (a, b, nd, unite) => (a.n < SEUIL_COMPARAISON || b.n < SEUIL_COMPARAISON || a[nd] == null || b[nd] == null)
    ? `<span class="muted">–</span>` : `<b class="${deltaCls(a[nd] - b[nd])}">${signed(a[nd] - b[nd], nd === "ppm" ? 1 : 0)}${unite}</b>`;
  const lignes = [["Tous", j.matchs], ...T.map(t => [t, j.matchs.filter(m => m.tableau === t)])]
    .filter(([, ms]) => ms.some(m => m.interclub) && ms.some(m => !m.interclub));
  const rows = lignes.map(([t, ms]) => {
    const a = bilan(ms.filter(m => m.interclub)), b = bilan(ms.filter(m => !m.interclub));
    const few = a.n < SEUIL_COMPARAISON || b.n < SEUIL_COMPARAISON;
    return `<tr class="${few ? "few" : ""}"><td>${t === "Tous" ? "<b>Tous tableaux</b>" : `<span class="tagsw"><i style="background:${TC[t]}"></i>${t}</span>`}</td>
      <td class="r num">${pct(a.pct)} <span class="muted small">(${a.n})</span></td>
      <td class="r num">${pct(b.pct)} <span class="muted small">(${b.n})</span></td>
      <td class="r num">${ecart(a, b, "pct", " pts")}</td>
      <td class="r num hide-sm">${signed(a.ppm, 1)}</td><td class="r num hide-sm">${signed(b.ppm, 1)}</td>
      <td class="r num">${ecart(a, b, "ppm", "")}</td></tr>`;
  }).join("");
  const eq = parEquipe(j.matchs);
  return `<section><h2>Interclubs vs tournois</h2>
    <p class="hint">Écart = interclubs − tournois : positif (vert), le joueur fait mieux en interclubs qu'en tournoi. Affiché à partir de ${SEUIL_COMPARAISON} matchs de chaque côté.</p>
    <div class="grid ${eq.length > 1 ? "g2" : ""}" style="${eq.length > 1 ? "grid-template-columns:minmax(0,2fr) minmax(0,1fr)" : ""}">
    <div class="card scroll"><table class="t"><thead><tr><th></th><th class="r">% vict. IC</th><th class="r">% vict. tournois</th><th class="r">Écart</th>
      <th class="r hide-sm">Pts/match IC</th><th class="r hide-sm">Pts/match tournois</th><th class="r">Écart pts/match</th></tr></thead><tbody>${rows}</tbody></table></div>
    ${eq.length > 1 ? `<div class="card scroll"><table class="t"><thead><tr><th>Équipe</th><th class="r">Matchs</th><th class="r">% vict.</th><th class="r">Pts/match</th></tr></thead><tbody>
      ${eq.map(([n, ms]) => { const b = bilan(ms); return `<tr><td><span class="eq">Équipe ${n}</span></td><td class="r num">${b.n}</td><td class="r num">${pct(b.pct)}</td><td class="r num ${deltaCls(b.ppm)}">${signed(b.ppm, 1)}</td></tr>`; }).join("")}
      </tbody></table></div>` : ""}
    </div></section>`;
}

/* fiche joueur : 1 contre 1 face aux autres joueurs du club (tous tableaux, partenaires extérieurs compris) */
function sectionConfrontations(j) {
  const liste = (DATA.club.rivalites?.Tous || []).filter(r => r.a === j.nom || r.b === j.nom).map(r => {
    const moiA = r.a === j.nom;
    return { adv: moiA ? r.b : r.a, v: moiA ? r.va : r.vb, d: moiA ? r.vb : r.va, total: r.total, matchs: r.matchs };
  }).sort((x, y) => y.total - x.total || x.adv.localeCompare(y.adv));
  if (!liste.length) return "";
  return `<section><h2>Confrontations avec des joueurs du club</h2>
    <p class="hint">Matchs où ${esc(j.nom)} était opposé(e) à un autre joueur du club, tous tableaux confondus (même avec un partenaire extérieur). Cliquer pour le détail.</p>
    <div class="card">${liste.map(x => `<details class="riv"><summary>
      <span class="riv-a ${x.v > x.d ? "gagne" : ""}">${esc(j.nom)}</span><b class="num">${x.v} – ${x.d}</b>
      <span class="riv-b ${x.d > x.v ? "gagne" : ""}">${lienNom(x.adv)}</span>

}

function drawMatchs(j) {

/* ---------- tableaux triables (réutilisés partout côté club) */
state.tri = {};
/* cols : [{k, label, val: r => valeur de tri, html?: r => cellule, num?, nd?, sm? (masquée sur mobile), title?}] */
function sortableTable(el, key, cols, rows, opts = {}) {
  // pied : ligne de totaux (tfoot), chaque colonne la remplit avec c.pied() ; jamais triée
  const { defaut = { cle: cols[0].k, sens: 1 }, rowClass = () => "", lien = null, rang = false, pied = false } = opts;
  if (!rows.length) { el.innerHTML = `<div class="empty">Aucune donnée.</div>`; return; }
  const tri = state.tri[key] || (state.tri[key] = { ...defaut });
  const col = cols.find(c => c.k === tri.cle) || cols[0];
  const sorted = [...rows].sort((a, b) => {
    const va = col.val(a), vb = col.val(b);
    if (va == null && vb == null) return 0; if (va == null) return 1; if (vb == null) return -1;
    return (typeof va === "string" ? va.localeCompare(vb, "fr") : va - vb) * tri.sens;
  });
  const cell = (c, r) => c.html ? c.html(r) : c.num ? fmt(c.val(r), c.nd || 0) : esc(c.val(r) ?? "–");
  el.innerHTML = `<table class="t"><thead><tr>${rang ? '<th class="r">#</th>' : ""}${cols.map(c =>
    `<th class="sortable ${c.num ? "r" : ""} ${c.sm ? "hide-sm" : ""}" data-k="${c.k}" ${c.title ? `title="${esc(c.title)}"` : ""}>${c.label}${c.k === tri.cle ? (tri.sens < 0 ? " ↓" : " ↑") : ""}</th>`).join("")}</tr></thead><tbody>
    ${sorted.map((r, i) => `<tr class="${rowClass(r)} ${lien ? "click" : ""}" ${lien ? `data-href="${lien(r)}"` : ""}>${rang ? `<td class="r num muted">${i + 1}</td>` : ""}${cols.map(c =>
      `<td class="${c.num ? "r num" : ""} ${c.sm ? "hide-sm" : ""}">${cell(c, r)}</td>`).join("")}</tr>`).join("")}</tbody>
    ${pied ? `<tfoot><tr>${rang ? "<td></td>" : ""}${cols.map(c => `<td class="${c.num ? "r num" : ""} ${c.sm ? "hide-sm" : ""}">${c.pied ? c.pied() : ""}</td>`).join("")}</tr></tfoot>` : ""}</table>`;
  el.onclick = e => {
    const th = e.target.closest("th[data-k]");
    if (th) {
      const c = cols.find(x => x.k === th.dataset.k);
      state.tri[key] = { cle: c.k, sens: tri.cle === c.k ? -tri.sens : (c.num ? -1 : 1) };
      sortableTable(el, key, cols, rows, opts);
      return;
    }
    const tr = e.target.closest("tr[data-href]");
    if (tr && !e.target.closest("a")) location.hash = tr.dataset.href;
  };
}

const byNom = new Map(DATA.joueurs.map(j => [j.nom, j]));
const lienNom = nom => byNom.has(nom) ? `<a href="#joueur/${byNom.get(nom).licence}">${esc(nom)}</a>` : esc(nom);

/* barres horizontales appariées : items [{label, a, b}], series [{label, color}, {label, color}] (valeurs en %) */
function pairedBars(el, items, series, { max = 100, valFmt = v => pct(v) } = {}) {
  const W = Math.max(320, el.clientWidth), rowH = 34, H = items.length * rowH + 4, lw = Math.min(150, W * 0.32);
  const span = W - lw - 60;
  let svg = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img">`;
  for (const v of [0, 25, 50, 75, 100]) {
    const x = lw + v / max * span;
    svg += `<line x1="${x}" x2="${x}" y1="0" y2="${H}" stroke="${v === 50 ? "var(--axis)" : "var(--grid)"}"/>`;
  }
  items.forEach((it, i) => {
    const y = i * rowH + 4;
    svg += `<text x="${lw - 8}" y="${y + 16}" text-anchor="end" class="lbl">${esc(it.label)}</text>`;
    [it.a, it.b].forEach((v, k) => {
      if (v == null) return;
      const w = Math.max(1, v / max * span), yy = y + 3 + k * 13;
      svg += `<rect x="${lw}" y="${yy}" width="${w}" height="11" rx="3" fill="${series[k].color}"><title>${esc(it.label)} · ${esc(series[k].label)} : ${valFmt(v)}</title></rect>
        <text x="${lw + w + 6}" y="${yy + 9}" class="num" style="font-size:10.5px">${valFmt(v)}</text>`;
    });
  });
  el.innerHTML = svg + "</svg>";
}

function renderClub(sous, reste = []) {

  if (sous === "detail") return clubDetail($("#club"), reste[0], reste[1], reste[2]);
  if (sous === "tournoi") return clubTournoi($("#club"), reste[0]);
  ({ apercu: clubApercu, classement: clubClassement, competitions: clubCompetitions,
     categories: clubCategories, profil: clubProfil, records: clubRecords, suivi: clubSuivi, paires: clubPaires })[sous]($("#club"));
}

/* matchs du club comptés UNE fois chacun (un double à deux joueurs du club
   apparaît dans les deux fiches), matchs internes exclus - même règle que
   export_web.matchs_club_uniques ; représentant = premier joueur par nom */
let _matchsUniques = null;
function matchsClubUniques() {
  if (_matchsUniques) return _matchsUniques;
  const vus = new Map();
  for (const j of DATA.joueurs) for (const m of j.matchs) {
    if (m.intra_club) continue;
    const cle = [m.date, m.evenement, m.tableau, [...m.adversaires].sort().join("|"), m.score].join("#");
    if (!vus.has(cle)) vus.set(cle, { ...m, sexes: new Set(), joueursClub: [] });
    const x = vus.get(cle); x.sexes.add(j.sexe); x.joueursClub.push(j);
  }
  return (_matchsUniques = [...vus.values()]);
}
/* catégories club d'un match (même règle que export_web._categories_match) */
function categoriesMatch(tableau, sexes) {
  const c = ["Club (tous tableaux)"];
  for (const g of ["H", "F"]) if (sexes.has(g)) c.push(`${g} (tous tableaux)`);
  if (tableau === "Mixte") c.push("MX");
  else { for (const g of ["H", "F"]) if (sexes.has(g)) c.push(tableau[0] + (g === "F" ? "D" : "H")); c.push(`${tableau[0]} (unisexe)`); }
  return c;
}
const setsDe = score => String(score || "").split(" / ").filter(Boolean).map(x => x.split("-").map(Number));
const joueursMatch = m => m.joueursClub.map(j => `<a href="#joueur/${j.licence}">${esc(j.nom)}</a>`).join(" / ")
  + (m.partenaire && !m.joueursClub.some(j => j.nom === m.partenaire) ? ` <span class="muted">/ ${esc(m.partenaire)}</span>` : "");

/* -- Aperçu */
function clubApercu(el) {
  const tous = matchsClubUniques();
  const mois = [...new Set(tous.map(m => m.date.slice(0, 7)))].sort();
  const parMois = T.map(t => ({ key: t, label: t, color: TC[t],
    values: mois.map(mo => tous.filter(m => m.tableau === t && m.date.startsWith(mo)).length) }));
  const club = DATA.club.categories.find(c => c.categorie === "Club (tous tableaux)");
  const vic = mois.map(mo => club.par_mois[mo]?.pct ?? null);
  const taux = a => a.length ? a.filter(m => m.victoire).length / a.length * 100 : null;
  const actifs = DATA.joueurs.filter(j => j.global.matchs > 0).length;
  const prog = DATA.joueurs.filter(j => j.global.matchs > 0 && j.global.diff_cote != null)
    .sort((a, b) => b.global.diff_cote - a.global.diff_cote);
  const sel = prog.length > 20 ? [...prog.slice(0, 10), ...prog.slice(-10)] : prog;
  const rencIC = IC ? IC.equipes.reduce((a, e) => a + e.rencontres.filter(r => r.jouee).length, 0) : null;
  // écarts avec l'export précédent (résumé publié la semaine d'avant)
  const P = DATA.precedent;
  const ecart = (v, ancien, nd = 0, unite = "") => P && ancien != null && v != null
    ? `<div class="evol ${deltaCls(v - ancien)}">${signed(v - ancien, nd)}${unite} <span class="muted">depuis le ${esc(String(P.genere_le).split(" ")[0])}</span></div>` : "";

  el.innerHTML = `
    <div class="grid g4">
      <div class="card stat"><div class="v num">${actifs}</div><div class="l">joueurs ayant joué (sur ${DATA.joueurs.length})</div>${ecart(actifs, P?.joueurs_actifs)}</div>
      <div class="card stat"><div class="v num">${fmt(tous.length)}</div><div class="l">matchs (chacun compté une fois, hors matchs internes)</div>${ecart(tous.length, P?.matchs)}</div>
      <div class="card stat"><div class="v num">${pct(taux(tous))}</div><div class="l">de victoires</div>${ecart(taux(tous), P?.pct, 1, " pts")}</div>
      <div class="card stat"><div class="v num">${DATA.club.tournois.length}</div><div class="l">tournois individuels${rencIC != null ? ` · ${rencIC} rencontres d'interclubs` : ""}</div>${ecart(DATA.club.tournois.length, P?.tournois)}</div>
    </div>
    ${P ? "" : `<p class="hint" style="margin-top:8px">Les écarts avec l'export précédent apparaîtront à partir de la prochaine mise à jour.</p>`}
    <section><h2>Matchs par mois</h2>
      <p class="hint">Survoler une barre pour le détail et le % de victoire du mois.</p>
      <div class="card"><div class="legend">${T.map(t => `<span><i class="box" style="background:${TC[t]}"></i>${t}</span>`).join("")}</div>
      <div class="chart" id="cMois"></div></div></section>
    <section><h2>Progression de cote depuis septembre</h2>
      <p class="hint">Somme des 3 tableaux. ${sel.length < prog.length ? "Les 10 plus fortes hausses et les 10 plus fortes baisses." : ""}</p>
      <div class="card"><div class="chart" id="cProg"></div></div></section>`;
  stackedBars($("#cMois"), mois, parMois, { catFmt: fMois,
    tipExtra: i => `<div class="r"><span>% victoire</span><b class="num">${pct(vic[i])}</b></div>` });
  divergingBars($("#cProg"), sel.map(j => ({ label: j.nom, value: j.global.diff_cote,
    color: j.global.diff_cote >= 0 ? "var(--good)" : "var(--bad)", href: "#joueur/" + j.licence })));
}

/* courbe simple sur des catégories (mois) : une série, points survolables -
   alignée sous un histogramme de mêmes catégories (pas de double échelle) */
function lineCats(el, cats, values, { height = 150, yFmt = v => pct(v), y0 = null, y1 = null, color = "var(--club)", catFmt = c => c } = {}) {
  const W = Math.max(320, el.clientWidth), H = height, m = { l: 40, r: 10, t: 14, b: 26 };
  // échelle resserrée sur les valeurs (multiples de 5, dans 0-100) : sur 0-100
  // les variations d'un mois à l'autre étaient invisibles
  const vs = values.filter(v => v != null);
  if (y0 == null) y0 = vs.length ? Math.max(0, Math.floor((Math.min(...vs) - 3) / 5) * 5) : 0;
  if (y1 == null) y1 = vs.length ? Math.min(100, Math.ceil((Math.max(...vs) + 3) / 5) * 5) : 100;
  if (y1 - y0 < 10) { y0 = Math.max(0, y0 - 5); y1 = Math.min(100, y0 + 10); }
  const pas = [5, 10, 20, 25].find(p => (y1 - y0) / p <= 4) || 25;
  const graduations = [];
  for (let v = Math.ceil(y0 / pas) * pas; v <= y1; v += pas) graduations.push(v);
  const bw = (W - m.l - m.r) / cats.length;
  const X = i => m.l + bw * i + bw / 2, Y = v => m.t + (1 - (v - y0) / (y1 - y0)) * (H - m.t - m.b);
  let svg = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img">`;
  for (const v of graduations) svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="${v === 50 ? "var(--axis)" : "var(--grid)"}"/>
    <text x="${m.l - 8}" y="${Y(v) + 4}" text-anchor="end" class="num">${v} %</text>`;
  const pts = values.map((v, i) => v == null ? null : [X(i), Y(v), v]).filter(Boolean);
  if (pts.length > 1) svg += `<path d="${pts.map((p, i) => `${i ? "L" : "M"}${p[0]},${p[1]}`).join("")}" fill="none" stroke="${color}" stroke-width="2"/>`;
  pts.forEach((p, i) => { svg += `<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="${color}" stroke="var(--surface)" stroke-width="2"><title>${yFmt(p[2])}</title></circle>`; });
  const last = pts[pts.length - 1];
  if (last) svg += `<text x="${last[0]}" y="${last[1] - 9}" text-anchor="middle" class="lbl num">${yFmt(last[2])}</text>`;
  cats.forEach((c, i) => { svg += `<text x="${X(i)}" y="${H - 6}" text-anchor="middle">${esc(catFmt(c))}</text>`; });
  el.innerHTML = svg + "</svg>";
}

/* -- listes détaillées derrière les chiffres de Stats club */
const DETAILS = {
  clutch: { titre: "Sets serrés", hint: "Sets terminés à 2 points d'écart ou moins (tous les matchs, un set par ligne)." },
  outsider: { titre: "Matchs en outsider", hint: "L'adversaire avait une meilleure cote que le joueur du club. Forfaits exclus." },
  favori: { titre: "Matchs en favori", hint: "Le joueur du club avait la meilleure cote. Forfaits exclus." },
  propre: { titre: "Victoires : propres ou accrochées", hint: "Victoires (au moins 2 sets, forfaits exclus) : propre = sans perdre de set." },
  apres1: { titre: "Matchs après avoir gagné le 1er set", hint: "Au moins 2 sets, forfaits exclus : le joueur a-t-il conclu ?" },
  comeback: { titre: "Matchs après avoir perdu le 1er set", hint: "Au moins 2 sets, forfaits exclus : le joueur est-il revenu ?" },
  or: { titre: "Sets au point en or", hint: "Sets terminés à 21-20, décidés sur une seule balle." },
};
const lienDetail = (type, cat, contenu) => `<a href="#club/detail/${type}/${encodeURIComponent(cat)}" title="Voir la liste">${contenu}</a>`;

function clubDetail(el, type, catEnc, extra) {
  if (type === "or-joueur") return detailOrJoueur(el, catEnc, extra);
  const cat = decodeURIComponent(catEnc || ""), def = DETAILS[type];
  if (!def) { el.innerHTML = `<div class="card empty">Liste inconnue.</div>`; return; }
  const ms = matchsClubUniques().filter(m => categoriesMatch(m.tableau, m.sexes).includes(cat)).sort((a, b) => b.date.localeCompare(a.date));
  const utiles = ms.filter(m => setsDe(m.score).length >= 2 && !m.forfait);
  let lignes = [], resume = "";
  const ligneMatch = (m, extra = "", marque = null) => `<tr><td class="num" style="white-space:nowrap">${fDate(m.date)}</td>
    <td><span class="tagsw"><i style="background:${TC[m.tableau]}"></i>${TL[m.tableau]}</span></td>
    <td>${joueursMatch(m)}</td><td>${m.adversaires.map(esc).join(" / ")}</td>
    <td class="num" style="white-space:nowrap">${setsDe(m.score).map((st, i) => i === marque ? `<b class="set-marque">${st.join("-")}</b>` : st.join("-")).join(" / ")}</td>
    ${extra}<td><span class="res ${m.victoire ? "v" : "d"}">${m.victoire ? "V" : "D"}</span></td></tr>`;
  let entete = `<th>Date</th><th></th><th>GAB</th><th>Adversaire(s)</th><th>Score</th>`;
  if (type === "clutch" || type === "or") {
    const ecartMax = type === "or" ? 1 : 2;
    for (const m of ms) setsDe(m.score).forEach((st, i) => { const e = Math.abs(st[0] - st[1]); if (e <= ecartMax && (type === "clutch" || e === 1)) lignes.push({ m, i, gagne: st[0] > st[1] }); });
    const g = lignes.filter(x => x.gagne).length;
    resume = `${lignes.length} sets ${type === "or" ? "au point en or" : "serrés"} · ${g} gagnés (${pct(lignes.length ? g / lignes.length * 100 : null)})`;
    entete += `<th>Set</th><th>Match</th>`;
    lignes = lignes.map(({ m, i, gagne }) => ligneMatch(m, `<td><span class="res ${gagne ? "v" : "d"}" title="Set ${gagne ? "gagné" : "perdu"}">${gagne ? "V" : "D"}</span></td>`, i));
  } else if (type === "outsider" || type === "favori") {
    const sel = ms.filter(m => m.ma_cote != null && m.cote_adverse != null && !m.forfait && (type === "outsider" ? m.cote_adverse > m.ma_cote : m.ma_cote > m.cote_adverse));
    const g = sel.filter(m => m.victoire).length;
    resume = `${sel.length} matchs · ${g} gagnés (${pct(sel.length ? g / sel.length * 100 : null)})`;
    entete += `<th class="r">Cote GAB</th><th class="r">Cote adv.</th>`;
    lignes = sel.map(m => ligneMatch(m, `<td class="r num">${fmt(m.ma_cote)}</td><td class="r num">${fmt(m.cote_adverse)}</td>`));
  } else {
    const premierGagne = m => { const s0 = setsDe(m.score)[0]; return s0[0] > s0[1]; };
    const sel = type === "propre" ? utiles.filter(m => m.victoire) : utiles.filter(m => type === "apres1" ? premierGagne(m) : !premierGagne(m));
    const ok = type === "propre" ? sel.filter(m => setsDe(m.score).every(st => st[0] > st[1])).length : sel.filter(m => m.victoire).length;
    resume = `${sel.length} matchs · ${type === "propre" ? `${ok} sans perdre de set` : `${ok} gagnés`} (${pct(sel.length ? ok / sel.length * 100 : null)})`;
    if (type === "propre") { entete += `<th>Type</th>`; lignes = sel.map(m => ligneMatch(m, `<td>${setsDe(m.score).every(st => st[0] > st[1]) ? "propre" : '<span class="muted">en 3 sets</span>'}</td>`)); }
    else lignes = sel.map(m => ligneMatch(m, "", 0));
  }
  el.innerHTML = `<div class="chips subnav">${type === "or" ? `<a class="chip" href="#club/profil">← Profil de jeu</a>` : `<a class="chip" href="#club/categories">← Stats club</a>`}</div>
    <div class="card" style="margin-bottom:14px"><h2 style="margin:0;font-size:17px">${def.titre} · ${esc(catLabel(cat))}</h2>
      <p class="hint" style="margin:4px 0 0">${def.hint} ${resume}. Chaque match n'est compté qu'une fois, matchs internes exclus.</p></div>
    <div class="card scroll">${lignes.length ? `<table class="t"><thead><tr>${entete}<th></th></tr></thead><tbody>${lignes.join("")}</tbody></table>` : `<div class="empty">Aucun match.</div>`}</div>`;
}

/* sets au point en or d'un joueur (tous ses matchs, comme la colonne "Point en or" du profil de jeu) */
function detailOrJoueur(el, licence, tableauEnc) {

    <div class="card scroll">${lignes.length ? `<table class="t"><thead><tr><th>Date</th><th></th><th>Compétition</th><th>Adversaire(s)</th><th>Score</th><th>Set</th><th>Match</th></tr></thead><tbody>
      ${lignes.map(({ m, i, gagne }) => `<tr><td class="num" style="white-space:nowrap">${fDate(m.date)}</td>

}

/* -- page d'un tournoi : matchs des joueurs du club, une carte par joueur */
const lienTournoi = (t, contenu) => `<a href="#club/tournoi/${DATA.club.tournois.indexOf(t)}" title="Matchs du tournoi">${contenu}</a>`;
function clubTournoi(el, idx) {
  const t = DATA.club.tournois[+idx];
  if (!t) { el.innerHTML = `<div class="card empty">Tournoi introuvable.</div>`; return; }
  const dates = new Set(t.dates || [t.date]);
  const parJoueur = DATA.joueurs.map(j => ({ j, ms: j.matchs.filter(m => !m.interclub && m.evenement === t.nom && dates.has(m.date))
    .sort((a, b) => a.date.localeCompare(b.date)) })).filter(x => x.ms.length)
    .sort((a, b) => b.ms.filter(m => m.victoire).length - a.ms.filter(m => m.victoire).length || a.j.nom.localeCompare(b.j.nom));
  const cartes = parJoueur.map(({ j, ms }) => {
    const v = ms.filter(m => m.victoire).length, pts = ms.reduce((a, m) => a + (m.points || 0), 0);

        <span class="num sc">${esc(m.score)}</span><span class="num ${deltaCls(m.points)}">${m.points == null ? "" : signed(m.points)}</span></div>`).join("")}</div>`;

      <div class="grid g2">${carteT("Le plus victorieux", best)}${carteT("Le moins victorieux", worst)}</div></section>
    <section><h2>Plus gros pics et chutes de cote sur un mois</h2>
      <p class="hint">Pour chaque tableau et chaque genre : ▲ le joueur qui a gagné le plus de points de cote sur un seul mois, ▼ celui qui en a perdu le plus.</p>
      <div class="grid g3">${cartesPics}</div></section>
    <section><h2>Rivalités internes</h2>
      <p class="hint">« Tous » : 1 contre 1 entre deux joueurs du club, tous tableaux confondus, même avec un partenaire extérieur. Simple : joueur contre joueur. Double et mixte : paire contre paire, uniquement des paires 100 % club. Cliquer une rivalité pour ses matchs.</p>
      <div class="chips" id="rivT" style="margin-bottom:10px"></div><div id="rivListe"></div></section>`;
  const riv = DATA.club.rivalites || {};
  const draw = () => {
    const t = state.rivTableau || "Tous";
    $("#rivT").innerHTML = ["Tous", ...T].map(x => `<button class="chip" data-t="${x}" aria-pressed="${x === t}">${x !== "Tous" ? `<span class="sw" style="background:${TC[x]}"></span>` : ""}${x}${riv[x] ? ` <span class="muted">${riv[x].length}</span>` : ""}</button>`).join("");
    const liste = Array.isArray(riv) ? (t === "Simple" ? riv.map(r => ({ a: r.joueur_a, b: r.joueur_b, total: r.total, va: r.victoires_a, vb: r.victoires_b, matchs: [] })) : []) : (riv[t] || []);
    const noms = x => x.split(" / ").map(lienNom).join(" / ");
    $("#rivListe").innerHTML = liste.length ? `<div class="card">${liste.map(r => `<details class="riv"><summary>
        <span class="riv-a ${r.va > r.vb ? "gagne" : ""}">${noms(r.a)}</span><b class="num">${r.va} – ${r.vb}</b><span class="riv-b ${r.vb > r.va ? "gagne" : ""}">${noms(r.b)}</span>
        <span class="muted small">${r.total} confrontation${r.total > 1 ? "s" : ""}</span></summary>
        ${(r.matchs || []).map(ligneMatchRivalite).join("")}</details>`).join("")}</div>`
      : `<div class="card empty">Aucune confrontation interne ${t === "Tous" ? "" : "en " + t.toLowerCase()} cette saison.</div>`;
  };
  $("#rivT").onclick = e => { const b = e.target.closest("[data-t]"); if (!b) return; state.rivTableau = b.dataset.t; draw(); };
  draw();
}

/* -- Classement de forme (Overall + un onglet par tableau) */
function clubClassement(el) {
  const choix = ["Overall", ...Object.keys(ONGLETS)];
  el.innerHTML = `
    <p class="hint">Cliquer une ligne pour ouvrir la page du joueur, un en-tête pour trier. Lignes grisées : moins de ${PEU_DE_MATCHS} matchs.</p>
    <div class="chips" id="onglets" style="margin-bottom:8px">${choix.map(k => `<button class="chip" data-o="${k}" aria-pressed="${state.clubOnglet === k}">${k === "Overall" ? "" : `<span class="sw" style="background:${TC[ONGLETS[k][0]]}"></span>`}${k}</button>`).join("")}</div>
    <div class="chips" id="sexeOverall" style="margin-bottom:10px"></div>
    <div class="card scroll" id="classement"></div>
    <section><h2>Progression de cote depuis septembre</h2><p class="hint" id="progHint"></p>
      <div class="card"><div class="chart" id="cProg"></div></div></section>
    <section><details class="howto card"><summary>Comment sont calculés les indices ?</summary>
      <p><b>Indice performance</b> : taux de victoire lissé (comme si 5 matchs à 50 % s'ajoutaient) — un 2/2 ne passe pas devant un 12/15.</p>
      <p><b>Indice qualité</b> : points de cote gagnés ou perdus par match (lissés). Le barème FFBad tient déjà compte de la force de l'adversaire.</p>
      <p><b>Indice forme</b> : moyenne des deux. Tous les indices sont des rangs : 50 = médiane du groupe, 100 = le meilleur.</p>
      <p><b>Indice niveau</b> : le classement, en rang. Affiché à part : c'est un état, pas un résultat de la saison.</p>
      <p><b>Overall</b> : tous tableaux confondus ; chaque joueur est comparé aux joueurs de son genre.</p>
    </details></section>`;
  $("#onglets").onclick = e => {
    const b = e.target.closest("[data-o]"); if (!b) return;
    state.clubOnglet = b.dataset.o;
    $("#onglets").querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.o === state.clubOnglet));
    drawClassement();
  };
  drawClassement();
}

function drawClassement() {
  const overall = state.clubOnglet === "Overall";
  $("#sexeOverall").innerHTML = overall ? (AVEC_CATEGORIES ? FILTRES_PUBLIC : FILTRES_PUBLIC.slice(0, 3)).map(([k, l]) =>
    `<button class="chip" data-s="${k}" aria-pressed="${state.overallSexe === k}">${l}</button>`).join("") : "";
  $("#sexeOverall").onclick = e => { const b = e.target.closest("[data-s]"); if (!b) return; state.overallSexe = b.dataset.s; drawClassement(); };
  const forme = [["forme", "Forme", "Indice forme : rang /100 (50 = médiane)"], ["perf", "Perf.", "Taux de victoire lissé, en rang"],
    ["qualite", "Qualité", "Points de cote par match, en rang"], ["niveau", "Niveau", "Classement, en rang"]];
  let rows, cols;
  if (overall) {
    rows = DATA.joueurs.filter(j => j.global.matchs > 0 && filtrePublic(state.overallSexe, j.licence, j.nom, j.sexe))
      .map(j => ({ j, x: j.global }));
    cols = [
      { k: "nom", label: "Joueur", val: r => r.j.nom, html: r => esc(r.j.nom) + badgeJeune(r.j.licence, r.j.nom) },
      { k: "sexe", label: "", val: r => r.j.sexe, sm: true },
      { k: "best", label: "Meilleur clt", val: r => r.x.meilleur_tableau, html: r => `<b class="rk" style="background:${rankColor(r.x.meilleur_tableau)}">${esc(r.x.meilleur_tableau || "NC")}</b>` },
      { k: "fort", label: "Tableau fort", val: r => r.j.ordre[0], sm: true,
        html: r => r.j.ordre[0] ? `<span class="tagsw"><i style="background:${TC[r.j.ordre[0]]}"></i>${r.j.ordre[0]}</span>` : "–" },
      { k: "matchs", label: "Matchs", val: r => r.x.matchs, num: true },
      { k: "pct", label: "% vict.", val: r => r.x.pct, html: r => pct(r.x.pct), num: true },
      { k: "diff", label: "Δ cote", val: r => r.x.diff_cote, html: r => `<span class="${deltaCls(r.x.diff_cote)}">${signed(r.x.diff_cote)}</span>`, num: true, sm: true },
    ];
  } else {
    const [t, sexe] = ONGLETS[state.clubOnglet];
    rows = DATA.joueurs.filter(j => (!sexe || j.sexe === sexe) && j.tableaux[t].matchs > 0).map(j => ({ j, x: j.tableaux[t] }));
    cols = [
      { k: "nom", label: "Joueur", val: r => r.j.nom, html: r => esc(r.j.nom) + badgeJeune(r.j.licence, r.j.nom) },
      { k: "clt", label: "Clt", val: r => r.x.cote, html: r => `<b class="rk" style="background:${rankColor(r.x.classement)}">${esc(r.x.classement || "NC")}</b>` },
      { k: "cote", label: "Cote", val: r => r.x.cote, num: true },
      { k: "diff", label: "Δ cote", val: r => r.x.diff_cote, html: r => `<span class="${deltaCls(r.x.diff_cote)}">${signed(r.x.diff_cote)}</span>`, num: true },
      { k: "matchs", label: "Matchs", val: r => r.x.matchs, num: true },
      { k: "pct", label: "% vict.", val: r => r.x.pct, html: r => pct(r.x.pct), num: true },
    ];
  }
  cols.push(...forme.map(([k, l, title], i) => ({ k, label: l, title, val: r => r.x[k], num: true, sm: i > 0,
    html: r => r.x[k] == null ? "–" : `<span class="vs" style="background:rgba(42,120,214,${(r.x[k] / 100 * 0.42).toFixed(3)})">${i === 0 ? `<b>${fmt(r.x[k])}</b>` : fmt(r.x[k])}</span>` })));
  // évolution du rang de forme depuis l'export précédent
  const idxF = overall ? 0 : IDX_FORME[ONGLETS[state.clubOnglet][0]];
  const prec = rangsPrecedents(rows.map(r => r.j.licence), idxF);
  const rangActuel = new Map([...rows].filter(r => r.x.forme != null).sort((a, b) => b.x.forme - a.x.forme).map((r, i) => [r.j.licence, i + 1]));
  if (prec) cols.splice(1, 0, { k: "evol", label: "Évol.", title: `Évolution du rang de forme depuis l'export du ${fDate(prec.cle.slice(0, 10))}`,
    val: r => prec.rangs.has(r.j.licence) && rangActuel.has(r.j.licence) ? prec.rangs.get(r.j.licence) - rangActuel.get(r.j.licence) : null,
    html: r => { const a = prec.rangs.get(r.j.licence), b = rangActuel.get(r.j.licence);
      if (b == null) return ""; if (a == null) return `<span class="muted small">nouveau</span>`;
      const d = a - b; return d > 0 ? `<span class="delta-up">▲ ${d}</span>` : d < 0 ? `<span class="delta-down">▼ ${-d}</span>` : `<span class="muted">=</span>`; }, num: true, sm: true });
  sortableTable($("#classement"), "classement", cols, rows, { defaut: { cle: "forme", sens: -1 }, rang: true,
    rowClass: r => r.x.matchs < PEU_DE_MATCHS ? "few" : "", lien: r => "#joueur/" + r.j.licence });
  const prog = rows.filter(r => r.x.diff_cote != null).sort((a, b) => b.x.diff_cote - a.x.diff_cote);
  const sel = prog.length > 20 ? [...prog.slice(0, 10), ...prog.slice(-10)] : prog;
  $("#progHint").textContent = `${overall ? "Somme des 3 tableaux" : state.clubOnglet}. ${sel.length < prog.length ? "Les 10 plus fortes hausses et les 10 plus fortes baisses." : ""}`;
  divergingBars($("#cProg"), sel.map(r => ({ label: r.j.nom, value: r.x.diff_cote,
    color: r.x.diff_cote >= 0 ? "var(--good)" : "var(--bad)", href: "#joueur/" + r.j.licence })));
}

/* -- Compétitions (ex-onglet Tournois) */
function clubCompetitions(el) {
  const mois = [...new Set(DATA.joueurs.flatMap(j => Object.keys(j.competitions_par_mois)))].sort();
  const somme = (mo, cle) => DATA.joueurs.reduce((a, j) => a + (j.competitions_par_mois[mo]?.[cle] || 0), 0);
  const stacks = ["weekend", "soiree", "interclub"].map(k => ({ key: k, label: CL[k], color: CC[k], values: mois.map(mo => somme(mo, k)) }));
  const nbT = j => j.tournois.length;
  const maxT = Math.max(0, ...DATA.joueurs.map(nbT));
  const distrib = Array.from({ length: maxT + 1 }, (_, n) => DATA.joueurs.filter(j => nbT(j) === n).length);
  const participations = DATA.joueurs.reduce((a, j) => a + nbT(j), 0);

      <div class="card"><div class="chart" id="cDistrib"></div></div></section>

      <div class="card scroll" id="tParJoueur"></div></section>
    <section><h2>Tournois du club</h2>
      <p class="hint">Bilan des joueurs du club par tournoi (matchs internes exclus, un tournoi sur 2 jours consécutifs compte pour un).</p>
      <div class="chips" id="filtreTournois" style="margin-bottom:10px"></div>
      <div class="card scroll" id="tTournois"></div></section>`;

  stackedBars($("#cDistrib"), distrib.map((_, n) => String(n)), [{ key: "n", label: "Joueurs", color: "var(--club)", values: distrib }],
    { height: 200, catFmt: n => `${n} tournoi${n > 1 ? "s" : ""}` });
  const tot = (j, k) => Object.values(j.competitions_par_mois).reduce((a, b) => a + (b[k] || 0), 0);
  sortableTable($("#tParJoueur"), "compJoueurs", [
    { k: "nom", label: "Joueur", val: r => r.nom },
    { k: "we", label: "Week-end", val: r => tot(r, "weekend"), num: true },
    { k: "so", label: "Soirée", val: r => tot(r, "soiree"), num: true },
    { k: "ic", label: "Interclubs", val: r => r.nb_interclubs, num: true },
    { k: "total", label: "Total", val: r => r.tournois.length + r.nb_interclubs, html: r => `<b>${r.tournois.length + r.nb_interclubs}</b>`, num: true },
    { k: "dernier", label: "Dernier tournoi", val: r => r.tournois.length ? r.tournois[r.tournois.length - 1].date : null, sm: true,
      html: r => r.tournois.length ? `${fDate(r.tournois[r.tournois.length - 1].date)} · ${esc(r.tournois[r.tournois.length - 1].nom)}` : "–" },
  ], DATA.joueurs.filter(j => j.tournois.length + j.nb_interclubs > 0),
  { defaut: { cle: "total", sens: -1 }, lien: r => "#joueur/" + r.licence });
  const drawTournois = () => {
    const tous = !!state.tousTournois;
    const n3 = DATA.club.tournois.filter(t => t.joueurs >= 3).length;
    $("#filtreTournois").innerHTML = `<button class="chip" data-tous="0" aria-pressed="${!tous}">Au moins 3 joueurs du club (${n3})</button>
      <button class="chip" data-tous="1" aria-pressed="${tous}">Tous (${DATA.club.tournois.length})</button>`;

/* ---------- page Interclubs (données icbad.ffbad.org) */
const IC = DATA.interclubs;
const TYPE_LABEL = { SH: "Simple hommes", SD: "Simple dames", DH: "Double hommes", DD: "Double dames", MX: "Mixte" };
const TYPE_ORDRE = ["SH", "SD", "DH", "DD", "MX"];
/* code icbad (SH1, DX2...) -> type (SH/SD/DH/DD/MX) et numéro */
const slotType = code => { const t = code.slice(0, 2); return t === "DX" || t === "DM" ? "MX" : t; };
const slotNum = code => +(code.slice(2) || 1);
const slotCle = code => slotType(code) + slotNum(code);
const famille = type => type[0] === "S" ? "Simple" : type === "MX" ? "Mixte" : "Double";
const nomCourt = nom => { const p = String(nom || "").split(" "); return p.length > 1 ? `${p[0][0]}. ${p.slice(1).join(" ")}` : nom; };
const icRencontresJouees = e => e.rencontres.filter(r => r.jouee);
const icMatchs = e => icRencontresJouees(e).flatMap(r => r.matchs.filter(m => m.victoire != null).map(m => ({ ...m, r, equipe: e })));
const resRencontre = r => r.score_club > r.score_adv ? "V" : r.score_club < r.score_adv ? "D" : "N";
const ordinal = n => n == null ? "–" : `${n}${n === 1 ? "er" : "e"}`;

/* liste ordonnée des matchs (slots) d'un ensemble de matchs, avec libellé :
   le numéro n'est affiché que si le type existe en plusieurs exemplaires
   (SH1/SH2, mais DH tout court s'il n'y a qu'un double hommes) */
function slotsDe(matchs) {
  const cles = [...new Set(matchs.map(m => slotCle(m.code)))];
  const multi = {};
  for (const c of cles) if (+c.slice(2) > 1) multi[c.slice(0, 2)] = true;
  return cles.sort((a, b) => TYPE_ORDRE.indexOf(a.slice(0, 2)) - TYPE_ORDRE.indexOf(b.slice(0, 2)) || a.slice(2) - b.slice(2))
    .map(c => ({ cle: c, label: multi[c.slice(0, 2)] ? c : c.slice(0, 2) }));
}
const vj = ms => ({ v: ms.filter(m => m.victoire).length, j: ms.length, pct: ms.length ? ms.filter(m => m.victoire).length / ms.length * 100 : null });
/* cellule "V/J" teintée selon le % de victoire (vert au-dessus de 50 %, rouge en dessous) */
function cellVJ(b, { pctSeul = false } = {}) {
  if (!b.j) return `<span class="muted">–</span>`;
  const d = b.pct - 50, a = Math.min(1, Math.abs(d) / 40) * 0.34;
  const rgb = d >= 0 ? "12,163,12" : "208,59,59";
  return `<span class="vs" style="background:rgba(${rgb},${a.toFixed(3)})" title="${b.v} victoire(s) sur ${b.j} · ${pct(b.pct)}">${pctSeul ? pct(b.pct) : `${b.v}/${b.j}`}</span>`;
}

/* sexe d'un joueur (licence) d'après les listes d'équipes icbad, à défaut d'après le type de match */
const icSexe = new Map();
if (IC) for (const e of IC.equipes) for (const j of e.joueurs) if (j.sexe) icSexe.set(j.licence, j.sexe);
function sexesDuMatch(m) {
  const s = new Set(m.club.map(p => icSexe.get(p.licence)).filter(Boolean));
  if (!s.size) { const t = slotType(m.code); if (t === "MX") return ["H", "F"]; return [t[1] === "H" ? "H" : "F"]; }
  return [...s];
}
const icPrives = new Set(IC?.prives || []);
/* cellule points de cote : "–" expliqué au survol (profil privé, ou pas de donnée) */
const cellPts = (v, licence) => v != null ? `<span class="${deltaCls(v)}">${signed(v)}</span>`
  : `<span class="muted" title="${icPrives.has(licence) ? "Profil myffbad privé : points de cote non publics" : "Points de cote non disponibles"}">${icPrives.has(licence) ? "privé" : "–"}</span>`;
const ptsCote = (licence, numero) => {
  const p = IC?.points_cote?.[licence]; if (!p) return null;
  return numero == null ? Object.values(p).reduce((a, b) => a + b, 0) : (p[String(numero)] ?? null);
};
/* ---------- liens Interclubs <-> Joueurs
   Une fiche complète n'existe que pour les joueurs scrapés (classés R6 ou
   mieux, profil myffbad public) : on la retrouve par licence, à défaut par
   nom normalisé. Les autres joueurs d'interclubs ont une fiche "interclubs
   seulement" (renderJoueurIC), construite à partir des feuilles de match. */
const normNom = x => String(x || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().replace(/[^A-Z]+/g, " ").trim();
const ficheParNom = new Map(DATA.joueurs.map(j => [normNom(j.nom), j]));
const ficheDe = (licence, nom) => byLicence.get(licence) || ficheParNom.get(normNom(nom)) || null;
const icJoueurs = new Map();
if (IC) for (const e of IC.equipes) for (const p of e.joueurs) {
  const x = icJoueurs.get(p.licence) || { ...p, equipes: [] };
  if (!x.equipes.includes(e.numero)) x.equipes.push(e.numero);
  icJoueurs.set(p.licence, x);
}
/* joueurs d'interclubs sans fiche complète */
const icSeulement = () => [...icJoueurs.values()].filter(x => !ficheDe(x.licence, x.nom));
const hrefJoueur = (licence, nom) => {
  const f = ficheDe(licence, nom);
  return f ? "#joueur/" + f.licence : icJoueurs.has(licence) ? "#joueur/" + licence : null;
};
const lienJoueurIC = (licence, nom, court = false) => {
  const h = hrefJoueur(licence, nom), t = esc(court ? nomCourt(nom) : nom);
  return (h ? `<a href="${h}">${t}</a>` : t) + badgeJeune(licence, nom);
};
/* matchs d'interclub d'un joueur d'après les feuilles icbad : [{e, r, m, moi, partenaire}] */
function matchsICDe(licence, nom) {
  if (!IC) return [];
  const n = normNom(nom), out = [];
  for (const e of IC.equipes) for (const r of icRencontresJouees(e)) for (const m of r.matchs) {
    const moi = m.club.find(p => p.licence === licence || normNom(p.nom) === n);
    if (moi && m.victoire != null) out.push({ e, r, m, partenaire: m.club.find(p => p !== moi) || null });
  }
  return out.sort((a, b) => (b.r.date || "").localeCompare(a.r.date || ""));
}
const slotLabel = code => slotType(code) + slotNum(code);

/* section "Interclubs" d'une fiche (complète ou interclubs seulement) */
function sectionICJoueur(licence, nom) {
  const ms = matchsICDe(licence, nom);
  if (!ms.length) return "";
  const eqs = [...new Set(ms.map(x => x.e.numero))].sort((a, b) => a - b);
  const parSlot = {};
  for (const x of ms) parSlot[slotLabel(x.m.code)] = (parSlot[slotLabel(x.m.code)] || 0) + 1;
  return `<section><h2>Interclubs</h2>
    <p class="hint">D'après les feuilles de rencontre icbad. ${eqs.map(n => { const ms2 = ms.filter(x => x.e.numero === n), b = vj(ms2.map(x => x.m));
      const nr = new Set(ms2.map(x => x.r.id)).size;
      return `<a href="#ic/${n}" style="text-decoration:none">${chipRencontres(n, nr)}</a> ${b.v}/${b.j} matchs`; }).join(" · ")} ${chipBlocage(compteurJoue(licence))} · matchs joués : ${Object.entries(parSlot).map(([k, v]) => `${k}${v > 1 ? ` ×${v}` : ""}`).join(" · ")}</p>
    <div class="card scroll"><table class="t"><thead><tr><th>Date</th><th></th><th>Équipe</th><th>Match</th><th class="hide-sm">Rencontre</th><th>Partenaire</th><th>Adversaire(s)</th><th>Score</th></tr></thead><tbody>
    ${ms.map(({ e, r, m, partenaire }) => `<tr>
      <td class="num" style="white-space:nowrap">${r.date ? fDate(r.date) : "–"}</td>
      <td><span class="res ${m.victoire ? "v" : "d"}">${m.victoire ? "V" : "D"}</span></td>
      <td><a class="eq" href="#ic/${e.numero}">Éq. ${e.numero}</a></td>
      <td><b>${slotLabel(m.code)}</b></td>
      <td class="hide-sm">${esc(r.journee)} · ${r.domicile ? "dom." : "ext."} ${esc(r.adversaire)} <span class="muted num">(${r.score_club}-${r.score_adv})</span></td>
      <td>${partenaire ? lienJoueurIC(partenaire.licence, partenaire.nom) : "–"}</td>
      <td>${m.adverse.map(p => `${esc(p.nom)}${p.classement ? ` <span class="muted small">${esc(p.classement)}</span>` : ""}`).join(" / ")}</td>
      <td class="num" style="white-space:nowrap">${esc(m.sets.map(st => st.join("-")).join(" / "))}</td></tr>`).join("")}
    </tbody></table></div></section>`;
}

/* fiche "interclubs seulement" : joueur présent sur icbad sans fiche complète */

/* lien vers la page de la rencontre dans le planificateur (équipes 1 à PLAN_NB, rencontre datée) */

    `<a class="chip ${equipe === e ? "on" : ""}" href="#ic/${e.numero}">Équipe ${e.numero} <span class="muted">· ${esc(e.division)}</span></a>`).join("")}</nav><div id="icPage"></div>`;
