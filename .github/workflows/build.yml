name: Build executables

on:
  push:
    branches: [ main ]
    paths:
      - "pointsIC.py"
      - "roster.py"
      - "pointsIC.spec"
      - "requirements.txt"
      - "macos/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14  # Apple Silicon (arm64)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build standalone binary (onedir)
        run: pyinstaller pointsIC.spec

      - name: Assemble the .app bundle around a Terminal-opening launcher
        run: |
          APP=pointsIC.app
          mkdir -p "$APP/Contents/MacOS/bin"
          cp macos/Info.plist "$APP/Contents/Info.plist"
          cp macos/launcher.sh "$APP/Contents/MacOS/launcher"
          chmod +x "$APP/Contents/MacOS/launcher"
          cp -R dist/pointsIC/. "$APP/Contents/MacOS/bin/"
          chmod +x "$APP/Contents/MacOS/bin/pointsIC"

      - name: Zip the .app bundle (preserves permissions/metadata)
        run: ditto -c -k --keepParent pointsIC.app pointsIC-macos.app.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pointsIC-macos-arm64
          path: pointsIC-macos.app.zip

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build standalone .exe
        run: pyinstaller --onefile --console --name pointsIC pointsIC.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pointsIC-windows
          path: dist/pointsIC.exe

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Delete previous "latest" release (avoid stale/renamed assets)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY"
        continue-on-error: true

      - name: Publish/update the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Dernière version
          make_latest: true
          files: |
            artifacts/pointsIC-macos-arm64/pointsIC-macos.app.zip
            artifacts/pointsIC-windows/pointsIC.exe
