name: Build macOS executable

on:
  push:
    branches: [ main ]
    paths:
      - "pointsIC.py"
      - "pointsIC.spec"
      - "requirements.txt"
      - ".github/workflows/build-macos.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14  # Apple Silicon (arm64)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build standalone .app bundle
        run: pyinstaller pointsIC.spec

      - name: Zip the .app bundle (preserves permissions/metadata)
        run: ditto -c -k --keepParent dist/pointsIC.app pointsIC.app.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pointsIC-macos-arm64
          path: pointsIC.app.zip

      - name: Publish/update the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Dernière version
          make_latest: true
          files: pointsIC.app.zip
