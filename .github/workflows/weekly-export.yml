name: Weekly Excel export

on:
  schedule:
    # Jeudi 01:00 UTC ≈ 2h du matin à Paris en hiver/CET (3h en été/CEST -
    # cron ne gère pas le changement d'heure, donc à ~1h près selon la
    # saison ; la majorité de la saison de badminton, sept-mai, est en
    # heure d'hiver, d'où ce choix).
    - cron: "0 1 * * 4"
  push:
    branches: [ main ]
    paths:
      - "pointsIC.py"
      - "statsJoueurs.py"
      - "roster.py"
      - "results.py"
      - "stats.py"
      - "export_excel.py"
      - "export_web.py"
      - "icbad.py"
      - "historique_ic.py"
      - "web/**"
      - "requirements.txt"
      - ".github/workflows/weekly-export.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-points:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pointsIC.py
        run: python pointsIC.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pointsIC-xlsx
          path: pointsIC.xlsx

  export-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # tests (données fictives, ~20 s) avant tout : une page cassée ne doit
      # être ni générée pendant 35 min, ni publiée
      - name: Run tests
        run: python -m unittest discover -s tests -t .

      # historique des valeurs IC figées par week-end (historique_ic.py) :
      # conservé d'une semaine sur l'autre sur la branche "donnees"
      - name: Fetch IC value history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git clone --quiet --depth 1 --branch donnees "$URL" "$RUNNER_TEMP/donnees"; then
            cp "$RUNNER_TEMP/donnees/historique_valeurs.json" . 2>/dev/null || echo "pas encore d'historique"
          else
            # branche absente (première fois) : dépôt vide, la branche sera créée au push
            mkdir -p "$RUNNER_TEMP/donnees" && cd "$RUNNER_TEMP/donnees"
            git init --quiet -b donnees && git remote add origin "$URL"
          fi

      - name: Run statsJoueurs.py
        env:
          MYFFBAD_LICENCE: ${{ secrets.MYFFBAD_LICENCE }}
          MYFFBAD_PASSWORD: ${{ secrets.MYFFBAD_PASSWORD }}
        # -u : sortie non bufferisée - sans ça, stdout n'étant pas un
        # terminal en CI, Python bufferise tout et les logs (statut par
        # joueur, résumé) ne remontent qu'à la toute fin du run, voire pas
        # du tout s'il timeout avant - rendant impossible de suivre la
        # progression ou de diagnostiquer où ça bloque pendant les ~30 min
        # du run complet.
        run: python -u statsJoueurs.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: statsJoueurs-xlsx
          path: |
            statsJoueurs.xlsx
            statsJoueurs.html
            statsJoueurs_resume.json
            calendrier-*.ics

      # push simple (jamais forcé) : si la branche a bougé ou n'a pas pu être
      # lue, le push est refusé plutôt que d'écraser l'historique existant
      - name: Save IC value history
        if: ${{ success() && hashFiles('historique_valeurs.json') != '' }}
        run: |
          cp historique_valeurs.json "$RUNNER_TEMP/donnees/"
          cd "$RUNNER_TEMP/donnees"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historique_valeurs.json
          if git diff --cached --quiet; then echo "historique inchangé"; exit 0; fi
          git commit --quiet -m "Valeurs IC figées - export du $(date +%Y-%m-%d)"
          git push origin donnees

      # dump complet (cache pour --from-json), gardé en artefact du run
      # seulement - pas publié dans la release
      - name: Upload JSON dump
        uses: actions/upload-artifact@v4
        with:
          name: statsJoueurs-json
          path: statsJoueurs.json

  # Page web hébergée à adresse fixe (GitHub Pages) : même URL chaque semaine,
  # donc le plan du planificateur IC, enregistré dans le navigateur (clé par
  # saison, indépendante de la date des données), est retrouvé après chaque
  # mise à jour. Prérequis, une seule fois : Settings > Pages > Source =
  # "GitHub Actions".
  pages:
    needs: export-stats
    if: ${{ needs.export-stats.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: statsJoueurs-xlsx
          path: export

      - name: Prepare site
        run: |
          mkdir -p site
          cp export/statsJoueurs.html site/index.html
          # chiffres clés de cet export : l'export suivant les compare (Aperçu)
          cp export/statsJoueurs_resume.json site/resume.json || true
          # calendriers des interclubs (abonnement depuis un agenda)
          cp export/calendrier-*.ics site/ 2>/dev/null || true
          touch site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

  # la release précédente est supprimée puis recréée : seulement si les deux
  # exports ont réussi, sinon on garderait une release amputée (constaté :
  # myffbad injoignable -> statsJoueurs.xlsx/html disparus de la release)
  release:
    needs: [export-points, export-stats]
    if: ${{ needs.export-points.result == 'success' && needs.export-stats.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Delete previous export
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete weekly-data --yes --cleanup-tag --repo "$GITHUB_REPOSITORY"
        continue-on-error: true

      - name: Publish the Excel files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: weekly-data
          name: "Export hebdomadaire"
          body: Généré automatiquement tous les jeudis à partir des données myffbad.fr.
          files: |
            artifacts/**/*.xlsx
            artifacts/**/*.html

  # alerte : une issue GitHub (notification par mail au propriétaire du dépôt)
  # quand l'export échoue, complétée si l'échec se répète, fermée dès qu'un
  # export repasse
  alerte:
    needs: [export-points, export-stats, release, pages]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open, update or close the failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULTATS: ${{ toJSON(needs) }}
        run: |
          TITRE="Export hebdomadaire en échec"
          RUN="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          ECHECS=$(echo "$RESULTATS" | jq -r '[to_entries[] | select(.value.result == "failure") | .key] | join(", ")')
          NUM=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITRE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$ECHECS" ]; then
            CORPS="Jobs en échec : **$ECHECS** ($(date -u '+%d/%m/%Y %H:%M') UTC). Détails : $RUN"
            if [ -n "$NUM" ]; then gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body "$CORPS"
            else gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITRE" --body "$CORPS"; fi
          elif [ -n "$NUM" ]; then
            gh issue close "$NUM" --repo "$GITHUB_REPOSITORY" --comment "Export rétabli : $RUN"
          fi
