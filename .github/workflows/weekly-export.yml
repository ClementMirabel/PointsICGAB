name: Weekly Excel export

on:
  schedule:
    # Jeudi 01:00 UTC ≈ 2h du matin à Paris en hiver/CET (3h en été/CEST -
    # cron ne gère pas le changement d'heure, donc à ~1h près selon la
    # saison ; la majorité de la saison de badminton, sept-mai, est en
    # heure d'hiver, d'où ce choix).
    - cron: "0 1 * * 4"
  push:
    branches: [ main ]
    paths:
      - "pointsIC.py"
      - "statsJoueurs.py"
      - "roster.py"
      - "results.py"
      - "stats.py"
      - "export_excel.py"
      - "export_web.py"
      - "icbad.py"
      - "web/**"
      - "requirements.txt"
      - ".github/workflows/weekly-export.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-points:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pointsIC.py
        run: python pointsIC.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pointsIC-xlsx
          path: pointsIC.xlsx

  export-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run statsJoueurs.py
        env:
          MYFFBAD_LICENCE: ${{ secrets.MYFFBAD_LICENCE }}
          MYFFBAD_PASSWORD: ${{ secrets.MYFFBAD_PASSWORD }}
        # -u : sortie non bufferisée - sans ça, stdout n'étant pas un
        # terminal en CI, Python bufferise tout et les logs (statut par
        # joueur, résumé) ne remontent qu'à la toute fin du run, voire pas
        # du tout s'il timeout avant - rendant impossible de suivre la
        # progression ou de diagnostiquer où ça bloque pendant les ~30 min
        # du run complet.
        run: python -u statsJoueurs.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: statsJoueurs-xlsx
          path: |
            statsJoueurs.xlsx
            statsJoueurs.html

      # dump complet (cache pour --from-json), gardé en artefact du run
      # seulement - pas publié dans la release
      - name: Upload JSON dump
        uses: actions/upload-artifact@v4
        with:
          name: statsJoueurs-json
          path: statsJoueurs.json

  # Page web hébergée à adresse fixe (GitHub Pages) : même URL chaque semaine,
  # donc le plan du planificateur IC, enregistré dans le navigateur (clé par
  # saison, indépendante de la date des données), est retrouvé après chaque
  # mise à jour. Prérequis, une seule fois : Settings > Pages > Source =
  # "GitHub Actions".
  pages:
    needs: export-stats
    if: ${{ needs.export-stats.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: statsJoueurs-xlsx
          path: export

      - name: Prepare site
        run: |
          mkdir -p site
          cp export/statsJoueurs.html site/index.html
          touch site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    needs: [export-points, export-stats]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Delete previous export
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete weekly-data --yes --cleanup-tag --repo "$GITHUB_REPOSITORY"
        continue-on-error: true

      - name: Publish the Excel files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: weekly-data
          name: "Export hebdomadaire"
          body: Généré automatiquement tous les jeudis à partir des données myffbad.fr.
          files: |
            artifacts/**/*.xlsx
            artifacts/**/*.html
