name: Weekly Excel export

on:
  schedule:
    # Jeudi 01:00 UTC ≈ 2h du matin à Paris en hiver/CET (3h en été/CEST -
    # cron ne gère pas le changement d'heure, donc à ~1h près selon la
    # saison ; la majorité de la saison de badminton, sept-mai, est en
    # heure d'hiver, d'où ce choix).
    - cron: "0 1 * * 4"
  push:
    branches: [ main ]
    paths:
      - "pointsIC.py"
      - "statsJoueurs.py"
      - "roster.py"
      - "results.py"
      - "stats.py"
      - "export_excel.py"
      - "export_web.py"
      - "icbad.py"
      - "historique_ic.py"
      - "web/**"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/weekly-export.yml"
      - ".github/actions/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Mode du run :
  #  - "complet" (jeudi, lancement manuel, ou push sans dump disponible) :
  #    récupération myffbad + icbad, ~35 min ;
  #  - "page" (push sur main) : tests, puis page et Excel régénérés depuis le
  #    dernier dump (branche "donnees"), sans solliciter myffbad.
  preparer:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - id: mode
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MODE=complet
          if [ "$GITHUB_EVENT_NAME" = "push" ] && \
             gh api "repos/$GITHUB_REPOSITORY/contents/statsJoueurs.json.gz?ref=donnees" --silent 2>/dev/null; then
            MODE=page
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Mode : $MODE"

  export-points:
    needs: preparer
    if: ${{ needs.preparer.outputs.mode == 'complet' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pointsIC.py
        run: python pointsIC.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pointsIC-xlsx
          path: pointsIC.xlsx

  # export complet : étapes dans .github/actions/export-complet
  export-stats:
    needs: preparer
    if: ${{ needs.preparer.outputs.mode == 'complet' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/export-complet
        with:
          tentative: "1"
          licence: ${{ secrets.MYFFBAD_LICENCE }}
          mot-de-passe: ${{ secrets.MYFFBAD_PASSWORD }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # seconde tentative, sur une autre machine (autre adresse IP) : certaines
  # machines GitHub n'arrivent pas à joindre myffbad.fr
  export-stats-2:
    needs: [preparer, export-stats]
    if: ${{ always() && needs.preparer.outputs.mode == 'complet' && needs.export-stats.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/export-complet
        with:
          tentative: "2"
          licence: ${{ secrets.MYFFBAD_LICENCE }}
          mot-de-passe: ${{ secrets.MYFFBAD_PASSWORD }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # mode "page" : régénération depuis le dernier dump (aucun accès à myffbad)
  rebuild:
    needs: preparer
    if: ${{ needs.preparer.outputs.mode == 'page' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -t .

      - name: Fetch last dump and history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --quiet --depth 1 --branch donnees \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/donnees"
          gunzip -c "$RUNNER_TEMP/donnees/statsJoueurs.json.gz" > statsJoueurs.json
          cp "$RUNNER_TEMP/donnees/historique_valeurs.json" . 2>/dev/null || true
          cp "$RUNNER_TEMP/donnees/statsJoueurs_precedent.json" . 2>/dev/null || true

      - name: Rebuild page and Excel from the dump
        run: python -u statsJoueurs.py --from-json statsJoueurs.json

      - name: Upload exports
        uses: actions/upload-artifact@v4
        with:
          name: statsJoueurs-page
          path: |
            statsJoueurs.xlsx
            statsJoueurs.html
            statsJoueurs_resume.json
            calendrier-*.ics

  # Page web hébergée à adresse fixe (GitHub Pages) : même URL chaque semaine,
  # donc le plan du planificateur IC, enregistré dans le navigateur (clé par
  # saison, indépendante de la date des données), est retrouvé après chaque
  # mise à jour. Prérequis, une seule fois : Settings > Pages > Source =
  # "GitHub Actions".
  pages:
    needs: [export-stats, export-stats-2, rebuild]
    if: ${{ always() && contains(needs.*.result, 'success') }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      # artefact de la tentative qui a réussi, ou de la régénération
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.export-stats.result == 'success' && 'statsJoueurs-export-1' || needs.export-stats-2.result == 'success' && 'statsJoueurs-export-2' || 'statsJoueurs-page' }}
          path: export

      - name: Prepare site
        run: |
          mkdir -p site
          cp export/statsJoueurs.html site/index.html
          # chiffres clés de cet export : l'export suivant les compare (Aperçu)
          cp export/statsJoueurs_resume.json site/resume.json || true
          # calendriers des interclubs (abonnement depuis un agenda)
          cp export/calendrier-*.ics site/ 2>/dev/null || true
          touch site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

  # la release précédente est supprimée puis recréée : seulement après un
  # export complet réussi (pointsIC et l'une des deux tentatives), sinon on
  # garderait une release amputée (constaté : myffbad injoignable ->
  # statsJoueurs.xlsx/html disparus de la release)
  release:
    needs: [export-points, export-stats, export-stats-2]
    if: ${{ always() && needs.export-points.result == 'success' && (needs.export-stats.result == 'success' || needs.export-stats-2.result == 'success') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pointsIC-xlsx
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.export-stats.result == 'success' && 'statsJoueurs-export-1' || 'statsJoueurs-export-2' }}
          path: artifacts

      - name: Delete previous export
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete weekly-data --yes --cleanup-tag --repo "$GITHUB_REPOSITORY"
        continue-on-error: true

      - name: Publish the Excel files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: weekly-data
          name: "Export hebdomadaire"
          body: Généré automatiquement tous les jeudis à partir des données myffbad.fr.
          files: |
            artifacts/**/*.xlsx
            artifacts/**/*.html

  # alerte : une issue GitHub (notification par mail au propriétaire du dépôt)
  # quand l'export échoue, complétée si l'échec se répète, fermée dès qu'un
  # export repasse
  alerte:
    needs: [preparer, export-points, export-stats, export-stats-2, rebuild, release, pages]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open, update or close the failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULTATS: ${{ toJSON(needs) }}
        run: |
          TITRE="Export hebdomadaire en échec"
          RUN="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # un échec de la 1re tentative rattrapé par la 2de n'est pas une alerte
          ECHECS=$(echo "$RESULTATS" | jq -r '
            (if .["export-stats-2"].result == "success" then del(.["export-stats"]) else . end)
            | [to_entries[] | select(.value.result == "failure") | .key] | join(", ")')
          NUM=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITRE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$ECHECS" ]; then
            CORPS="Jobs en échec : **$ECHECS** ($(date -u '+%d/%m/%Y %H:%M') UTC). Détails : $RUN"
            if [ -n "$NUM" ]; then gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body "$CORPS"
            else gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITRE" --body "$CORPS"; fi
          elif [ -n "$NUM" ]; then
            gh issue close "$NUM" --repo "$GITHUB_REPOSITORY" --comment "Export rétabli : $RUN"
          fi
